<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ff8cc0">
<meta name="description" content="LaVa Salon & Resto — dandan, salon, dan buka restoran bareng 5 sahabat. Game kartun untuk anak.">
<title>LaVa Salon &amp; Resto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
/* Dunia kartun permen: langit pastel, panel krem hangat, tombol "permen" tebal.
   Satu tema terang yang disengaja (dunia game), semua warna sebagai token. */
:root {
  --ink: #3d2148; --ink2: #7a5a88; --ink3: #b49cc0;
  --paper: #fffaf6; --cream: #fff3e8; --line: #f2dbe8; --line2: #ead2f0;
  --pink: #ff5fa2; --pink2: #ff8cc0; --pinkd: #d93a80;
  --mint: #22c7a9; --mint2: #5fe0c4; --mintd: #10997f;
  --sky: #4fb0ff; --sky2: #8fd0ff; --skyd: #2a82d6;
  --sun: #ffc43d; --sun2: #ffe07a; --sund: #e09412;
  --grape: #9a6bff; --grape2: #c0a2ff; --graped: #7442e0;
  --coral: #ff7a59; --coral2: #ffab8a; --corald: #d9542f;
  --bg-top: #a9e2ff; --bg-mid: #d8f0ff; --bg-bot: #ffe2f0;
  --shadow: rgba(61, 33, 72, .18);
  --f-display: 'Sniglet', 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-ui: 'Baloo 2', 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --r-lg: 28px; --r-md: 20px; --r-sm: 14px;
  --spring: cubic-bezier(.25, 1.45, .45, 1);
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  background: linear-gradient(180deg, var(--bg-top), var(--bg-mid) 46%, var(--bg-bot));
  color: var(--ink); font-family: var(--f-ui); font-size: 16px; line-height: 1.35;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none;
}
button { font: inherit; color: inherit; touch-action: manipulation; }
svg { display: block; overflow: visible; }
input, textarea { font: 600 16px var(--f-ui); color: var(--ink); -webkit-user-select: text; user-select: text; }
:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; border-radius: 12px; }

#app { position: fixed; inset: 0; overflow: hidden; }
.screen { position: absolute; inset: 0; display: none; overflow: hidden; }
.screen.on { display: block; }
.screen.enter { animation: scrIn .55s var(--spring) both; will-change: transform, opacity; }
@keyframes scrIn { from { opacity: 0; transform: scale(.965); } to { opacity: 1; transform: none; } }

/* ---------- langit & awan ---------- */
.skyl { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.cloud { position: absolute; width: 180px; height: 60px; background: #fff; border-radius: 60px; opacity: .9; animation: drift linear infinite; }
.cloud::before, .cloud::after { content: ''; position: absolute; background: #fff; border-radius: 50%; }
.cloud::before { width: 80px; height: 80px; left: 24px; top: -40px; }
.cloud::after { width: 64px; height: 64px; right: 28px; top: -28px; }
@keyframes drift { from { transform: translateX(-260px) scale(var(--s, 1)); } to { transform: translateX(calc(100vw + 260px)) scale(var(--s, 1)); } }

/* ---------- tombol permen ---------- */
.btn {
  --c: var(--pink); --c2: var(--pink2); --d: var(--pinkd);
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: .45em;
  min-height: 52px; padding: .55em 1.3em; border: 0; border-radius: 20px; cursor: pointer;
  font: 800 1.12rem/1.1 var(--f-display); color: #fff; letter-spacing: .01em;
  background: linear-gradient(180deg, var(--c2), var(--c) 58%);
  box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(0,0,0,.08), 0 6px 0 var(--d), 0 12px 20px var(--shadow);
  text-shadow: 0 2px 0 rgba(0,0,0,.16);
  transition: transform .12s, box-shadow .12s, filter .2s;
}
.btn:active, .btn.press { transform: translateY(5px); box-shadow: inset 0 3px 0 rgba(255,255,255,.4), inset 0 -3px 0 rgba(0,0,0,.08), 0 1px 0 var(--d), 0 4px 8px var(--shadow); }
.btn[disabled] { filter: grayscale(.7) opacity(.6); pointer-events: none; }
.btn.mint { --c: var(--mint); --c2: var(--mint2); --d: var(--mintd); }
.btn.sky { --c: var(--sky); --c2: var(--sky2); --d: var(--skyd); }
.btn.sun { --c: var(--sun); --c2: var(--sun2); --d: var(--sund); color: #6a3a00; text-shadow: 0 1px 0 rgba(255,255,255,.4); }
.btn.grape { --c: var(--grape); --c2: var(--grape2); --d: var(--graped); }
.btn.coral { --c: var(--coral); --c2: var(--coral2); --d: var(--corald); }
.btn.white { --c: #ffffff; --c2: #ffffff; --d: #e8d6e6; color: var(--ink); text-shadow: none; }
.btn.big { min-height: 64px; font-size: 1.35rem; padding: .6em 1.6em; border-radius: 24px; }
.btn.small { min-height: 42px; font-size: .95rem; padding: .4em .9em; border-radius: 16px; box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 4px 0 var(--d), 0 8px 14px var(--shadow); }
.btn.small:active { transform: translateY(3px); }
.btn .ic { width: 1.5em; height: 1.5em; flex: none; }
.btn.white .ic { padding: 3px; border-radius: 50%; background: linear-gradient(180deg, var(--pink2), var(--pink)); box-shadow: 0 2px 0 var(--pinkd); }
.btn.round { width: 56px; height: 56px; min-height: 0; padding: 0; border-radius: 50%; }
.btn.round .ic { width: 30px; height: 30px; }
.btn .badge { position: absolute; top: -6px; right: -6px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 12px; background: #ff3b6b; color: #fff; font: 800 13px/24px var(--f-ui); box-shadow: 0 2px 0 #c21f4b; text-shadow: none; }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.wiggle { animation: wiggle 2.4s ease-in-out infinite; }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 84% { transform: rotate(-7deg); } 88% { transform: rotate(7deg); } 92% { transform: rotate(-4deg); } 96% { transform: rotate(3deg); } }

/* ---------- HUD ---------- */
.hud {
  position: absolute; left: 0; right: 0; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px;
  padding: calc(10px + var(--safe-t)) 14px 8px; pointer-events: none;
}
.hud > * { pointer-events: auto; }
.hud .grow { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; height: 50px; padding: 0 14px 0 6px; border-radius: 26px;
  background: rgba(255, 255, 255, .92); box-shadow: 0 4px 0 rgba(61, 33, 72, .1), 0 8px 18px var(--shadow);
  font: 800 1.05rem/1 var(--f-display); color: var(--ink); white-space: nowrap; border: 3px solid #fff;
}
.chip .ic { width: 34px; height: 34px; flex: none; }
.chip .num { font-variant-numeric: tabular-nums; min-width: 1.6em; }
.chip.bump { animation: bump .45s var(--spring); }
@keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }
.pchip { padding: 0 16px 0 4px; gap: 10px; }
.pchip .av { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; background: var(--fc2, #ffd6e3); flex: none; border: 2px solid #fff; }
.pchip .av > svg { width: 100%; height: 100%; }
.pchip .who { display: flex; flex-direction: column; gap: 3px; }
.pchip .nm { font: 800 1rem/1 var(--f-display); }
.lvbar { position: relative; width: 92px; height: 10px; border-radius: 6px; background: #f1e3ef; overflow: hidden; }
.lvbar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--sun), var(--pink)); transition: width .6s var(--spring); }
.lvtag { font: 800 .72rem/1 var(--f-ui); color: var(--ink2); letter-spacing: .04em; text-transform: uppercase; }
@media (max-width: 560px) {
  .hud { gap: 6px; padding-left: 10px; padding-right: 10px; }
  .chip { height: 44px; font-size: .95rem; padding: 0 10px 0 4px; gap: 5px; }
  .chip .ic { width: 28px; height: 28px; }
  .pchip .who { display: none; }
  .pchip { padding: 0 4px; }
  .btn.round { width: 48px; height: 48px; }
  .btn.round .ic { width: 26px; height: 26px; }
}

/* ---------- panel & judul ---------- */
.panel { background: var(--paper); border-radius: var(--r-lg); border: 4px solid #fff; box-shadow: 0 8px 0 rgba(61, 33, 72, .08), 0 18px 40px var(--shadow); }
.ttl { font: 800 clamp(1.6rem, 4.6vw, 2.6rem)/1.05 var(--f-display); color: var(--ink); text-wrap: balance; margin: 0; }
.ttl.white { color: #fff; text-shadow: 0 3px 0 rgba(61, 33, 72, .25), 0 0 18px rgba(255, 95, 162, .35); }
.sub { font: 600 1rem/1.35 var(--f-ui); color: var(--ink2); margin: 0; text-wrap: balance; }
.ribbon { display: inline-block; padding: .3em 1em; border-radius: 999px; background: var(--pink); color: #fff; font: 800 .95rem/1.2 var(--f-display); box-shadow: 0 4px 0 var(--pinkd); }

/* ---------- toast ---------- */
#toasts { position: fixed; left: 50%; top: calc(72px + var(--safe-t)); transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; width: min(92vw, 520px); }
.toast { display: flex; align-items: center; gap: 10px; padding: 10px 18px 10px 10px; border-radius: 24px; background: #fff; box-shadow: 0 6px 0 rgba(61, 33, 72, .1), 0 12px 26px var(--shadow); font: 800 1.02rem/1.25 var(--f-display); animation: toastIn .5s var(--spring) both; }
.toast .tic { width: 40px; height: 40px; flex: none; }
.toast.out { animation: toastOut .35s ease-in both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-20px) scale(.9); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-12px) scale(.95); } }
.saved { position: fixed; left: 14px; top: calc(76px + var(--safe-t)); z-index: 60; display: flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 18px; background: rgba(255, 255, 255, .9); font: 800 .85rem/1 var(--f-ui); color: var(--mintd); opacity: 0; transform: translateY(8px); transition: opacity .3s, transform .3s; pointer-events: none; }
.saved.on { opacity: 1; transform: none; }
.saved .ic { width: 22px; height: 22px; }

/* ---------- modal ---------- */
#modal { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; padding: 18px; background: rgba(61, 33, 72, .42); }
#modal.on { display: flex; animation: fadeIn .25s both; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.mcard { position: relative; width: min(560px, 100%); max-height: calc(100% - 10px); overflow: auto; padding: 26px 22px 22px; background: var(--paper); border-radius: 32px; border: 5px solid #fff; box-shadow: 0 12px 0 rgba(61, 33, 72, .12), 0 30px 60px rgba(61, 33, 72, .35); animation: popIn .5s var(--spring) both; text-align: center; }
.mcard.wide { width: min(760px, 100%); }
@keyframes popIn { from { opacity: 0; transform: scale(.82) translateY(20px); } to { opacity: 1; transform: none; } }
.mcard .mx { position: absolute; top: 10px; right: 10px; }
.mcard > .ttl:first-of-type, .mcard > h3.ttl { padding-left: 46px; padding-right: 46px; }
.mcard .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 16px; }
.mcard .hero { width: min(220px, 52vw); margin: -6px auto 4px; display: flex; align-items: flex-end; justify-content: center; }
.mcard .hero > svg { height: 100%; width: auto; max-width: 100%; }
.codebox { width: 100%; min-height: 84px; padding: 12px; border-radius: 16px; border: 3px dashed var(--line2); background: #fff; font: 600 .82rem/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink2); word-break: break-all; resize: none; text-align: left; }

/* ---------- partikel & wipe ---------- */
#fx { position: fixed; inset: 0; z-index: 75; pointer-events: none; }
#wipe { will-change: transform, opacity; position: fixed; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; z-index: 90; pointer-events: none; transform: scale(0); background: var(--pink); }
.flyer { position: fixed; left: 0; top: 0; z-index: 76; width: 34px; height: 34px; pointer-events: none; }

/* ---------- karakter (animasi) ----------
   Napas = transform pada elemen <svg> (dikomposit GPU, tidak menggambar ulang).
   Kedip dipicu JS sesekali (.blk). Animasi di dalam SVG hanya sementara. */
[hidden] { display: none !important; }
svg.chr { transform-origin: 50% 97%; animation: breathe 3.8s ease-in-out infinite; animation-delay: var(--bd); }
svg.chr:not(.still) { will-change: transform; }
@keyframes breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.006, 1.014); } }
.chr.blk .eye { transform: scaleY(.1); }
.chr .armL, .chr .armR, .chr .fo { transition: transform .4s var(--spring); }
.chr.anim-wave .armR .fo { animation: waveF .42s ease-in-out 8 alternate; }
@keyframes waveF { from { transform: rotate(-10deg); } to { transform: rotate(-52deg); } }
.chr.anim-cheer .ch-root, .chr.anim-jump .ch-root { animation: hop .62s ease-in-out 5; }
@keyframes hop { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(-22px); } }
.chr.anim-clap .armL { animation: clapL .28s ease-in-out 12 alternate; }
.chr.anim-clap .armR { animation: clapR .28s ease-in-out 12 alternate; }
@keyframes clapL { from { transform: rotate(18deg); } to { transform: rotate(8deg); } }
@keyframes clapR { from { transform: rotate(-18deg); } to { transform: rotate(-8deg); } }
.chr .wings { animation: flutter 1.4s ease-in-out infinite; transform-origin: 200px 400px; }
@keyframes flutter { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.92); } }
.chr .bob, .chr .halo { animation: bob 2.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
.chr .lights circle { animation: lit 1.2s steps(2) infinite; }
.chr .lights circle:nth-child(2n) { animation-delay: -.6s; }
@keyframes lit { 0% { opacity: 1; } 100% { opacity: .25; } }
.chr.still, .chr.still *, .reduce svg.chr, .reduce .chr * { animation: none !important; transition: none !important; }
.chr.hopnow .ch-root { animation: hop1 .55s var(--spring); }
@keyframes hop1 { 0% { transform: translateY(0); } 40% { transform: translateY(-30px) scale(1.02, .98); } 100% { transform: none; } }
svg.pet { transform-origin: 50% 92%; animation: petBreath 2.6s ease-in-out infinite; will-change: transform; }
@keyframes petBreath { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.015, .985); } }
.pet .ptail { animation: tail 1.1s ease-in-out 6 alternate; transform-origin: 112px 128px; }
@keyframes tail { from { transform: rotate(-6deg); } to { transform: rotate(8deg); } }
.pet.happy { animation: hop1 .5s var(--spring) 2; }

/* ---------- PEMBUKA & PILIH SAHABAT ---------- */
#scr-title .logo { position: absolute; left: 50%; top: calc(14px + var(--safe-t)); transform: translateX(-50%); width: min(560px, 90vw); text-align: center; z-index: 2; }
.logo .l1 { display: block; font: 800 clamp(1rem, 2.6vw, 1.3rem)/1 var(--f-display); color: var(--pinkd); letter-spacing: .14em; text-transform: uppercase; }
.logo .l2 { display: block; margin-top: 4px; font: 800 clamp(2.4rem, 8vw, 4.4rem)/.95 var(--f-display); color: #fff; letter-spacing: .01em;
  -webkit-text-stroke: 0; text-shadow: 0 4px 0 #ff5fa2, 0 8px 0 #d93a80, 0 14px 22px rgba(61, 33, 72, .3); }
.logo .l2 b { display: inline-block; animation: letterBob 2.8s ease-in-out infinite; }
@keyframes letterBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.logo .l3 { display: inline-block; margin-top: 10px; padding: 6px 16px; border-radius: 999px; background: rgba(255, 255, 255, .85); font: 700 clamp(.9rem, 2.4vw, 1.05rem)/1.2 var(--f-ui); color: var(--ink2); }
.slots { position: absolute; left: 0; right: 0; bottom: calc(86px + var(--safe-b)); top: clamp(150px, 30vh, 230px); display: flex; align-items: stretch; justify-content: center; gap: 14px; padding: 8px 18px 20px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.slots::-webkit-scrollbar { display: none; }
.slot { position: relative; flex: 0 0 auto; width: clamp(150px, 18vw, 210px); scroll-snap-align: center; border: 0; padding: 12px 10px 14px; border-radius: 30px; cursor: pointer; text-align: center;
  background: linear-gradient(180deg, #fff 0%, var(--fc2) 100%); box-shadow: inset 0 -6px 0 rgba(61, 33, 72, .06), 0 8px 0 var(--fc), 0 18px 30px var(--shadow);
  transition: transform .25s var(--spring); display: flex; flex-direction: column; align-items: center; }
.slot:active { transform: translateY(6px) scale(.98); }
.slot:hover { transform: translateY(-4px); }
.slot .sstage { position: relative; width: 100%; flex: 1; min-height: 60px; }
.slot .sstage svg.chr { position: absolute; inset: 0; width: 100%; height: 100%; }
.slot .nm { margin-top: 6px; font: 800 1.45rem/1 var(--f-display); color: var(--ink); }
.slot .meta { margin-top: 6px; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.slot .meta span { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px 3px 5px; border-radius: 12px; background: rgba(255, 255, 255, .85); font: 800 .85rem/1 var(--f-ui); }
.slot .meta .ic { width: 18px; height: 18px; }
.slot .new { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); white-space: nowrap; }
.slot.last { outline: 4px solid #fff; }
.slot .kode { position: absolute; top: 10px; right: 10px; padding: 3px 8px; border-radius: 10px; background: var(--fc); color: #fff; font: 800 .7rem/1 var(--f-ui); }
.titlebar { position: absolute; left: 0; right: 0; bottom: calc(14px + var(--safe-b)); display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 0 14px; }
@media (max-height: 560px) { .slots { top: calc(92px + var(--safe-t)); bottom: 70px; } #scr-title .logo { top: calc(8px + var(--safe-t)); } #scr-title .logo .l3 { display: none; } .logo .l1 { font-size: .9rem; } .logo .l2 { font-size: clamp(2rem, 12vh, 3.4rem); } .slot .meta { display: none; } .slot .nm { font-size: 1.15rem; } .titlebar { bottom: calc(10px + var(--safe-b)); } .titlebar .btn { min-height: 46px; font-size: .95rem; padding: .35em .9em; } .titlebar .btn.round { width: 46px; height: 46px; padding: 0; } }
@media (max-width: 620px) { .slots { justify-content: flex-start; } }
@media (max-aspect-ratio: 1/1) {
  .slots { top: clamp(140px, 19vh, 220px); bottom: calc(136px + var(--safe-b)); padding-left: calc((100vw - min(62vw, 300px)) / 2); padding-right: calc((100vw - min(62vw, 300px)) / 2); justify-content: flex-start; }
  .slot { width: min(62vw, 300px); max-height: 560px; align-self: center; height: 100%; }
}
@media (max-width: 560px) {
  .titlebar { gap: 10px; }
  .titlebar .btn { font-size: 1rem; min-height: 50px; padding: .4em 1em; }
  .titlebar .btn.round { width: 50px; height: 50px; padding: 0; }
}

/* ---------- BERANDA ---------- */
.home-scene { position: absolute; inset: 0; }
.home-scene .facade { position: absolute; left: 50%; bottom: 18%; width: min(560px, 92vw); transform: translateX(-50%); }
.home-scene .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 22%; background: linear-gradient(180deg, #b9e88a, #8fd06a); }
.home-scene .ground::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 26px; background: repeating-linear-gradient(90deg, #f6e7d2 0 70px, #eedbc0 70px 74px); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .06); }
.home-hero { position: absolute; left: 50%; bottom: 6%; height: min(58%, 470px); transform: translateX(-50%); display: flex; align-items: flex-end; cursor: pointer; z-index: 3; }
.home-hero svg.chr { height: 100%; width: auto; }
.home-hero .pet { position: absolute; right: -34%; bottom: -2%; height: 30%; width: auto; }
.speech { position: absolute; z-index: 5; max-width: 230px; padding: 12px 16px; border-radius: 22px; background: #fff; font: 800 1rem/1.25 var(--f-display); color: var(--ink); box-shadow: 0 6px 0 rgba(61, 33, 72, .08), 0 10px 22px var(--shadow); animation: popIn .45s var(--spring) both; text-align: center; }
.speech::after { content: ''; position: absolute; left: 30px; bottom: -12px; border: 12px solid transparent; border-top-color: #fff; border-bottom: 0; }
.acts { position: absolute; z-index: 4; display: grid; gap: 12px; }
.act { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; width: 112px; height: 112px; border: 0; border-radius: 30px; cursor: pointer; color: #fff;
  background: linear-gradient(180deg, var(--c2), var(--c)); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .45), inset 0 -5px 0 rgba(0, 0, 0, .08), 0 7px 0 var(--d), 0 14px 22px var(--shadow);
  font: 800 .98rem/1.05 var(--f-display); text-shadow: 0 2px 0 rgba(0, 0, 0, .15); transition: transform .14s; animation: popIn .6s var(--spring) both; }
.act:active { transform: translateY(6px); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .4), 0 1px 0 var(--d), 0 4px 8px var(--shadow); }

<script>
(() => {

/* ---- 00-util.js ---- */
/* ============================================================
   00-util.js — helpers dasar (DOM, angka, warna, path SVG)
   ============================================================ */
'use strict';

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const r1 = (n) => Math.round(n * 10) / 10;
let _uidN = 0;
const uid = (p = 'u') => p + (++_uidN).toString(36);

function shuffle(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* Membuat elemen HTML dari string (satu root) */
function h(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

/* ---------- warna ---------- */
function hexToRgb(hx) {
  hx = hx.replace('#', '');
  if (hx.length === 3) hx = hx.split('').map((c) => c + c).join('');
  const n = parseInt(hx, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  const c = (v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0');
  return '#' + c(r) + c(g) + c(b);
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t));
}
/* gelapkan dengan bayangan ungu hangat (lebih kartun dari hitam) */
const dark = (c, t = 0.25) => mix(c, '#3a1a3a', t);
const light = (c, t = 0.3) => mix(c, '#ffffff', t);
function lum(hx) {
  const [r, g, b] = hexToRgb(hx).map((v) => {
    v /= 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}

/* ---------- geometri path ---------- */
const pt = (x, y) => r1(x) + ' ' + r1(y);

/* Kapsul (anggota tubuh) dari A ke B dengan jari-jari ra, rb */
function capsule(ax, ay, bx, by, ra, rb = ra) {
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
  const ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
  const k = 1.333;
  const a1 = [ax + nx * ra, ay + ny * ra], a2 = [ax - nx * ra, ay - ny * ra];
  const b1 = [bx + nx * rb, by + ny * rb], b2 = [bx - nx * rb, by - ny * rb];
  return 'M' + pt(...a1) + 'L' + pt(...b1) +
    'C' + pt(b1[0] + ux * rb * k, b1[1] + uy * rb * k) + ' ' + pt(b2[0] + ux * rb * k, b2[1] + uy * rb * k) + ' ' + pt(...b2) +
    'L' + pt(...a2) +
    'C' + pt(a2[0] - ux * ra * k, a2[1] - uy * ra * k) + ' ' + pt(a1[0] - ux * ra * k, a1[1] - uy * ra * k) + ' ' + pt(...a1) + 'Z';
}

/* Helai rambut meruncing: akar (x0,y0), kontrol (cx,cy), ujung (x2,y2), lebar akar w */
function lock(x0, y0, cx, cy, x2, y2, w, tipW = 0) {
  const d0x = cx - x0, d0y = cy - y0, L0 = Math.hypot(d0x, d0y) || 1;
  const n0x = -d0y / L0, n0y = d0x / L0;
  const d1x = x2 - x0, d1y = y2 - y0, L1 = Math.hypot(d1x, d1y) || 1;
  const n1x = -d1y / L1, n1y = d1x / L1;
  const hw = w / 2, cw = hw * 0.85;
  if (tipW > 0) {
    const t = tipW / 2;
    return 'M' + pt(x0 + n0x * hw, y0 + n0y * hw) +
      'Q' + pt(cx + n1x * cw, cy + n1y * cw) + ' ' + pt(x2 + n1x * t, y2 + n1y * t) +
      'L' + pt(x2 - n1x * t, y2 - n1y * t) +
      'Q' + pt(cx - n1x * cw, cy - n1y * cw) + ' ' + pt(x0 - n0x * hw, y0 - n0y * hw) + 'Z';
  }
  return 'M' + pt(x0 + n0x * hw, y0 + n0y * hw) +
    'Q' + pt(cx + n1x * cw, cy + n1y * cw) + ' ' + pt(x2, y2) +
    'Q' + pt(cx - n1x * cw, cy - n1y * cw) + ' ' + pt(x0 - n0x * hw, y0 - n0y * hw) + 'Z';
}

/* Titik pada kurva kuadrat */
function qpt(x0, y0, cx, cy, x2, y2, t) {
  const u = 1 - t;
  return [u * u * x0 + 2 * u * t * cx + t * t * x2, u * u * y0 + 2 * u * t * cy + t * t * y2];
}

/* Bintang n-sudut */
function starPath(cx, cy, R, r, n = 5, rot = -90) {
  let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = ((rot + (i * 180) / n) * Math.PI) / 180;
    const rr = i % 2 ? r : R;
    d += (i ? 'L' : 'M') + pt(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  return d + 'Z';
}
/* Hati */
function heartPath(cx, cy, s) {
  return 'M' + pt(cx, cy + s * 0.9) +
    'C' + pt(cx - s * 1.4, cy + s * 0.05) + ' ' + pt(cx - s * 0.75, cy - s * 0.95) + ' ' + pt(cx, cy - s * 0.35) +
    'C' + pt(cx + s * 0.75, cy - s * 0.95) + ' ' + pt(cx + s * 1.4, cy + s * 0.05) + ' ' + pt(cx, cy + s * 0.9) + 'Z';
}
/* Bunga kecil (5 kelopak) sebagai string SVG */
function flowerSVG(cx, cy, r, petal, center = '#ffd84a') {
  let s = '';
  for (let i = 0; i < 5; i++) {
    const a = (i * 72 - 90) * Math.PI / 180;
    s += `<circle cx="${r1(cx + Math.cos(a) * r * 0.62)}" cy="${r1(cy + Math.sin(a) * r * 0.62)}" r="${r1(r * 0.5)}" fill="${petal}"/>`;
  }
  return s + `<circle cx="${r1(cx)}" cy="${r1(cy)}" r="${r1(r * 0.36)}" fill="${center}"/>`;
}
/* Gelombang (scallop) dari x0 ke x1 pada y, n lengkung, tinggi amp (ke bawah) */
function scallop(x0, x1, y, n, amp) {
  let d = '';
  const w = (x1 - x0) / n;
  for (let i = 0; i < n; i++) {
    const a = x0 + w * i, b = a + w;
    d += 'Q' + pt((a + b) / 2, y + amp * 2) + ' ' + pt(b, y);
  }
  return d;
}

/* Tanggal lokal YYYY-MM-DD */
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');

/* Penyimpanan lokal yang aman (bisa diblokir di mode privat) */

/* ============================================================
   02-defs.js — gradien, pola, mask SVG bersama (dipasang sekali)
   ============================================================ */
const DEFS = (() => {
  const W = 'rgb(255,255,255)', D = 'rgb(58,26,58)';
  function lin(id, x2, y2, stops, extra = '') {
    return `<linearGradient id="${id}" x1="0" y1="0" x2="${x2}" y2="${y2}" ${extra}>` +
      stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('') + '</linearGradient>';
  }
  function rad(id, stops, extra = '') {
    return `<radialGradient id="${id}" ${extra}>` +
      stops.map(([o, c, a = 1]) => `<stop offset="${o}" stop-color="${c}" stop-opacity="${a}"/>`).join('') + '</radialGradient>';
  }
  function pat(id, w, hh, body, extra = '') {
    return `<pattern id="${id}" width="${w}" height="${hh}" patternUnits="userSpaceOnUse" ${extra}>${body}</pattern>`;
  }

  function markup() {
    let s = '';
    /* bayangan silinder untuk kain & kulit */
    s += lin('g-cyl', 1, 0, [[0, D, 0.2], [0.16, W, 0.12], [0.34, W, 0], [0.72, D, 0], [1, D, 0.24]]);
    s += lin('g-vert', 0, 1, [[0, W, 0.18], [0.35, W, 0], [1, D, 0.18]]);
    s += lin('g-vdark', 0, 1, [[0, D, 0], [1, D, 0.28]]);
    s += rad('g-skin', [[0, W, 0.16], [0.55, W, 0], [0.86, D, 0.06], [1, D, 0.16]], 'cx=".46" cy=".38" r=".66"');
    s += rad('g-ball', [[0, W, 0.55], [0.35, W, 0.12], [0.75, D, 0], [1, D, 0.25]], 'cx=".35" cy=".3" r=".75"');
    s += lin('g-eyew', 0, 1, [[0, '#e6e0f2', 1], [0.35, '#ffffff', 1], [1, '#ffffff', 1]]);
    s += rad('g-iris', [[0, W, 0], [0.55, W, 0], [0.8, D, 0.18], [1, D, 0.5]], 'cx=".5" cy=".55" r=".55"');
    s += rad('g-soft', [[0, W, 1], [0.5, W, 0.75], [1, W, 0]]);
    s += `<mask id="m-soft" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#g-soft)"/></mask>`;
    s += lin('g-shine', 0, 1, [[0, W, 0.7], [1, W, 0]]);
    s += lin('g-gold', 0, 1, [[0, '#fff3b0'], [0.45, '#f6c94e'], [1, '#c98a1e']]);
    s += lin('g-silver', 0, 1, [[0, '#ffffff'], [0.5, '#d9deea'], [1, '#9aa3b8']]);
    s += lin('g-glass', 0, 1, [[0, '#ffffff', 0.55], [1, '#bfe6ff', 0.25]]);
    s += lin('g-wing', 0, 1, [[0, '#c9f2ff', 0.85], [0.5, '#ffd6f3', 0.7], [1, '#e9d6ff', 0.55]]);
    s += lin('g-bfly', 0, 1, [[0, '#ffb3d9'], [0.55, '#ff8a5c'], [1, '#ffd84a']]);
    s += lin('g-crystal', 0, 1, [[0, '#ffffff', 0.9], [0.5, '#bfe9ff', 0.75], [1, '#d9c8ff', 0.8]]);
    /* warna rambut spesial */
    const HU = 'gradientUnits="userSpaceOnUse"';
    const linU = (id, y0, y1, stops) => `<linearGradient id="${id}" x1="0" y1="${y0}" x2="0" y2="${y1}" ${HU}>` + stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('') + '</linearGradient>';
    s += linU('hr-rainbow', 70, 470, [[0, '#ff7aa8'], [0.22, '#ffb36b'], [0.42, '#ffe066'], [0.6, '#7fe0a8'], [0.8, '#7cc6ff'], [1, '#b08cff']]);
    s += linU('hr-galaxy', 60, 480, [[0, '#2b2466'], [0.45, '#6a4fd8'], [0.75, '#c86ad8'], [1, '#ff9ad0']]);
    s += linU('hr-ombre', 70, 460, [[0, '#ff8cc8'], [0.45, '#ff9ed0'], [1, '#b79cff']]);
    s += linU('hr-candy', 70, 460, [[0, '#ffb0d8'], [0.5, '#e9c8ff'], [1, '#9fd8ff']]);
    s += linU('hr-gold', 70, 460, [[0, '#6b4332'], [0.4, '#a8703e'], [1, '#f6d27a']]);
    s += lin('lp-rainbow', 1, 0, [[0, '#ff6fae'], [0.35, '#ffb36b'], [0.65, '#7fd8ff'], [1, '#b08cff']]);
    s += lin('es-rainbow', 1, 0, [[0, '#ff8cc6'], [0.33, '#ffd84a'], [0.66, '#7fe0c4'], [1, '#8fb2ff']]);
    s += lin('g-rainbow-v', 0, 1, [[0, '#ff6f8f'], [0.2, '#ffa94d'], [0.4, '#ffe066'], [0.6, '#7fe0a8'], [0.8, '#6fb8ff'], [1, '#a98bff']]);
    s += lin('g-mermaid', 0, 1, [[0, '#7fe0c4'], [0.5, '#5fb8ff'], [1, '#b08cff']]);

    /* pola kain — varian terang (l) untuk kain gelap, varian gelap (d) untuk kain terang */
    const P = (fill, op) => `fill="${fill}" fill-opacity="${op}"`;
    for (const v of ['l', 'd']) {
      const f = v === 'l' ? '#ffffff' : '#3a1a3a';
      const a = v === 'l' ? 0.55 : 0.2;
      s += pat('pt-dots-' + v, 22, 22, `<circle cx="5.5" cy="5.5" r="3.4" ${P(f, a)}/><circle cx="16.5" cy="16.5" r="3.4" ${P(f, a)}/>`);
      s += pat('pt-stripe-' + v, 18, 18, `<rect y="0" width="18" height="7" ${P(f, a * 0.85)}/>`);
      s += pat('pt-stars-' + v, 30, 30, `<path d="${starPath(8, 8, 5.5, 2.3)}" ${P(v === 'l' ? '#fff6b0' : '#e8a92a', v === 'l' ? 0.9 : 0.55)}/><path d="${starPath(23, 22, 3.6, 1.5)}" ${P(f, a)}/>`);
      s += pat('pt-hearts-' + v, 26, 26, `<path d="${heartPath(7, 8, 4.2)}" ${P(v === 'l' ? '#ffffff' : '#ff4f8f', v === 'l' ? 0.75 : 0.45)}/><path d="${heartPath(20, 20, 3)}" ${P(f, a)}/>`);
      s += pat('pt-flowers-' + v, 32, 32, `<g opacity="${v === 'l' ? 0.85 : 0.7}">${flowerSVG(9, 9, 6, v === 'l' ? '#ffffff' : '#ff86b8', '#ffd84a')}${flowerSVG(25, 24, 4.4, v === 'l' ? '#ffe0f0' : '#a78bff', '#fff3a0')}</g>`);
      s += pat('pt-check-' + v, 20, 20, `<rect width="10" height="20" ${P(f, a * 0.55)}/><rect width="20" height="10" ${P(f, a * 0.55)}/>`);
      s += pat('pt-batik-' + v, 34, 34,
        `<g fill="none" stroke="${v === 'l' ? '#fff3d6' : '#4a2410'}" stroke-opacity="${v === 'l' ? 0.6 : 0.45}" stroke-width="1.6">` +
        `<ellipse cx="17" cy="8" rx="5" ry="7.5"/><ellipse cx="17" cy="26" rx="5" ry="7.5"/><ellipse cx="8" cy="17" rx="7.5" ry="5"/><ellipse cx="26" cy="17" rx="7.5" ry="5"/></g>` +
        `<circle cx="17" cy="17" r="2.2" fill="#f2c14e" fill-opacity="0.85"/><circle cx="0" cy="0" r="2" fill="#f2c14e" fill-opacity=".7"/><circle cx="34" cy="34" r="2" fill="#f2c14e" fill-opacity=".7"/><circle cx="34" cy="0" r="2" fill="#f2c14e" fill-opacity=".7"/><circle cx="0" cy="34" r="2" fill="#f2c14e" fill-opacity=".7"/>`);
    }
    /* sisik duyung, tulle, kilau */
    s += pat('pt-scale', 18, 14, `<path d="M0 14 Q9 2 18 14" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6"/><path d="M-9 7 Q0 -5 9 7 M9 7 Q18 -5 27 7" fill="none" stroke="#ffffff" stroke-opacity=".4" stroke-width="1.4"/>`);
    s += pat('pt-glitter', 24, 24, `<circle cx="4" cy="6" r="1.3" fill="#fff" fill-opacity=".9"/><circle cx="15" cy="3" r=".9" fill="#fff6b0"/><circle cx="19" cy="15" r="1.4" fill="#fff" fill-opacity=".8"/><circle cx="8" cy="19" r="1" fill="#fff6b0" fill-opacity=".9"/>`);
    s += pat('pt-knit', 12, 10, `<path d="M0 0 L6 6 L12 0" fill="none" stroke="#3a1a3a" stroke-opacity=".12" stroke-width="1.6"/>`);
    s += pat('pt-wood', 60, 22, `<rect width="60" height="22" fill="none"/><path d="M0 21.5H60" stroke="#5a2d1a" stroke-opacity=".22" stroke-width="1.5"/><path d="M8 7 Q20 4 34 8 T58 7" fill="none" stroke="#5a2d1a" stroke-opacity=".08" stroke-width="1.2"/>`);
    return s;
  }

  let installed = false;
  function install() {
    if (installed) return;
    installed = true;
    const host = document.createElement('div');
    host.innerHTML = `<svg id="gdefs" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>${markup()}</defs></svg>`;
    document.body.prepend(host.firstChild);
  }
  return { install, markup };
})();

/* Isi kain: warna dasar + pola (pakai varian terang/gelap otomatis) */
function patFill(color, patIdx) {
  const p = PATTERNS[patIdx | 0];
  if (!p || !p.id) return null;
  const v = lum(color) > 0.55 ? 'd' : 'l';
  return `url(#pt-${p.id}-${v})`;
}

      s += `<g fill="${fc}" opacity=".55"><circle cx="134" cy="244" r="2.3"/><circle cx="146" cy="249" r="2"/><circle cx="138" cy="256" r="1.8"/><circle cx="153" cy="241" r="1.7"/><circle cx="266" cy="244" r="2.3"/><circle cx="254" cy="249" r="2"/><circle cx="262" cy="256" r="1.8"/><circle cx="247" cy="241" r="1.7"/></g>`;
    }
    // alis
    const by = expr === 'wow' ? -7 : expr === 'calm' ? 2 : 0;
    s += `<g fill="none" stroke="${L.brow}" stroke-width="4.2" stroke-linecap="round"><path d="M136 ${175 + by}Q157 ${165 + by} 179 ${171 + by}"/><path d="M221 ${171 + by}Q243 ${165 + by} 264 ${175 + by}"/></g>`;
    // mata
    if (expr === 'joy' || expr === 'eat') s += eyeClosed(EL[0], EL[1], -1, true, look) + eyeClosed(ER[0], ER[1], 1, true, look);
    else if (expr === 'calm') s += eyeClosed(EL[0], EL[1], -1, false, look) + eyeClosed(ER[0], ER[1], 1, false, look);
    else if (expr === 'wink') s += eyeOpen(EL[0], EL[1], -1, L, look, 'open') + eyeClosed(ER[0], ER[1], 1, true, look);
    else s += eyeOpen(EL[0], EL[1], -1, L, look, expr === 'wow' ? 'wide' : 'open') + eyeOpen(ER[0], ER[1], 1, L, look, expr === 'wow' ? 'wide' : 'open');
    // hidung
    s += `<path d="M195 246Q200 251 205 246" fill="none" stroke="${dark(L.skin, 0.32)}" stroke-width="2.6" stroke-linecap="round"/>`;
    s += `<ellipse cx="203" cy="241" rx="2.6" ry="1.6" fill="#fff" opacity=".5"/>`;
    // mulut
    const mk = { idle: 'smile', happy: 'open', joy: 'open', wink: 'tongue', wow: 'o', calm: 'smile', eat: 'chew', tongue: 'tongue', grin: 'grin' }[expr] || 'smile';
    s += mouth(mk, L, look);
    s += faceSticker(look.st | 0);
    return s;
  }

  /* ---------------- rambut ----------------
     Teknik "siluet gabungan": semua potongan rambut digambar dua kali —
     dulu sebagai garis tepi tebal, lalu isinya — sehingga hanya tepi luar
     yang bergaris (rapi seperti kartun), lalu ditambah helai halus. */
  const CAP_INNER = 'C106 152 144 114 200 113C256 114 294 152 297 216';
  const CAP = 'M90 222C84 124 140 80 200 80C260 80 316 124 310 222L297 216C293 154 258 116 200 114C142 116 107 154 103 216Z';
  const circ = (x, y, r) => `M${r1(x - r)} ${r1(y)}a${r} ${r} 0 1 0 ${r * 2} 0a${r} ${r} 0 1 0 ${-r * 2} 0Z`;
  const MIR = 'translate(400 0) scale(-1 1)';

  function union(shapes, L, sw = 5) {
    const el = shapes.map((x) => (typeof x === 'string' ? `<path d="${x}"/>` : `<path d="${x.d}" transform="${x.t}"/>`)).join('');
    return `<g fill="${L.hairD}" stroke="${L.hairD}" stroke-width="${sw}" stroke-linejoin="round">${el}</g><g fill="${L.hair}">${el}</g>`;
  }
  function lines(ds, L, op = 0.32, w = 2) {
    if (!ds.length) return '';
    return `<g fill="none" stroke="${L.hairD}" stroke-width="${w}" stroke-linecap="round" opacity="${op}">${ds.map((d) => `<path d="${d}"/>`).join('')}</g>`;
  }
  /* helai: kunci rambut + garis tengahnya */
  function L2(arr, x0, y0, cx, cy, x2, y2, w, ln) {
    arr.s.push(lock(x0, y0, cx, cy, x2, y2, w));
    if (ln !== false) {
      const e = qpt(x0, y0, cx, cy, x2, y2, 0.78);
      arr.l.push(`M${x0} ${y0}Q${cx} ${cy} ${r1(e[0])} ${r1(e[1])}`);
    }
  }

  function bangShapes(kind) {
    const A = { s: [], l: [] };
    const base = (tail) => A.s.push('M103 216' + CAP_INNER + tail);
    switch (kind) {
      case 'blunt':
        base('L287 214C284 194 279 180 273 168' + scallop(273, 127, 166, 6, 3.5) + 'C121 180 116 194 113 214Z');
        A.l.push('M160 126Q156 146 151 160', 'M200 120Q200 142 199 162', 'M240 126Q244 146 249 160', 'M180 122Q178 144 175 162', 'M222 122Q224 144 226 162');
        break;
      case 'side':
        base('L288 214C284 190 262 176 230 172C204 168 180 158 166 128C150 150 124 176 114 216Z');
        L2(A, 172, 116, 190, 150, 212, 178, 34); L2(A, 200, 114, 232, 146, 250, 184, 36);
        L2(A, 232, 118, 266, 150, 276, 198, 32); L2(A, 258, 126, 290, 162, 291, 216, 26); L2(A, 152, 124, 128, 152, 117, 200, 24);
        break;
      case 'curtain':
        base('L288 216C282 182 262 156 228 140C214 134 206 126 200 118C194 126 186 134 172 140C138 156 118 182 112 216Z');
        L2(A, 196, 118, 158, 138, 128, 198, 30); L2(A, 184, 124, 142, 152, 118, 216, 24);
        L2(A, 204, 118, 242, 138, 272, 198, 30); L2(A, 216, 124, 258, 152, 282, 216, 24);
        break;
      case 'part':
        base('L290 216C285 170 252 134 204 126L200 120L196 126C148 134 115 170 110 216Z');
        L2(A, 197, 121, 150, 134, 116, 204, 18); L2(A, 203, 121, 250, 134, 284, 204, 18);
        A.l.push('M200 86L200 118');
        break;
      case 'curly': {
        base('L290 216C285 170 252 134 204 126L196 126C148 134 115 170 110 216Z');
        const pts = [[116, 202, 15], [126, 172, 17], [146, 150, 18], [172, 138, 18], [200, 134, 18], [228, 138, 18], [254, 150, 18], [274, 172, 17], [284, 202, 15]];
        for (const [x, y, r] of pts) {
          A.s.push(circ(x, y, r));
          A.l.push(`M${r1(x - r * 0.42)} ${y}a${r1(r * 0.42)} ${r1(r * 0.42)} 0 1 1 ${r1(r * 0.42)} ${r1(r * 0.42)}`);
        }
        break;
      }
      case 'pixie':
        base('L290 200C286 180 270 164 248 160C226 156 196 158 170 150C150 162 128 182 116 214Z');
        L2(A, 160, 118, 172, 146, 188, 172, 34); L2(A, 194, 116, 214, 146, 230, 174, 36); L2(A, 228, 120, 254, 148, 266, 182, 32);
        L2(A, 140, 126, 126, 156, 120, 196, 26); L2(A, 108, 168, 102, 204, 110, 238, 18, false); L2(A, 292, 168, 298, 204, 290, 238, 18, false);
        break;
    }
    return A;
  }

  function sideShapes(kind) {
    if (kind === 'long') return ['M93 196C88 252 92 300 102 336L120 326C110 292 108 252 116 208Z', 'M307 196C312 252 308 300 298 336L280 326C290 292 292 252 284 208Z'];
    if (kind === 'wavy') return ['M93 196C84 236 102 256 94 290C88 314 104 330 110 344Q124 334 120 320C112 300 122 282 116 262C110 240 118 222 116 208Z', 'M307 196C316 236 298 256 306 290C312 314 296 330 290 344Q276 334 280 320C288 300 278 282 284 262C290 240 282 222 284 208Z'];
    if (kind === 'bob') return ['M92 198C84 248 92 290 122 304C128 300 134 294 138 288C120 268 114 240 118 206Z', 'M308 198C316 248 308 290 278 304C272 300 266 294 262 288C280 268 286 240 282 206Z'];
    return [];
  }

  function scrunchie(x, y, L, rx = 13, ry = 9, rot = 0) {
    const d = dark(L.tie, 0.35);
    return `<g transform="translate(${x} ${y}) rotate(${rot})"><ellipse rx="${rx}" ry="${ry}" fill="${L.tie}" stroke="${d}" stroke-width="2.2"/>` +
      `<path d="M${r1(-rx * 0.55)} ${r1(-ry * 0.15)}Q0 ${r1(-ry * 0.95)} ${r1(rx * 0.55)} ${r1(-ry * 0.15)}" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2.6" stroke-linecap="round"/>` +
      `<path d="M${r1(-rx * 0.35)} ${r1(ry * 0.5)}Q0 ${r1(ry * 0.8)} ${r1(rx * 0.35)} ${r1(ry * 0.5)}" fill="none" stroke="${d}" stroke-opacity=".45" stroke-width="1.8" stroke-linecap="round"/></g>`;
  }
  function bobble(x, y, L, r = 9) {
    const d = dark(L.tie, 0.35);
    return `<circle cx="${x}" cy="${y}" r="${r}" fill="${L.tie}" stroke="${d}" stroke-width="2"/><circle cx="${x}" cy="${y}" r="${r}" fill="url(#g-ball)"/>` +
      `<circle cx="${x + r * 1.1}" cy="${y + r * 0.7}" r="${r * 0.72}" fill="${L.tie}" stroke="${d}" stroke-width="2"/><circle cx="${x + r * 1.1}" cy="${y + r * 0.7}" r="${r * 0.72}" fill="url(#g-ball)"/>`;
  }

  function braid(x0, y0, x1, y1, n, w, L) {
    let s = '';
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const x = lerp(x0, x1, t), y = lerp(y0, y1, t);
      const rot = i % 2 ? 24 : -24;
      const ww = w * (1 - t * 0.18);
      s += `<ellipse cx="${r1(x)}" cy="${r1(y)}" rx="${r1(ww)}" ry="${r1(ww * 1.18)}" transform="rotate(${rot} ${r1(x)} ${r1(y)})" fill="${L.hair}" stroke="${L.hairD}" stroke-width="2.4"/>`;
      s += `<path d="M${r1(x - ww * 0.5)} ${r1(y - ww * 0.2)}Q${r1(x)} ${r1(y - ww * 0.75)} ${r1(x + ww * 0.45)} ${r1(y - ww * 0.35)}" fill="none" stroke="${L.hairShine}" stroke-opacity=".6" stroke-width="2.6" stroke-linecap="round"/>`;
    }
    s += union([lock(x1, y1 + 8, x1 - 6, y1 + 26, x1 - 10, y1 + 42, 16), lock(x1, y1 + 8, x1 + 6, y1 + 26, x1 + 9, y1 + 42, 16)], L, 4);
    s += scrunchie(x1, y1 + 10, L, 12, 7);
    return s;
  }

  function shine(L, kind) {
    const c = L.hairShine;
    if (kind === 'curly') return `<g fill="${c}" opacity=".5"><path d="${lock(158, 120, 168, 112, 182, 110, 7)}"/><path d="${lock(218, 110, 232, 112, 242, 120, 7)}"/></g>`;
    let s = '';
    const seg = [[0.1, 0.24], [0.3, 0.46], [0.54, 0.7], [0.76, 0.88]];
    for (const [a, b] of seg) {
      const p0 = qpt(128, 132, 200, 64, 272, 132, a), pm = qpt(128, 132, 200, 64, 272, 132, (a + b) / 2), p1 = qpt(128, 132, 200, 64, 272, 132, b);
      s += `<path d="M${r1(p0[0])} ${r1(p0[1])}Q${r1(pm[0])} ${r1(pm[1] - 5)} ${r1(p1[0])} ${r1(p1[1])}Q${r1(pm[0])} ${r1(pm[1] + 5)} ${r1(p0[0])} ${r1(p0[1])}Z"/>`;
    }
    return `<g fill="${c}" opacity=".8">${s}</g>`;
  }

  /* Bagian rambut: {back, over, front} */
  function hair(look, L) {
    const H = HAIRS[look.hs | 0] || HAIRS[0];
    const bS = [], bL = [];   // belakang
    const oS = [], oL = [];   // di depan badan
    let backX = '', overX = '', tiesF = '';

    // ekstra di belakang kepala
    switch (H.ex) {
      case 'twin': {
        const tail = 'M114 116C70 108 38 160 42 232C46 292 72 330 60 380C54 398 44 408 32 414C72 420 94 386 96 340C98 290 78 240 94 190C100 166 110 146 126 132Z';
        bS.push(tail, { d: tail, t: MIR });
        bL.push('M88 160Q60 230 70 310', 'M312 160Q340 230 330 310', 'M100 150Q76 240 84 340', 'M300 150Q324 240 316 340');
        tiesF += bobble(104, 122, L, 9) + bobble(282, 122, L, 9);
        break;
      }
      case 'pony':
        bS.push('M236 94C300 70 354 128 342 214C334 270 346 320 366 352C322 352 300 314 302 268C304 212 292 160 250 128Z');
        bL.push('M270 110Q320 160 316 250', 'M300 130Q336 200 330 290', 'M290 120Q330 180 328 260');
        tiesF += scrunchie(256, 90, L, 14, 9, 32);
        break;
      case 'bun': bS.push(circ(200, 62, 40)); bL.push('M178 62a22 22 0 1 1 22 22', 'M188 60a12 12 0 1 1 12 12'); tiesF += scrunchie(200, 92, L, 26, 9); break;
      case 'buns':
        bS.push(circ(126, 90, 34), circ(274, 90, 34)); bL.push('M108 90a18 18 0 1 1 18 18', 'M256 90a18 18 0 1 1 18 18');
        tiesF += scrunchie(140, 116, L, 18, 8, -35) + scrunchie(260, 116, L, 18, 8, 35);
        break;
      case 'halfup': bS.push(circ(200, 74, 22)); break;
      case 'puffs':
        for (const [x, y, r] of [[112, 92, 30], [134, 72, 28], [98, 122, 24], [288, 92, 30], [266, 72, 28], [302, 122, 24]]) {
          bS.push(circ(x, y, r)); bL.push(`M${x - r * 0.45} ${y}a${r * 0.45} ${r * 0.45} 0 1 1 ${r * 0.45} ${r * 0.45}`);
        }
        tiesF += scrunchie(130, 118, L, 18, 8, -35) + scrunchie(270, 118, L, 18, 8, 35);
        break;
    }
    // rambut belakang utama
    switch (H.back) {
      case 'long':
        bS.push('M90 200C86 280 88 370 92 452L106 468L122 456L140 470L158 458L242 458L260 470L278 456L294 468L308 452C312 370 314 280 310 200C304 116 262 80 200 80C138 80 96 116 90 200Z');
        bL.push('M100 240Q96 340 104 440', 'M300 240Q304 340 296 440', 'M112 300Q110 380 118 450', 'M288 300Q290 380 282 450');
        break;
      case 'wavy':
        bS.push('M90 200C76 250 100 290 86 330C72 372 100 410 86 452Q84 482 112 478Q120 494 140 486L260 486Q280 494 288 478Q316 482 314 452C300 410 328 372 314 330C300 290 324 250 310 200C304 116 262 80 200 80C138 80 96 116 90 200Z');
        bL.push('M98 260Q86 320 98 380Q108 420 98 460', 'M302 260Q314 320 302 380Q292 420 302 460');
        break;
      case 'mermaid':
        bS.push('M90 200C72 260 104 300 84 350C66 400 104 440 84 490C74 520 92 548 118 556Q134 566 150 552L250 552Q266 566 282 556C308 548 326 520 316 490C296 440 334 400 316 350C296 300 328 260 310 200C304 116 262 80 200 80C138 80 96 116 90 200Z');
        bL.push('M98 270Q84 340 100 400Q112 450 96 510', 'M302 270Q316 340 300 400Q288 450 304 510', 'M112 300Q104 380 116 440', 'M288 300Q296 380 284 440');
        break;
      case 'shoulder':
        bS.push('M92 200C90 260 92 312 98 340Q104 352 120 350L136 340L264 340L280 350Q296 352 302 340C308 312 310 260 308 200C302 116 262 80 200 80C138 80 98 116 92 200Z');
        break;
      case 'bob':
        bS.push('M88 206C84 256 92 292 122 302L278 302C308 292 316 256 312 206C306 118 262 80 200 80C138 80 94 118 88 206Z');
        break;
      case 'curly':
        for (const [x, y, r] of [[200, 90, 50], [142, 104, 46], [258, 104, 46], [106, 152, 44], [294, 152, 44], [92, 210, 44], [308, 210, 44], [96, 268, 42], [304, 268, 42], [112, 318, 38], [288, 318, 38], [150, 330, 34], [250, 330, 34]]) {
          bS.push(circ(x, y, r));
          bL.push(`M${r1(x - r * 0.45)} ${r1(y - r * 0.1)}a${r1(r * 0.42)} ${r1(r * 0.42)} 0 1 1 ${r1(r * 0.5)} ${r1(r * 0.35)}`);
        }
        break;
      case 'pixie':
        bS.push('M96 196C94 232 100 256 112 262L288 262C300 256 306 232 304 196C300 118 262 82 200 82C138 82 100 118 96 196Z');
        break;
      default:
        bS.push('M89 194C89 128 140 81 200 81C260 81 311 128 311 194C311 260 260 307 200 307C140 307 89 260 89 194Z');
    }
    // di depan badan
    switch (H.ex) {
      case 'braids': overX += braid(110, 250, 122, 418, 8, 15, L) + braid(290, 250, 278, 418, 8, 15, L); break;
      case 'sidebraid': overX += braid(286, 236, 268, 440, 9, 18, L); break;
      case 'sidepony':
        oS.push('M104 150C62 156 50 214 60 272C68 318 58 352 42 380C82 384 98 344 96 300C94 250 104 210 120 176Z');
        oL.push('M84 190Q66 250 76 320', 'M96 200Q80 260 86 330');
        tiesF += scrunchie(108, 158, L, 13, 10, -60);
        break;
      case 'low': {
        const t = 'M110 250C86 262 82 300 96 340C106 368 104 394 92 414C120 410 130 380 124 344C120 314 122 286 130 266Z';
        oS.push(t, { d: t, t: MIR }); oL.push('M106 280Q96 330 108 380', 'M294 280Q304 330 292 380');
        overX += scrunchie(114, 262, L, 11, 8, 10) + scrunchie(286, 262, L, 11, 8, -10);
        break;
      }
    }
    // depan: sisi + topi rambut + poni
    const BG = bangShapes(H.bangs);
    const side = H.side ? sideShapes(H.side) : [];
    const wisp = H.tied && H.bangs !== 'pixie' ? [lock(110, 180, 102, 210, 110, 244, 12), lock(290, 180, 298, 210, 290, 244, 12)] : [];
    const fS = [...side, CAP, ...BG.s, ...wisp];
    const fL = ['M200 84Q172 96 150 116', 'M200 84Q228 96 250 116', ...BG.l];
    // bayangan poni di dahi
    let front = `<clipPath id="${L.id}fc"><path d="${FACE}"/></clipPath>` +
      `<g clip-path="url(#${L.id}fc)"><g transform="translate(3 7)" fill="${L.skin2}" opacity=".38">${[...side, ...BG.s, ...wisp].map((d) => `<path d="${d}"/>`).join('')}</g></g>`;
    front += union(fS, L) + lines(fL, L) + shine(L, H.back === 'curly' ? 'curly' : '') + tiesF;
    const back = union(bS, L) + lines(bL, L, 0.28) + backX;
    const over = (oS.length ? union(oS, L) + lines(oL, L, 0.28) : '') + overX;
    return { back, over, front, tied: !!H.tied };
  }

  /* ---------------- kerudung ---------------- */
  function hijab(c) {
    const d = dark(c, 0.25);
    const back = `<path d="M200 70C122 70 80 128 82 206C84 282 98 326 118 350C140 378 170 392 200 394C230 392 260 378 282 350C302 326 316 282 318 206C320 128 278 70 200 70Z" fill="${c}" stroke="${d}" stroke-width="2.4"/>`;
    const drape = `<path d="M128 300C140 330 120 380 112 410Q200 440 288 410C280 380 260 330 272 300Q240 320 200 322Q160 320 128 300Z" fill="${c}" stroke="${d}" stroke-width="2.4"/>` +
      `<path d="M128 300C140 330 120 380 112 410Q200 440 288 410C280 380 260 330 272 300Q240 320 200 322Q160 320 128 300Z" fill="url(#g-vert)"/>` +
      `<path d="M168 330Q160 370 156 414M232 330Q240 370 244 414" stroke="${d}" stroke-width="2" fill="none" opacity=".5"/>`;
    const ring = `<path fill-rule="evenodd" d="M200 82C128 82 90 136 92 210C94 270 140 316 200 318C260 316 306 270 308 210C310 136 272 82 200 82ZM200 132C150 132 116 164 114 212C112 262 152 298 200 300C248 298 288 262 286 212C284 164 250 132 200 132Z" fill="${c}" stroke="${d}" stroke-width="2.4"/>` +
      `<path d="M120 170Q200 120 280 170" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="7" stroke-linecap="round"/>` +
      `<circle cx="270" cy="276" r="7" fill="url(#g-gold)" stroke="#c98a1e" stroke-width="1.4"/><circle cx="268" cy="274" r="2" fill="#fff" opacity=".8"/>`;
    return { back, drape, ring };
  }

  /* ---------------- aksesoris kepala ---------------- */
  function headAcc(k, c) {
    const d = dark(c, 0.3);
    switch (k) {
      case 1: { // pita besar
        return `<g transform="translate(262 106) rotate(22)">` +
          `<path d="M-6 6L-22 44L-8 40L2 50L4 8Z" fill="${c}" stroke="${d}" stroke-width="2.2" stroke-linejoin="round"/>` +
          `<path d="M6 6L22 42L8 38L-2 48L-4 8Z" fill="${dark(c, 0.08)}" stroke="${d}" stroke-width="2.2" stroke-linejoin="round"/>` +
          `<path d="M0 0C-26 -30 -54 -14 -50 4C-46 22 -18 18 0 4Z" fill="${c}" stroke="${d}" stroke-width="2.4" stroke-linejoin="round"/>` +
          `<path d="M0 0C26 -30 54 -14 50 4C46 22 18 18 0 4Z" fill="${c}" stroke="${d}" stroke-width="2.4" stroke-linejoin="round"/>` +
          `<path d="M-36 -8Q-24 -14 -14 -6M36 -8Q24 -14 14 -6" stroke="#fff" stroke-opacity=".5" stroke-width="3" fill="none" stroke-linecap="round"/>` +
          `<ellipse cx="0" cy="3" rx="10" ry="11" fill="${c}" stroke="${d}" stroke-width="2.4"/><ellipse cx="-3" cy="-1" rx="3.5" ry="3" fill="#fff" opacity=".55"/></g>`;

      case 2: return `<path d="${starPath(126, 152, 14, 6)}" fill="url(#g-gold)" stroke="#c98a1e" stroke-width="1.6" stroke-linejoin="round"/><path d="${starPath(148, 130, 10, 4.2)}" fill="#ff8cc6" stroke="#e05a9a" stroke-width="1.4" stroke-linejoin="round"/>`;
      case 3: return `<path d="M104 196C98 124 148 88 200 88C252 88 302 124 296 196" fill="none" stroke="${d}" stroke-width="15" stroke-linecap="round"/><path d="M104 196C98 124 148 88 200 88C252 88 302 124 296 196" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round"/><path d="M130 124Q200 84 270 124" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>`;
      case 4: {
        let s = `<path d="M104 196C98 124 148 88 200 88C252 88 302 124 296 196" fill="none" stroke="#d9cbb8" stroke-width="5"/>`;
        for (let i = 0; i <= 14; i++) {
          const t = i / 14;
          const p = i <= 7 ? qpt(104, 196, 112, 92, 200, 88, t * 2) : qpt(200, 88, 288, 92, 296, 196, (t - 0.5) * 2);

      case 5: {
        const ear = (x, rot) => `<g transform="translate(${x} 100) rotate(${rot})"><path d="M-28 16L-4 -40L26 10Z" fill="${c}" stroke="${d}" stroke-width="2.4" stroke-linejoin="round"/><path d="M-16 8L-4 -24L12 6Z" fill="#ffb3c9"/></g>`;

      case 6: {

        return ear(164, -14) + ear(236, 14) + headAcc(3, c);
      }
      case 7: {
        const ear = (x) => `<circle cx="${x}" cy="92" r="24" fill="${c}" stroke="${d}" stroke-width="2.4"/><circle cx="${x}" cy="94" r="12" fill="${light(c, 0.45)}"/>`;
        return ear(126) + ear(274) + headAcc(3, c);
      }
      case 8: {

  /* ---------------- aksesoris badan ---------------- */
  function backAcc(k, c) {
    switch (k) {
      case 1: return `<g class="wings">` +
        `<path d="M196 380C150 300 60 220 40 270C22 316 90 372 196 396Z" fill="url(#g-wing)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>` +
        `<path d="M204 380C250 300 340 220 360 270C378 316 310 372 204 396Z" fill="url(#g-wing)" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>` +
        `<path d="M196 404C140 420 70 480 96 506C122 530 172 470 198 420Z" fill="url(#g-wing)" stroke="#ffffff" stroke-width="3"/>` +

        `<path d="M180 380Q110 300 60 274M220 380Q290 300 340 274" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>` +
        CHH.sparkle4(70, 282, 6) + CHH.sparkle4(330, 282, 6) + CHH.sparkle4(108, 488, 5) + CHH.sparkle4(292, 488, 5) + `</g>`;
      case 2: {
        const wing = (m) => `<g ${m ? 'transform="translate(400 0) scale(-1 1)"' : ''}>` +
          `<path d="M190 372C150 320 92 286 50 300C40 332 60 358 76 370C62 380 66 400 84 404C76 418 88 432 106 430C112 444 134 446 146 432C160 430 180 414 192 398Z" fill="#ffffff" stroke="#d9d6e6" stroke-width="2.6" stroke-linejoin="round"/>` +

        return `<g class="wings">${wing(0)}${wing(1)}</g>`;

      case 3: return `<g class="wings">` +
        `<path d="M196 384C150 290 70 250 54 300C40 344 110 380 196 396Z" fill="url(#g-bfly)" stroke="#c25a3a" stroke-width="2.6"/>` +
        `<path d="M204 384C250 290 330 250 346 300C360 344 290 380 204 396Z" fill="url(#g-bfly)" stroke="#c25a3a" stroke-width="2.6"/>` +

      case 4: return cloth('M150 330Q200 318 250 330L304 606Q200 626 96 606Z', c, 0, { grad: 'g-vdark' }) +
        `<path d="M150 330Q200 318 250 330L262 380Q200 366 138 380Z" fill="${dark(c, 0.25)}" opacity=".5"/>`;
      case 5: return cloth('M138 346Q138 330 158 330L242 330Q262 330 262 346L264 452Q264 466 248 466L152 466Q136 466 136 452Z', c, 0);

  }
  function backFront(k, c) { // bagian depan aksesoris punggung (tali ransel, bros jubah)
    if (k === 5) return cloth('M158 328L168 324L176 446L164 448Z', dark(c, 0.15), 0, { sw: 1.8 }) + cloth('M242 328L232 324L224 446L236 448Z', dark(c, 0.15), 0, { sw: 1.8 });
    if (k === 4) return `<circle cx="200" cy="334" r="8" fill="url(#g-gold)" stroke="#c98a1e" stroke-width="1.6"/><circle cx="198" cy="332" r="2.4" fill="#fff"/>`;

      case 2: return `<path d="M176 326Q200 372 224 326" fill="none" stroke="#e9b44c" stroke-width="2.4"/><path d="${heartPath(200, 360, 10)}" fill="#ff4f8f" stroke="#c2185b" stroke-width="1.6"/><ellipse cx="196" cy="356" rx="3" ry="2" fill="#fff" opacity=".7"/>`;
      case 3: return `<path d="M200 334L176 320L178 350ZM200 334L224 320L222 350Z" fill="${c}" stroke="${dark(c, 0.35)}" stroke-width="2" stroke-linejoin="round"/><circle cx="200" cy="335" r="6.5" fill="${dark(c, 0.1)}" stroke="${dark(c, 0.35)}" stroke-width="2"/>`;
      case 4: return cloth('M166 322Q200 344 234 322L238 340Q200 362 162 340Z', c, 2) + cloth('M168 336L190 344L184 424L162 420Z', c, 2) +
        `<path d="M162 420L184 424M162 420l-2 10M168 421l-1 10M174 422l0 10M180 423l1 10" stroke="${dark(c, 0.3)}" stroke-width="2" stroke-linecap="round"/>`;
      case 5: {

  /* barang di tangan kiri (koordinat dunia; posisi tangan dihitung dari pose) */
  function handItem(k, c, hx, hy) {

        `<path d="M-22 6L22 6L18 40Q0 46 -18 40Z" fill="${c}" stroke="${dark(c, 0.35)}" stroke-width="2.2" stroke-linejoin="round"/><path d="M-22 6L22 6L18 40Q0 46 -18 40Z" fill="url(#g-cyl)"/>` +
        `<path d="M-22 6L0 22L22 6" fill="${dark(c, 0.08)}" stroke="${dark(c, 0.35)}" stroke-width="2"/><circle cx="0" cy="22" r="4" fill="url(#g-gold)"/></g>`;
      case 2: return `<g ${T(0, 0)}><path d="M0 8L-30 -84" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/><path d="M0 8L-30 -84" stroke="#e8c8ff" stroke-width="3" stroke-linecap="round"/>` +
        `<path d="${starPath(-33, -96, 20, 8.5)}" fill="url(#g-gold)" stroke="#c98a1e" stroke-width="2" stroke-linejoin="round"/>` +
        CHH.sparkle4(-60, -110, 6, '#fff6b0') + CHH.sparkle4(-10, -124, 5, '#ffffff') + `</g>`;
      case 3: return `<g ${T(0, 0)}><path d="M0 4Q-30 -50 -62 -112" fill="none" stroke="#9aa3b8" stroke-width="1.8"/><g class="bob"><path d="${heartPath(-66, -146, 30)}" fill="#ff4f7f" stroke="#c2185b" stroke-width="2.4"/><ellipse cx="-78" cy="-156" rx="7" ry="4.5" fill="#fff" opacity=".6" transform="rotate(-30 -78 -156)"/><path d="M-70 -118l4 6l4 -6Z" fill="#c2185b"/></g></g>`;
      case 4: return `<g ${T(0, 0)}><path d="M-12 -6L12 -6L0 30Z" fill="#e8b46a" stroke="#b07a3a" stroke-width="2" stroke-linejoin="round"/><path d="M-8 2L6 14M-2 -4L8 4M-10 -2L4 22" stroke="#b07a3a" stroke-width="1.4" opacity=".6"/>` +
        `<circle cx="0" cy="-16" r="15" fill="#ffb3d1" stroke="#e57aa4" stroke-width="2"/><circle cx="2" cy="-36" r="12" fill="#9fe8cb" stroke="#5cc4a0" stroke-width="2"/><circle cx="2" cy="-50" r="4.5" fill="#f2445f"/><ellipse cx="-5" cy="-20" rx="4" ry="3" fill="#fff" opacity=".6"/></g>`;
      case 5: return `<g ${T(2, 4)}><circle cx="-14" cy="-26" r="8" fill="#b07a4a" stroke="#7a4a2a" stroke-width="2"/><circle cx="14" cy="-26" r="8" fill="#b07a4a" stroke="#7a4a2a" stroke-width="2"/>` +
        `<ellipse cx="0" cy="18" rx="18" ry="20" fill="#c08a5a" stroke="#7a4a2a" stroke-width="2"/><circle cx="0" cy="-14" r="17" fill="#c08a5a" stroke="#7a4a2a" stroke-width="2"/>` +
        `<ellipse cx="0" cy="-8" rx="8" ry="6" fill="#ead2b0"/><circle cx="-6" cy="-17" r="2.2" fill="#2a1726"/><circle cx="6" cy="-17" r="2.2" fill="#2a1726"/><ellipse cx="0" cy="-10" rx="3" ry="2.2" fill="#2a1726"/>` +
        `<path d="M-10 2Q0 10 10 2" stroke="#f2445f" stroke-width="5" fill="none"/></g>`;
      case 6: return `<g ${T(0, 0)}><path d="M-14 -12L14 -12L4 26L-4 26Z" fill="#c9f0d8" stroke="#5cc47e" stroke-width="2" stroke-linejoin="round"/>` +
        `<ellipse cx="-14" cy="-20" rx="8" ry="4" fill="#5ccf86" transform="rotate(-30 -14 -20)"/><ellipse cx="14" cy="-20" rx="8" ry="4" fill="#5ccf86" transform="rotate(30 14 -20)"/>` +
        flowerSVG(-10, -28, 11, '#ff7ab8') + flowerSVG(10, -30, 11, '#ffd84a') + flowerSVG(0, -44, 11, '#b49bff') + `<path d="M-6 4Q0 10 6 4" stroke="#ff7ab8" stroke-width="4" fill="none"/></g>`;
      case 7: return `<g ${T(4, 4)}><rect x="-22" y="-14" width="44" height="30" rx="7" fill="#3a3550" stroke="#221e30" stroke-width="2"/><rect x="-12" y="-20" width="16" height="8" rx="3" fill="#3a3550"/>` +
        `<circle cx="2" cy="1" r="11" fill="#6a6a8a" stroke="#221e30" stroke-width="2"/><circle cx="2" cy="1" r="6" fill="#2a4a8a"/><circle cx="-1" cy="-2" r="2.4" fill="#fff" opacity=".8"/><circle cx="15" cy="-8" r="3" fill="#ff5f7f"/></g>`;
      case 8: return `<g ${T(0, 0)}><rect x="-5" y="-10" width="10" height="40" rx="4" fill="#3a3550"/><circle cx="0" cy="-20" r="14" fill="#cfd4e6" stroke="#8a90a8" stroke-width="2"/><path d="M-10 -24h20M-12 -18h24M-10 -12h20" stroke="#8a90a8" stroke-width="1.4"/><ellipse cx="-5" cy="-26" rx="4" ry="3" fill="#fff" opacity=".7"/></g>`;
      default: return '';

  }

  function apron(c) {
    const d = dark(c, 0.3);
    return cloth('M170 360Q200 352 230 360L232 440Q260 452 266 540Q200 556 134 540Q140 452 168 440Z', c, 0) +

      `<path d="M178 462H222V488Q200 496 178 488Z" fill="${dark(c, 0.06)}" stroke="${d}" stroke-width="1.8"/>` +
      `<path d="${heartPath(200, 392, 10)}" fill="#ffffff" opacity=".9"/>` +
      `<path d="M138 536${scallop(134, 266, 540, 8, 3)}" fill="none" stroke="#ffffff" stroke-width="3" opacity=".8"/>`;

/* ---- 12-char.js ---- */
/* ============================================================
   12-char.js — merakit karakter lengkap + pose + ekspresi
   ============================================================ */
const CH = (() => {
  const B = CHB.B;
  const HEAD_K = 1.16;

  const POSES = {
    idle: { L: [0, 0], R: [0, 0] },
    hold: { L: [6, -40], R: [0, 0] },
    wave: { L: [0, 0], R: [-128, -30], anim: 'wave' },
    cheer: { L: [148, 12], R: [-148, -12], anim: 'cheer' },
    hips: { L: [34, -112], R: [-34, 112] },
    peace: { L: [0, 0], R: [-44, -118], hR: 'peace' },
    tray: { L: [14, -78], R: [-14, 78] },
    clap: { L: [18, -70], R: [-18, 70], anim: 'clap' },
    point: { L: [0, 0], R: [-70, -20] },
    jump: { L: [120, 30], R: [-120, -30], anim: 'jump' },
  };

  function rotP(p, c, deg) {
    const a = (deg * Math.PI) / 180, s = Math.sin(a), co = Math.cos(a);
    const x = p[0] - c[0], y = p[1] - c[1];
    return [c[0] + x * co - y * s, c[1] + x * s + y * co];
  }
  /* posisi tengah tangan kiri setelah pose (untuk barang di tangan) */
  function handPosL(pose) {
    const [u, f] = pose.L;
    const p = rotP(rotP([B.wrL[0], B.wrL[1] + 14], B.elL, f), B.shL, u);
    return p;
  }

  function resolve(look) {
    const L = { id: uid('c') };
    L.skin = (SKINS[look.sk | 0] || SKINS[1]).c;
    L.skin2 = dark(L.skin, 0.26);
    const hc = HAIRC[look.hc | 0] || HAIRC[2];
    L.hair = hc.g ? `url(#${hc.g})` : hc.c;
    L.hairD = dark(hc.c, 0.38);
    L.hairShine = lum(hc.c) > 0.5 ? '#ffffff' : mix(hc.c, '#ffe9d6', 0.42);
    L.brow = lum(hc.c) > 0.45 ? dark(hc.c, 0.45) : dark(hc.c, 0.15);
    L.eye = (EYES[look.ey | 0] || EYES[0]).c;
    L.tie = (PAL[look.tie | 0] || PAL[3]).c;
    return L;
  }

  /* opsi: expr, pose, apron (warna), view: full|head|bust|top, noShadow, noAnim, cls */
  function inner(look, o = {}) {
    const L = resolve(look);
    const poseName = o.pose || (look.hd ? 'hold' : 'idle');
    const pose = POSES[poseName] || POSES.idle;
    const top = TOPS[look.tp | 0] || TOPS[0];
    const dr = look.dr | 0;
    const D = DRESSES[dr] || DRESSES[0];
    const sl = dr ? D.sl : top.sl;
    const slColor = dr ? PAL[look.dc | 0].c : PAL[look.tc | 0].c;
    const slPat = dr ? look.dpp | 0 : look.tpp | 0;
    const kerudung = (look.ha | 0) === 16;
    const hr = kerudung ? { back: '', over: '', front: '' } : CHH.hair(look, L);
    const hj = kerudung ? CHH.hijab(PAL[look.hac | 0].c) : null;

    let s = '';
    if (!o.noShadow) s += `<ellipse cx="200" cy="642" rx="92" ry="15" fill="#3a1a3a" opacity=".16"/>`;
    s += `<g class="bodyb">`;
    s += CHB.backAcc(look.bk | 0, PAL[look.bkc | 0].c);
    const HS = `transform="translate(200 300) scale(${HEAD_K}) translate(-200 -300)"`;
    s += `<g class="hairb"><g ${HS}>${hr.back}${hj ? hj.back : ''}</g></g>`;
    s += CHB.legs(L, look);
    s += CHB.shoes(look);
    // leher & badan kulit
    s += `<path d="M187 284L187 332Q200 340 213 332L213 284Z" fill="${L.skin}" stroke="${L.skin2}" stroke-width="2.2"/>`;
    s += `<ellipse cx="200" cy="306" rx="15" ry="6" fill="${L.skin2}" opacity=".35"/>`;
    s += `<path d="M152 348Q150 328 172 324L228 324Q250 328 248 348L245 448L155 448Z" fill="${L.skin}" stroke="${L.skin2}" stroke-width="2"/>`;
    if (dr) s += CHB.dress(look);
    else if (top.tuck) s += CHB.top(look, L) + CHB.bottom(look);
    else s += CHB.bottom(look) + CHB.top(look, L);
    if (!dr) s += CHB.bib(look);
    if (o.apron) s += CHB.apron(o.apron);
    if (D.sl === 'strap' && dr) { /* tali sudah di gaun */ }
    s += CHB.backFront(look.bk | 0, PAL[look.bkc | 0].c);
    s += CHB.arm(-1, pose.L, L, look, sl, slColor, slPat, pose.hL || 'open');
    s += CHB.arm(1, pose.R, L, look, sl, slColor, slPat, pose.hR || 'open');
    s += `<g ${HS}>${hr.over}</g>`;
    s += CHB.neckAcc(look.nk | 0, PAL[look.nkc | 0].c);
    // kepala
    s += `<g class="headg"><g ${HS}>`;
    if (hj) s += hj.drape;
    s += CHH.ear(101, 226, L, -1) + CHH.ear(299, 226, L, 1);
    s += `<g class="facef">${CHH.face(L, look, o.expr || 'idle')}</g>`;
    s += hr.front;
    if (hj) s += hj.ring;
    if (!kerudung) s += CHH.headAcc(look.ha | 0, PAL[look.hac | 0].c);
    s += CHH.faceAcc(look.fa | 0, PAL[look.fac | 0].c);
    s += `</g></g>`;
    if (look.hd && poseName !== 'cheer' && poseName !== 'jump') {
      const hp = handPosL(pose);
      s += `<g transform="translate(${r1(hp[0])} ${r1(hp[1])}) scale(1.3) translate(${r1(-hp[0])} ${r1(-hp[1])})">${CHB.handItem(look.hd | 0, PAL[look.hdc | 0].c, hp[0], hp[1])}</g>`;
    }
    s += `</g>`;
    return { svg: s, pose: poseName, anim: pose.anim || '' };
  }

  const VIEWS = {
    full: '-30 -40 460 700',
    tight: '10 -20 380 676',
    head: '50 22 300 296',
    bust: '30 10 340 380',
    top: '20 -30 360 480',
  };

  function svg(look, o = {}) {
    const r = inner(look, o);
    const vb = o.vb || VIEWS[o.view || 'full'];
    const delay = (Math.random() * 4).toFixed(2);
    const cls = ['chr', 'pose-' + r.pose, r.anim ? 'anim-' + r.anim : '', o.noAnim ? 'still' : '', o.cls || ''].join(' ');
    return `<svg class="${cls}" viewBox="${vb}" style="--bd:-${delay}s" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g class="ch-root">${r.svg}</g></svg>`;
  }

  /* Ganti ekspresi cepat tanpa render ulang semuanya */
  function setExpr(svgEl, look, expr) {
    if (!svgEl) return;
    const f = svgEl.querySelector('.facef');
    if (!f) return;
    const L = resolve(look);
    f.innerHTML = CHH.face(L, look, expr);
  }

  /* Pratinjau satu bagian (untuk ikon pilihan di studio) */
  function partSVG(cat, look, vb) {
    const L = resolve(look);
    let s = '';
    switch (cat) {
      case 'hair': {
        const hr = CHH.hair(look, L);
        s = hr.back + CHH.ear(101, 226, L, -1) + CHH.ear(299, 226, L, 1) +
          `<path d="${CHH.FACE}" fill="${L.skin}" stroke="${L.skin2}" stroke-width="2.4"/>` +
          `<g opacity=".9"><ellipse cx="158" cy="216" rx="10" ry="13" fill="#2a1726"/><ellipse cx="242" cy="216" rx="10" ry="13" fill="#2a1726"/><circle cx="155" cy="211" r="3.6" fill="#fff"/><circle cx="239" cy="211" r="3.6" fill="#fff"/><path d="M188 268Q200 278 212 268" stroke="#c0606e" stroke-width="4" fill="none" stroke-linecap="round"/></g>` +
          hr.over + hr.front;
        break;
      }
      default: s = inner(look, { noShadow: 1 }).svg;
    }
    return `<svg viewBox="${vb || VIEWS.head}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
  }

  /* Ikon bagian tubuh/pakaian saja — ringan untuk daftar pilihan */
  const PART_VB = {
    top: '112 292 176 196', bottom: '104 420 192 240', dress: '30 296 340 360', shoes: '132 540 136 112',
    socks: '132 446 136 206', neck: '128 282 144 130', back: '10 200 380 440', hand: '96 360 150 200',
  };
  function part(kind, look) {
    const L = resolve(look);
    const top = TOPS[look.tp | 0] || TOPS[0];
    const dr = look.dr | 0;
    const D = DRESSES[dr] || DRESSES[0];
    const sl = dr ? D.sl : top.sl;
    const slC = dr ? PAL[look.dc | 0].c : PAL[look.tc | 0].c;
    const slP = dr ? look.dpp | 0 : look.tpp | 0;
    const torso = `<path d="M187 284L187 332Q200 340 213 332L213 284Z" fill="${L.skin}" stroke="${L.skin2}" stroke-width="2.2"/>` +
      `<path d="M152 348Q150 328 172 324L228 324Q250 328 248 348L245 448L155 448Z" fill="${L.skin}" stroke="${L.skin2}" stroke-width="2"/>`;
    const arms = CHB.arm(-1, [0, 0], L, look, sl, slC, slP, 'open') + CHB.arm(1, [0, 0], L, look, sl, slC, slP, 'open');
    let s = '';
    switch (kind) {
      case 'top': s = torso + CHB.top(look, L) + arms; break;
      case 'bottom': s = CHB.legs(L, look) + CHB.shoes(look) + CHB.bottom(look) + CHB.bib(Object.assign({}, look, { bt: look.bt })); break;
      case 'dress': s = CHB.legs(L, look) + CHB.shoes(look) + torso + CHB.dress(look) + arms; break;
      case 'shoes': case 'socks': s = CHB.legs(L, look) + CHB.shoes(look); break;
      case 'neck': s = torso + (dr ? CHB.dress(look) : CHB.top(look, L)) + CHB.neckAcc(look.nk | 0, PAL[look.nkc | 0].c); break;
      case 'back': s = CHB.backAcc(look.bk | 0, PAL[look.bkc | 0].c) + torso + (dr ? CHB.dress(look) : CHB.top(look, L)) + arms + CHB.backFront(look.bk | 0, PAL[look.bkc | 0].c) +
        `<circle cx="200" cy="250" r="70" fill="${L.skin}" stroke="${L.skin2}" stroke-width="2.4"/>`; break;
      case 'hand': {
        const pose = POSES.hold;
        const hp = handPosL(pose);
        s = CHB.arm(-1, pose.L, L, look, sl, slC, slP, 'open') + `<g transform="translate(${r1(hp[0])} ${r1(hp[1])}) scale(1.3) translate(${r1(-hp[0])} ${r1(-hp[1])})">${CHB.handItem(look.hd | 0, PAL[look.hdc | 0].c, hp[0], hp[1])}</g>`;
        break;
      }
    }
    return `<svg viewBox="${PART_VB[kind]}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${s}</svg>`;
  }

  return { svg, inner, setExpr, partSVG, part, POSES, VIEWS, resolve, handPosL };
})();

const FOODFX = (() => {
  function install() {
    if (document.getElementById('gfood')) return;
    let s = '';
    for (const [k, v] of Object.entries(SPR)) s += `<symbol id="sp-${k}" viewBox="-12 -12 24 24" overflow="visible">${v}</symbol>`;
    const host = document.createElement('div');
    host.innerHTML = `<svg id="gfood" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><defs>${s}</defs></svg>`;
    document.body.prepend(host.firstChild);
  }
  return { install };
})();

function srand(seed) {
  let t = seed >>> 0;
  return () => {
    t += 0x6d2b79f5;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
/* Tempel satu sprite */
function useSp(id, x, y, size = 22, rot = 0) {
  return `<use href="#sp-${id}" x="${r1(x - size / 2)}" y="${r1(y - size / 2)}" width="${size}" height="${size}"${rot ? ` transform="rotate(${r1(rot)} ${r1(x)} ${r1(y)})"` : ''}/>`;
}
/* Taburan di dalam elips */
function scatterIn(kind, cx, cy, rx, ry, n, seed, scale = 1) {
  const r = srand(seed);
  const f = SCATTER[kind];
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = r() * Math.PI * 2, d = Math.sqrt(r());
    const x = cx + Math.cos(a) * rx * d, y = cy + Math.sin(a) * ry * d;
    s += `<g transform="translate(${r1(x)} ${r1(y)}) rotate(${r1(r() * 360)}) scale(${scale})">${f(r)}</g>`;
  }
  return s;
}

const fillOf = (o) => (o && o.g ? `url(#${o.g})` : o ? o.c : '#eee');
function plate(cx = 100, cy = 174, rx = 74, ry = 15) {
  return `<ellipse cx="${cx}" cy="${cy + 5}" rx="${rx}" ry="${ry}" fill="#3a1a3a" opacity=".12"/>` +
    `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#ffffff" stroke="#d6cee0" stroke-width="2"/>` +
    `<ellipse cx="${cx}" cy="${cy - 2}" rx="${rx * 0.7}" ry="${ry * 0.58}" fill="#f3eef8"/>`;
}
function board(cx = 100, cy = 170, rx = 82, ry = 20) {
  return `<ellipse cx="${cx}" cy="${cy + 6}" rx="${rx}" ry="${ry}" fill="#3a1a3a" opacity=".12"/>` +
    `<ellipse cx="${cx}" cy="${cy + 3}" rx="${rx}" ry="${ry}" fill="#b8784a"/><ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#d8a06a" stroke="#a8683a" stroke-width="2"/>` +
    `<path d="M${cx - rx * 0.6} ${cy - 4}Q${cx} ${cy - 10} ${cx + rx * 0.6} ${cy - 4}" stroke="#c88a5a" stroke-width="2" fill="none"/>`;
}
const P = (d, fill, stroke, w = 2, extra = '') => `<path d="${d}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const shineArc = (d, op = 0.55, w = 4) => `<path d="${d}" fill="none" stroke="#ffffff" stroke-opacity="${op}" stroke-width="${w}" stroke-linecap="round"/>`;
function dripEdge(x0, x1, y, n, len, seed) {
  // tepi bawah lelehan dari x1 ke x0 (kanan ke kiri)
  const r = srand(seed);
  let d = '';
  const w = (x1 - x0) / n;
  for (let i = n - 1; i >= 0; i--) {
    const a = x0 + w * (i + 1), b = x0 + w * i;
    const L = len * (0.4 + r() * 0.8);
    d += `C${r1(a - w * 0.1)} ${r1(y + L)} ${r1(b + w * 0.55)} ${r1(y + L)} ${r1(b + w * 0.45)} ${r1(y + 2)}Q${r1(b + w * 0.2)} ${r1(y - 2)} ${r1(b)} ${r1(y)}`;
  }
  return d;
}
/* Tempatkan topping pilihan pada titik jangkar + taburan pada elips R */
function placeTops(list, opts, A, R, seed = 7, size = 24) {
  let s = '';
  const n = list.length;
  list.forEach((oi, k) => {
    const o = opts[oi];
    if (!o) return;
    if (o.sc) { s += scatterIn(o.sc, R[0], R[1], R[2], R[3], o.cnt || 26, seed + k * 13); return; }
    if (o.milk) { s += `<path d="M${R[0] - R[2] * 0.8} ${R[1] - 4}Q${R[0] - R[2] * 0.3} ${R[1] + 10} ${R[0]} ${R[1] - 4}T${R[0] + R[2] * 0.8} ${R[1]}" fill="none" stroke="#fffaf0" stroke-width="5" stroke-linecap="round"/>`; return; }
    let placed = 0;
    for (let j = k; j < A.length; j += Math.max(1, n)) {
      const a = A[j];
      s += useSp(o.sp, a[0], a[1], (a[2] || 1) * size, a[3] || 0);
      if (++placed >= (o.max || 3)) break;
    }
  });
  return s;
}
function shapePath(kind, cx, cy, r) {
  switch (kind) {
    case 'star': return starPath(cx, cy, r, r * 0.52);
    case 'heart': return heartPath(cx, cy + r * 0.1, r * 0.95);
    case 'flower': {
      let d = '';
      for (let i = 0; i < 5; i++) {
        const a = (i * 72 - 90) * Math.PI / 180, x = cx + Math.cos(a) * r * 0.55, y = cy + Math.sin(a) * r * 0.55;
        d += `M${r1(x - r * 0.48)} ${r1(y)}a${r1(r * 0.48)} ${r1(r * 0.48)} 0 1 0 ${r1(r * 0.96)} 0a${r1(r * 0.48)} ${r1(r * 0.48)} 0 1 0 ${r1(-r * 0.96)} 0Z`;
      }
      return d + `M${cx - r * 0.5} ${cy}a${r * 0.5} ${r * 0.5} 0 1 0 ${r} 0a${r * 0.5} ${r * 0.5} 0 1 0 ${-r} 0Z`;
    }
    case 'bear': return `M${cx - r} ${cy + r * 0.1}a${r} ${r * 0.9} 0 1 0 ${r * 2} 0a${r} ${r * 0.9} 0 1 0 ${-r * 2} 0Z` +
      `M${cx - r * 1.05} ${cy - r * 0.62}a${r * 0.36} ${r * 0.36} 0 1 0 ${r * 0.72} 0a${r * 0.36} ${r * 0.36} 0 1 0 ${-r * 0.72} 0Z` +
      `M${cx + r * 0.33} ${cy - r * 0.62}a${r * 0.36} ${r * 0.36} 0 1 0 ${r * 0.72} 0a${r * 0.36} ${r * 0.36} 0 1 0 ${-r * 0.72} 0Z`;
    case 'bunny': return `M${cx - r} ${cy + r * 0.2}a${r} ${r * 0.85} 0 1 0 ${r * 2} 0a${r} ${r * 0.85} 0 1 0 ${-r * 2} 0Z` +
      `M${cx - r * 0.62} ${cy - r * 0.9}a${r * 0.26} ${r * 0.62} 0 1 0 ${r * 0.52} 0a${r * 0.26} ${r * 0.62} 0 1 0 ${-r * 0.52} 0Z` +
      `M${cx + r * 0.1} ${cy - r * 0.9}a${r * 0.26} ${r * 0.62} 0 1 0 ${r * 0.52} 0a${r * 0.26} ${r * 0.62} 0 1 0 ${-r * 0.52} 0Z`;
    case 'square': return `M${cx - r} ${cy - r * 0.8}h${r * 2}v${r * 1.6}h${-r * 2}Z`;
    case 'triangle': return `M${cx} ${cy - r}L${cx + r} ${cy + r * 0.75}L${cx - r} ${cy + r * 0.75}Z`;
    default: return `M${cx - r} ${cy}a${r} ${r} 0 1 0 ${r * 2} 0a${r} ${r} 0 1 0 ${-r * 2} 0Z`;

const MENU_BY = Object.fromEntries(MENU.map((m, i) => [m.id, i]));

/* Gambar hidangan lengkap sebagai <svg> */
function dishSVG(dishIdx, st, cls = '') {
  const m = MENU[dishIdx];
  _dishU = uid('d');
  return `<svg class="dish ${cls}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${m.draw(st || {})}</svg>`;
}
/* Pesanan acak dari menu yang sudah terbuka */
function makeOrder(dishIdx) {
  const m = MENU[dishIdx];
  const want = {};
  for (const k of m.order) {
    const step = m.steps.find((s) => s.k === k);
    const opts = O[step.o];
    if (step.multi) want[k] = [randi(0, opts.length - 1)];
    else want[k] = randi(0, opts.length - 1);
  }
  return want;
}
/* Hidangan "jadi" sesuai pesanan (untuk gambar di gelembung) */
function orderState(dishIdx, want) {
  const m = MENU[dishIdx];
  const st = { _done: 1 };
  for (const s of m.steps) {
    if (s.act) st['_' + s.act] = 1;
    else if (want[s.k] != null) st[s.k] = Array.isArray(want[s.k]) ? want[s.k].slice() : want[s.k];
    else if (s.multi) st[s.k] = [];
    else st[s.k] = s.k === 'shape' && m.id === 'roti' ? 1 : 0;
  }
  return st;
}
/* Nama pesanan singkat, mis. "Cupcake Cokelat" */
function orderName(dishIdx, want) {
  const m = MENU[dishIdx];
  const k0 = m.order[0];
  const step = m.steps.find((s) => s.k === k0);
  const v = want[k0];
  const o = O[step.o][Array.isArray(v) ? v[0] : v];
  if (!o) return m.n;
  if (/^\d/.test(o.n) || ['Bulat', 'Hati', 'Kotak', 'Bintang'].includes(o.n)) return m.n + ' ' + o.n;
  if (m.id === 'esteh' || m.id === 'cokelat' || m.id === 'mie') return o.n;
  if (m.id === 'burger') return 'Burger ' + o.n;
  if (m.id === 'boba') return 'Boba ' + o.n;
  return m.n + ' ' + o.n;
}
/* Hitung kecocokan: kembalikan {match, total} */
function scoreDish(dishIdx, want, st) {
  const m = MENU[dishIdx];
  let match = 0, total = 0;
  for (const k of m.order) {
    total++;
    const v = want[k];
    if (Array.isArray(v)) { if ((st[k] || []).includes(v[0])) match++; }
    else if (st[k] === v) match++;
  }
  return { match, total };
}
