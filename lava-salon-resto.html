/* ---------------- SPA RAMBUT ---------------- */
const SPA_TOOLS = [
  { id: 'sampo', n: 'Sampo', tip: 'Gosok rambutnya sampai berbusa!', svg: '<rect x="18" y="20" width="28" height="38" rx="9" fill="#7fd0ff" stroke="#2a82d6" stroke-width="3"/><rect x="24" y="8" width="16" height="13" rx="4" fill="#ff8cc0" stroke="#d93a80" stroke-width="3"/><circle cx="32" cy="38" r="7" fill="#fff"/><circle cx="50" cy="14" r="5" fill="#dff4ff" stroke="#7fd0ff" stroke-width="2"/>' },
  { id: 'bilas', n: 'Bilas', tip: 'Bilas busanya dengan air!', svg: '<path d="M10 14H34Q44 14 44 24V30" fill="none" stroke="#9aa3b8" stroke-width="7" stroke-linecap="round"/><path d="M30 28H58L52 40H36Z" fill="#cfd4e6" stroke="#8a90a8" stroke-width="3"/><g fill="#5fb8ff"><path d="M38 46l-3 7a3 3 0 0 0 6 0Z"/><path d="M47 48l-3 7a3 3 0 0 0 6 0Z"/><path d="M42 56l-2 5a2.5 2.5 0 0 0 5 0Z"/></g>' },
  { id: 'kering', n: 'Pengering', tip: 'Keringkan rambutnya!', svg: '<path d="M8 22Q8 10 22 10H40Q52 10 52 24Q52 36 40 36H26L24 56H14L16 34Q8 30 8 22Z" fill="#ff8cc0" stroke="#d93a80" stroke-width="3" stroke-linejoin="round"/><circle cx="40" cy="23" r="8" fill="#fff" stroke="#d93a80" stroke-width="3"/><path d="M54 16h8M54 24h10M54 32h8" stroke="#8fd0ff" stroke-width="3" stroke-linecap="round"/>' },
  { id: 'sisir', n: 'Sisir', tip: 'Sisir rambutnya pelan-pelan!', svg: IC.comb },
  { id: 'kilau', n: 'Kilau', tip: 'Semprot kilau ajaib!', svg: '<rect x="18" y="24" width="24" height="34" rx="8" fill="#c0a2ff" stroke="#7442e0" stroke-width="3"/><rect x="22" y="12" width="16" height="12" rx="3" fill="#ffe36b" stroke="#e09412" stroke-width="3"/><path d="M46 14l4 -4M48 22h6M46 30l4 4" stroke="#ffc43d" stroke-width="3" stroke-linecap="round"/><path d="M30 34l2 5 5 1-4 3 1 5-4-3-4 3 1-5-4-3 5-1Z" fill="#fff"/>' },
];
const SPA = {
  start(st) {
    this.st = st;
    this.prog = {};
    this.cur = 0;
    this.bubbles = [];
    this.removed = 0;
    this.total = 0;
    const who = $('.who', st.el);
    who.innerHTML = `<div style="position:relative;height:100%;aspect-ratio:340/380;max-width:100%" class="spa-wrap">${CH.svg(G.S.look, { view: 'bust', expr: 'calm', cls: 'spa-chr' })}<svg class="spa-ov" viewBox="${CH.VIEWS.bust}" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></svg></div>`;
    const box = $('.opts', st.el);
    box.innerHTML = `<div style="grid-column:1/-1" class="stack"><p class="sub" style="font:800 1.2rem/1.2 var(--f-display);color:var(--ink)" data-tip></p><div class="meter" style="position:relative;left:auto;top:auto;transform:none;width:100%"><i></i><span></span></div>` +
      `<div style="display:flex;gap:10px;flex-wrap:wrap">${SPA_TOOLS.map((t, i) => `<button class="tool" data-tool="${i}"><svg viewBox="0 0 64 64">${t.svg}</svg>${t.n}</button>`).join('')}</div></div>`;
    $$('[data-tool]', box).forEach((b) => b.onclick = () => this.pick(+b.dataset.tool));
    this.pick(0);
    const ov = $('.spa-ov', who);
    this.ov = ov;
    let last = null;
    const cursor = $('.spa-cursor', st.el);
    const toLocal = (e) => {
      const m = ov.getScreenCTM();
      if (!m) return null;
      const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
      return [p.x, p.y];
    };
    this.onDown = (e) => { ov.setPointerCapture && ov.setPointerCapture(e.pointerId); last = toLocal(e); this.onMove(e); };
    this.onMove = (e) => {
      cursor.style.display = 'block';
      cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
      if (!last || !(e.buttons || e.pointerType === 'touch' || e.type === 'pointerdown')) { last = toLocal(e); return; }
      const p = toLocal(e);
      if (!p) return;
      const d = Math.hypot(p[0] - last[0], p[1] - last[1]);
      if (d < 3) return;
      last = p;
      this.work(p, d, e);
    };
    this.onUp = () => { last = null; };
    this.onLeave = () => { cursor.style.display = 'none'; };
    ov.addEventListener('pointerdown', this.onDown);
    ov.addEventListener('pointermove', this.onMove);
    ov.addEventListener('pointerup', this.onUp);
    ov.addEventListener('pointercancel', this.onUp);
    ov.addEventListener('pointerleave', this.onLeave);
  },
  stop(st) {
    const cursor = $('.spa-cursor', st.el);
    if (cursor) cursor.style.display = 'none';
    if (this.ov) {
      this.ov.removeEventListener('pointerdown', this.onDown);
      this.ov.removeEventListener('pointermove', this.onMove);
      this.ov.removeEventListener('pointerup', this.onUp);
      this.ov.removeEventListener('pointercancel', this.onUp);
      this.ov.removeEventListener('pointerleave', this.onLeave);
    }
    this.ov = null;
  },
  pick(i) {
    this.cur = i;
    const st = this.st, t = SPA_TOOLS[i];
    $$('[data-tool]', st.el).forEach((b) => b.classList.toggle('on', +b.dataset.tool === i));
    $('[data-tip]', st.el).textContent = t.tip;
    $('.spa-cursor', st.el).innerHTML = `<svg viewBox="0 0 64 64" style="width:100%;height:100%">${t.svg}</svg>`;
    this.meter();
    AUD.say(t.tip);
  },
  meter() {
    const st = this.st, t = SPA_TOOLS[this.cur];
    const v = Math.min(1, this.prog[t.id] || 0);
    $('.meter i', st.el).style.width = `calc(${(v * 100).toFixed(0)}% - 8px)`;
    $('.meter span', st.el).textContent = v >= 1 ? 'Selesai!' : Math.round(v * 100) + '%';
  },
  inHair(p) { return ((p[0] - 200) / 150) ** 2 + ((p[1] - 190) / 140) ** 2 < 1; },
  work(p, d, e) {
    const t = SPA_TOOLS[this.cur];
    if ((this.prog[t.id] || 0) >= 1) return;
    let add = 0;
    switch (t.id) {
      case 'sampo':
        if (this.inHair(p) && Math.random() < 0.6) {
          const r = 10 + Math.random() * 16;
          const c = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          c.innerHTML = `<circle cx="${r1(p[0])}" cy="${r1(p[1])}" r="${r1(r)}" fill="#ffffff" fill-opacity=".92" stroke="#bfe6ff" stroke-width="2.4"/><circle cx="${r1(p[0] - r * 0.35)}" cy="${r1(p[1] - r * 0.35)}" r="${r1(r * 0.25)}" fill="#dff4ff"/>`;
          c.animate([{ transform: 'scale(0)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'cubic-bezier(.25,1.6,.45,1)' });
          c.style.transformOrigin = `${r1(p[0])}px ${r1(p[1])}px`;
          this.ov.appendChild(c);
          this.bubbles.push({ el: c, x: p[0], y: p[1] });
          this.total++;
          add = 1 / 38;
          if (Math.random() < 0.35) AUD.S.bubble();
        }
        break;
      case 'bilas':
        FX.burst(e.clientX, e.clientY, 'drop', 2, { dir: Math.PI / 2, spread: 0.6, speed: 160, g: 600 });
        if (this.bubbles.length) {
          for (let i = this.bubbles.length - 1; i >= 0; i--) {
            const b = this.bubbles[i];
            if (Math.hypot(b.x - p[0], b.y - p[1]) < 46) {
              b.el.remove();
              this.bubbles.splice(i, 1);
              this.removed++;
              if (Math.random() < 0.5) AUD.S.bubble();
            }
          }
          add = 0;
          this.prog.bilas = this.total ? this.removed / this.total : 1;
          if (this.bubbles.length === 0) this.prog.bilas = 1;
        } else add = d / 1600;
        if (Math.random() < 0.15) AUD.S.splash();
        break;
      case 'kering':
        add = d / 2600;
        if (Math.random() < 0.25) FX.burst(e.clientX, e.clientY, 'smoke', 1, { speed: 80, size: 0.6 });
        if (Math.random() < 0.08) AUD.S.fan();
        {
          const svg = $('.spa-chr', this.st.el);
          if (svg && !svg.dataset.windy) { svg.dataset.windy = 1; const hb = $('.hairb', svg); if (hb) hb.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(2.5deg)' }, { transform: 'rotate(-2deg)' }, { transform: 'rotate(0)' }], { duration: 500, iterations: 4 }); setTimeout(() => { if (svg) delete svg.dataset.windy; }, 2000); }
        }
        break;
      case 'sisir':
        add = d / 2200;
        if (Math.random() < 0.3) FX.burst(e.clientX, e.clientY, 'sparkle', 1, { speed: 60, size: 0.6 });
        if (Math.random() < 0.12) AUD.S.whisk();
        break;
      case 'kilau':
        add = d / 1800;
        if (Math.random() < 0.5) FX.burst(e.clientX, e.clientY, 'sparkle', 2, { speed: 140 });
        if (Math.random() < 0.1) AUD.S.sparkle(0.04);
        break;
    }
    if (add) this.prog[t.id] = Math.min(1, (this.prog[t.id] || 0) + add);
    this.meter();
    if ((this.prog[t.id] || 0) >= 1) this.toolDone();
  },
  toolDone() {
    const st = this.st;
    AUD.S.star();
    const b = $(`[data-tool="${this.cur}"]`, st.el);
    if (b) { b.style.boxShadow = '0 0 0 4px var(--mint)'; FX.at(b, 'star', 8); }
    const next = SPA_TOOLS.findIndex((t) => (this.prog[t.id] || 0) < 1);
    if (next === -1) { setTimeout(() => this.finish(), 400); return; }
    UI.toast(pick(['Bagus!', 'Hebat!', 'Pintar!', 'Rapi sekali!']), icon('check', 'tic'), 1200);
    setTimeout(() => this.pick(next), 500);
  },
  finish() {
    const st = this.st;
    const S = G.S;
    S.prog.spa++;
    Save.touch(G.id);
    G.check();
    const svg = $('.spa-chr', st.el);
    if (svg) CH.setExpr(svg, S.look, 'joy');
    FX.rain(70);
    AUD.S.cheer();
    AUD.say('Rambutku wangi dan berkilau! Terima kasih!');
    $('[data-tip]', st.el).textContent = 'Rambutmu wangi dan berkilau!';
    G.addCoins(10, UI.center($('.who', st.el)));
    setTimeout(() => { if (st.mode === 'spa') st.exitMode(); }, 2200);
  },
};

/* ---------------- SALON KUKU ---------------- */
const NAILSALON = {
  start(st) {
    this.st = st;
    this.tool = { kind: 'polish', i: 1 };
    this.drawHand();
    const box = $('.opts', st.el);
    box.innerHTML = `<div style="grid-column:1/-1" class="stack"><p class="sub" style="font:800 1.2rem/1.2 var(--f-display);color:var(--ink)">Pilih kutek, lalu ketuk kukunya!</p>` +
      `<div class="swrow" style="flex-wrap:wrap"><span class="lbl">Kutek</span>${NAILS.map((n, i) => { const a = G.avail('nl:' + i); return `<button class="sw" data-pol="${i}" style="background:${n.g ? 'linear-gradient(135deg,#ff6fae,#ffb36b,#7fd8ff,#b08cff)' : n.c};${a.ok ? '' : 'opacity:.55'}" aria-label="${esc(n.n)}"></button>`; }).join('')}</div>` +
      `<div class="swrow" style="flex-wrap:wrap"><span class="lbl">Hiasan</span>${NAIL_ART.map((n, i) => `<button class="sw" data-art="${i}" style="background:#fff" aria-label="${esc(n.n)}"><svg viewBox="-12 -12 24 24">${this.artSVG(i, 0, 0, 7)}</svg></button>`).join('')}</div>` +
      `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn small pink" data-all>Semua kuku</button><button class="btn small white" data-clear>${icon('undo')}Hapus</button></div></div>`;
    $$('[data-pol]', box).forEach((b) => b.onclick = () => G.tryUse('nl:' + b.dataset.pol, () => { this.tool = { kind: 'polish', i: +b.dataset.pol }; this.markTool(); AUD.S.select(); }));
    $$('[data-art]', box).forEach((b) => b.onclick = () => { this.tool = { kind: 'art', i: +b.dataset.art }; this.markTool(); AUD.S.select(); });
    $('[data-all]', box).onclick = () => { for (let k = 0; k < 5; k++) this.paint(k, true); this.drawHand(); AUD.S.sparkle(); };
    $('[data-clear]', box).onclick = () => { const L = G.S.look; L.nl = [0, 0, 0, 0, 0]; L.na = [0, 0, 0, 0, 0]; Save.touch(G.id); this.drawHand(); };
    this.markTool();
    AUD.say('Pilih kutek, lalu ketuk kukunya!');
  },
  stop() {},
  markTool() {
    const st = this.st;
    $$('[data-pol]', st.el).forEach((b) => b.classList.toggle('sel', this.tool.kind === 'polish' && +b.dataset.pol === this.tool.i));
    $$('[data-art]', st.el).forEach((b) => b.classList.toggle('sel', this.tool.kind === 'art' && +b.dataset.art === this.tool.i));
  },
  artSVG(k, x, y, s) {
    switch (k) {
      case 1: return `<path d="${heartPath(x, y, s * 0.8)}" fill="#ff3f7f"/>`;
      case 2: return `<path d="${starPath(x, y, s, s * 0.42)}" fill="#ffd84a" stroke="#e8a21a" stroke-width=".8"/>`;
      case 3: return flowerSVG(x, y, s, '#ffffff', '#ffd84a');
      case 4: return `<g fill="#ffffff"><circle cx="${x - s * 0.4}" cy="${y - s * 0.3}" r="${s * 0.22}"/><circle cx="${x + s * 0.35}" cy="${y}" r="${s * 0.22}"/><circle cx="${x - s * 0.1}" cy="${y + s * 0.45}" r="${s * 0.22}"/></g>`;
      case 5: return `<path d="M${x + s * 0.3} ${y - s * 0.8}A${s * 0.8} ${s * 0.8} 0 1 0 ${x + s * 0.4} ${y + s * 0.75}A${s * 0.6} ${s * 0.6} 0 1 1 ${x + s * 0.3} ${y - s * 0.8}Z" fill="#ffe36b"/>`;
      default: return '';
    }
  },
  drawHand() {
    const st = this.st;
    const L = G.S.look;
    const skin = SKINS[L.sk | 0].c, sk2 = dark(skin, 0.26);
    const F = [
      { x: 92, y: 250, a: -48, len: 70, w: 34 },
      { x: 150, y: 168, a: -12, len: 104, w: 34 },
      { x: 200, y: 150, a: 0, len: 116, w: 35 },
      { x: 250, y: 162, a: 10, len: 104, w: 34 },
      { x: 296, y: 196, a: 22, len: 84, w: 30 },
    ];
    let s = `<ellipse cx="200" cy="384" rx="150" ry="14" fill="#3a1a3a" opacity=".1"/>`;
    s += `<path d="M110 300Q100 210 150 196L262 196Q312 214 302 300Q296 360 270 400H138Q116 360 110 300Z" fill="${skin}" stroke="${sk2}" stroke-width="4"/>`;
    F.forEach((f, k) => {
      const rad = (f.a * Math.PI) / 180;
      const tx = f.x + Math.sin(rad) * f.len, ty = f.y - Math.cos(rad) * f.len;
      s += `<path d="${capsule(f.x, f.y + 60, tx, ty, f.w / 2, f.w / 2 - 2)}" fill="${skin}" stroke="${sk2}" stroke-width="4"/>`;
      const nx = f.x + Math.sin(rad) * (f.len - 10), ny = f.y - Math.cos(rad) * (f.len - 10);
      const n = NAILS[L.nl[k] | 0];
      const nf = (L.nl[k] | 0) ? (n.g ? 'url(#lp-rainbow)' : n.c) : '#ffe6ec';
      s += `<g class="nail" data-n="${k}" style="cursor:pointer"><ellipse cx="${r1(nx)}" cy="${r1(ny)}" rx="${f.w * 0.36}" ry="${f.w * 0.46}" transform="rotate(${f.a} ${r1(nx)} ${r1(ny)})" fill="${nf}" stroke="${(L.nl[k] | 0) ? dark(n.c, 0.3) : '#f0c8d0'}" stroke-width="2.4"/>`;
      if (n.glit && (L.nl[k] | 0)) s += `<ellipse cx="${r1(nx)}" cy="${r1(ny)}" rx="${f.w * 0.36}" ry="${f.w * 0.46}" transform="rotate(${f.a} ${r1(nx)} ${r1(ny)})" fill="url(#pt-glitter)"/>`;
      s += `<ellipse cx="${r1(nx - 4)}" cy="${r1(ny - 6)}" rx="3" ry="5" transform="rotate(${f.a} ${r1(nx)} ${r1(ny)})" fill="#fff" opacity=".6"/>`;
      s += this.artSVG(L.na[k] | 0, nx, ny + 1, 7) + `<ellipse cx="${r1(nx)}" cy="${r1(ny)}" rx="${f.w * 0.62}" ry="${f.w * 0.7}" fill="transparent"/></g>`;
    });
    $('.who', st.el).innerHTML = `<svg viewBox="40 20 320 380" style="height:100%;width:auto;max-width:100%">${s}</svg>`;
    $$('.nail', st.el).forEach((g) => g.onclick = (e) => {
      const k = +g.dataset.n;
      this.paint(k);
      this.drawHand();
      FX.burst(e.clientX, e.clientY, 'sparkle', 10, { speed: 160 });
    });
  },
  paint(k, quiet) {
    const L = G.S.look;
    if (this.tool.kind === 'polish') { if ((L.nl[k] | 0) !== this.tool.i) G.S.prog.nails++; L.nl[k] = this.tool.i; }
    else L.na[k] = this.tool.i;
    Save.touch(G.id);
    G.check();
    if (!quiet) AUD.S.pop();
  },
};

/* ---- 53-resto.js ---- */
/* ============================================================
   53-resto.js — Restoran: pengunjung datang, pesan, makan, senang.
   Tanpa batas waktu & tanpa marah: semua pengunjung sabar dan ceria.
   ============================================================ */
const R = { active: false, day: 0, goal: 6, spawned: 0, served: 0, coins: 0, stars: 0, perfect: 0, vipDone: false, seats: [null, null, null], nextAt: 0, favN: {}, lastSpawn: 0 };
let _custN = 0;

function unlockedDishes() {
  const lvl = G.S.prog.lvl;
  return MENU.map((m, i) => (m.lvl <= lvl ? i : -1)).filter((i) => i >= 0);
}

UI.reg('resto', {
  color: '#ffab8a',
  build() {
    this.el = h(`<section class="screen" id="scr-resto">
      <div class="stagewrap"><div class="backdrop"></div><div class="stage"><div class="bg"></div></div></div>
      ${UI.hud({ back: true })}
      <div class="resto-bar"><div class="daypill"><span class="dl"></span><div class="dots"></div></div><button class="btn coral" data-close>${icon('home')}Tutup Toko</button></div>
    </section>`);
    $('#app').appendChild(this.el);
    $('[data-close]', this.el).onclick = (e) => this.closeShop(e.currentTarget);
    this.onResize = () => { if (UI.current() === 'resto') this.layout(true); };
    addEventListener('resize', this.onResize);
  },
  back(btn) { this.closeShop(btn); },
  enter(p = {}) {
    AUD.setMood('resto');
    const S = G.S;
    if (!R.active || R.owner !== G.id) this.newDay();
    this.layout();
    this.renderAll();
    if (p.serve) setTimeout(() => this.serve(p.serve), 450);
    this.loop();
  },
  leave() { cancelAnimationFrame(this.raf); this.raf = 0; clearTimeout(this.tSpawn); },

  newDay() {
    const S = G.S;
    Object.assign(R, { active: true, owner: G.id, day: S.prog.days + 1, goal: 6, spawned: 0, served: 0, coins: 0, stars: 0, perfect: 0, vipDone: false, seats: [null, null, null], nextAt: performance.now() + 1400, favN: {} });
    S.prog.days++;
    Save.touch(G.id);
    G.check();
    setTimeout(() => {
      if (UI.current() !== 'resto') return;
      UI.toast(`<b>Hari ke-${R.day}</b> — Restoran buka!`, icon('resto', 'tic'));
      AUD.S.door();
    }, 650);
  },
  layout(rerender) {
    const L = innerWidth / innerHeight >= 1 ? LAYOUTS.land : LAYOUTS.port;
    const changed = this.L !== L;
    this.L = L;
    const stage = $('.stage', this.el);
    const vw = innerWidth, vh = innerHeight;
    const s = Math.min(vw / L.W, vh / L.H);
    this.scale = s;
    stage.style.width = L.W + 'px'; stage.style.height = L.H + 'px';
    stage.style.transform = `translate(${(-L.W * s) / 2}px, ${(-L.H * s) / 2}px) scale(${s})`;
    // gelembung pesanan tetap mudah dibaca & diketuk di layar kecil
    stage.style.setProperty('--bs', Math.min(1.7, Math.max(1, 0.78 / s)).toFixed(3));
    const S = G.S;
    const wc = WALLC[S.shop.wall] || WALLC[0], fl = FLOORS[S.shop.floor | 0] || FLOORS[0];
    this.el.style.background = `linear-gradient(180deg, ${wc} 0%, ${wc} 50%, ${fl.b} 50%, ${fl.b} 100%)`;
    // dinding & lantai diteruskan sampai tepi layar
    const X0 = L.W / 2 - vw / (2 * s), Y0 = L.H / 2 - vh / (2 * s);
    $('.backdrop', this.el).innerHTML = SCN.backdrop(S, Object.assign({}, L), X0, Y0, L.W - X0, L.H - Y0);
    if (rerender && changed) this.renderAll();
  },
  P(x, y, el, z) { el.style.left = x + 'px'; el.style.top = y + 'px'; if (z != null) el.style.zIndex = Math.round(z); },
  renderAll() {
    const S = G.S, L = this.L;
    const stage = $('.stage', this.el);
    $$('.ent', stage).forEach((e) => e.remove());
    $('.bg', stage).innerHTML = SCN.dining(S, Object.assign({ noVig: 1 }, L));
    // meja
    L.tables.forEach((t, i) => {
      const te = h(`<div class="ent table">${SCN.table(S)}</div>`);
      this.P(t.x, t.y - 40, te, t.y + 2);
      stage.appendChild(te);
    });
    // pemain
    const pl = h(`<div class="ent player"><div class="pc"></div><div class="carry"></div>${S.pet.t >= 0 ? PET.full(S.pet) : ''}</div>`);
    this.player = pl;
    this.renderPlayer('idle');
    this.P(L.player.x, L.player.y, pl, L.player.y);
    stage.appendChild(pl);
    pl.onclick = () => { this.renderPlayer('wave', 'happy'); AUD.S.giggle(); setTimeout(() => this.renderPlayer('idle'), 1400); };
    // pengunjung yang sudah ada
    R.seats.forEach((c) => { if (c) { c.el = null; this.mountCust(c, true); } });
    this.updateBar();
  },
  renderPlayer(pose, expr) {
    const S = G.S;
    $('.pc', this.player).innerHTML = CH.svg(S.look, { view: 'tight', pose, expr: expr || 'idle', apron: G.F.color });
  },
  updateBar() {
    $('.dl', this.el).textContent = `Hari ke-${R.day}`;
    $('.dots', this.el).innerHTML = Array.from({ length: R.goal }, (_, i) => `<i class="${i < R.served ? 'on' : ''}"></i>`).join('');
  },

  /* ---------- pengunjung ---------- */
  loop() {
    cancelAnimationFrame(this.raf);
    const tick = (t) => {
      this.raf = requestAnimationFrame(tick);
      if (!R.active || UI.busy) return;
      const free = R.seats.findIndex((s) => !s);
      if (free >= 0 && R.spawned < R.goal && t >= R.nextAt) { this.spawn(free); R.nextAt = t + 5200 + Math.random() * 3200; }
      if (free < 0) R.nextAt = Math.max(R.nextAt, t + 2200);
    };
    this.raf = requestAnimationFrame(tick);
  },
  spawn(seat) {
    const S = G.S;
    const dishes = unlockedDishes();
    // utamakan menu yang belum sering dibuat hari ini
    let dish = pick(dishes);
    if (R.spawned === 0 && dishes.length) dish = dishes[Math.floor(Math.random() * Math.min(4, dishes.length))];
    const friends = FRIENDS.filter((f) => f.id !== G.id && Save.slot(f.id));
    let vip = null;
    if (!R.vipDone && friends.length && R.spawned >= 1 && Math.random() < 0.34) { vip = pick(friends).id; R.vipDone = true; }
    const c = { id: ++_custN, seat, dish, want: makeOrder(dish), state: 'walk', vip, data: vip ? null : newCustomer(), kitchen: null };
    R.seats[seat] = c;
    R.spawned++;
    this.mountCust(c, false);
  },
  custSVG(c, expr) {
    if (c.vip) { const s = Save.slot(c.vip); return CH.svg(s.look, { view: 'tight', expr: expr === 'chew' ? 'eat' : expr === 'love' ? 'joy' : expr || 'idle', pose: expr === 'love' ? 'cheer' : 'idle', noShadow: 1 }); }
    return `<svg viewBox="0 0 240 300" xmlns="http://www.w3.org/2000/svg">${ANIM.svg(c.data, { expr, seat: c.state !== 'walk' })}</svg>`;
  },
  mountCust(c, seated) {
    const L = this.L, t = L.tables[c.seat];
    const stage = $('.stage', this.el);
    const el = h(`<div class="ent cust ${c.vip ? 'vipc' : ''}"></div>`);
    if (c.vip) { el.style.width = '200px'; el.style.height = '356px'; el.style.marginLeft = '-100px'; el.style.marginTop = '-346px'; }
    el.innerHTML = this.custSVG(c, c.state === 'eat' ? 'chew' : c.state === 'happy' ? 'love' : 'idle');
    c.el = el;
    stage.appendChild(el);
    el.onclick = () => this.tapCust(c);
    const sitY = t.y + (c.vip ? 120 : 84);
    if (seated || c.state !== 'walk') {
      el.classList.add('sit');
      this.P(t.x, sitY, el, t.y - 1);
      this.addPaws(c);
      if (c.state === 'wait' || c.state === 'cook') this.showOrder(c, true);
      if (c.state === 'eat' && c.served) this.putDish(c, c.served.st, true);
      return;
    }
    el.classList.add('walk');
    this.P(L.entry.x, L.entry.y, el, t.y - 1);
    el.style.opacity = '0';
    el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300 });
    AUD.S.door();
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.opacity = '1'; this.P(t.x, t.y + 30, el); }));
    setTimeout(() => {
      if (!c.el || R.seats[c.seat] !== c) return;
      el.classList.remove('walk');
      el.classList.add('sit');
      el.style.transition = 'top .35s cubic-bezier(.3,1.4,.5,1)';
      this.P(t.x, sitY, el);
      el.innerHTML = this.custSVG(c, 'idle');
      this.addPaws(c);
      c.state = 'wait';
      setTimeout(() => this.showOrder(c), 450);
    }, 2050);
  },
  addPaws(c) {
    if (c.vip || !c.el) return;
    const S = SPECIES[c.data.sp];
    const f = S.furs[c.data.fur % S.furs.length];
    const t = this.L.tables[c.seat];
    const pw = h(`<div class="ent paws" style="--pc:${f};--pd:${dark(f, 0.35)}"><i></i><i></i></div>`);
    this.P(t.x, t.y - 6, pw, t.y + 3);
    $('.stage', this.el).appendChild(pw);
    c.paws = pw;
  },
  showOrder(c, quiet) {
    if (!c.el || R.seats[c.seat] !== c) return;
    const t = this.L.tables[c.seat];
    if (c.bub) c.bub.remove();
    const name = orderName(c.dish, c.want);
    const b = h(`<button class="ent bubble" aria-label="Pesanan: ${esc(name)}">${dishSVG(c.dish, orderState(c.dish, c.want))}<div class="bn">${esc(name)}</div><span class="tap">Ketuk!</span></button>`);
    this.P(t.x, t.y - (c.vip ? 420 : 330), b, 3000);
    $('.stage', this.el).appendChild(b);
    b.onclick = () => this.tapCust(c);
    c.bub = b;
    if (!quiet) {
      AUD.S.ding();
      const who = c.vip ? FRIENDS[FRIEND_IDX[c.vip]].name : c.data.name;
      const line = c.vip ? fillLine(LINES.vip, { p: G.F.name }) + ' Aku mau ' + name + '!' : fillLine(LINES.order, { d: name, p: G.F.name });
      AUD.say(line, c.vip ? 1.3 : 1.15 + Math.random() * 0.3);
      if (c.vip) UI.toast(`<b>${esc(who)}</b> datang ke restoranmu!`, CH.svg(Save.slot(c.vip).look, { view: 'head', noAnim: 1, noShadow: 1 }), 3000);
    }
  },
  tapCust(c) {
    if (c.state === 'wait' || c.state === 'cook') {
      c.state = 'cook';
      AUD.S.select();
      UI.go('kitchen', { cust: c.id }, UI.center(c.bub || c.el));
    } else if (c.state === 'walk') {
      AUD.S.boing();
    }
  },
  findCust(id) { return R.seats.find((c) => c && c.id === id); },

  /* ---------- menyajikan ---------- */
  serve(info) {
    const c = this.findCust(info.cust);
    if (!c) return;
    c.served = info;
    c.state = 'serving';
    const L = this.L, t = L.tables[c.seat];
    const pl = this.player;
    if (c.bub) { c.bub.remove(); c.bub = null; }
    $('.carry', pl).innerHTML = dishSVG(c.dish, info.st);
    pl.classList.add('carrying', 'walk');
    this.renderPlayer('tray', 'happy');
    const sx = t.x - (L === LAYOUTS.port && c.seat === 1 ? -150 : 150), sy = t.y + 128;
    pl.style.zIndex = Math.round(sy);
    this.P(sx, sy, pl);
    setTimeout(() => {
      pl.classList.remove('carrying', 'walk');
      this.renderPlayer('point', 'happy');
      this.putDish(c, info.st);
      AUD.S.pop();
      setTimeout(() => {
        pl.classList.add('walk');
        this.renderPlayer('idle');
        this.P(L.player.x, L.player.y, pl, L.player.y);
        setTimeout(() => pl.classList.remove('walk'), 1150);
      }, 450);
      this.eat(c);
    }, 1150);
  },
  putDish(c, st, instant) {
    const t = this.L.tables[c.seat];
    const d = h(`<div class="ent dishOnTable">${dishSVG(c.dish, st)}</div>`);
    this.P(t.x, t.y + 30, d, t.y + 4);
    $('.stage', this.el).appendChild(d);
    c.dishEl = d;
    if (instant) d.style.animation = 'none';
  },
  eat(c) {
    c.state = 'eat';
    if (c.el) { c.el.classList.add('eat'); c.el.innerHTML = this.custSVG(c, 'chew'); }
    const t = this.L.tables[c.seat];
    let n = 0;
    const iv = setInterval(() => {
      if (UI.current() !== 'resto') return;
      AUD.S.chomp();
      const r = c.el && c.el.getBoundingClientRect();
      if (r) FX.burst(r.left + r.width / 2, r.top + r.height * 0.5, 'crumb', 3, { speed: 120, color: '#e8b46a' });
      if (++n >= 6) clearInterval(iv);
    }, 380);
    requestAnimationFrame(() => c.dishEl && c.dishEl.classList.add('eaten'));
    setTimeout(() => this.react(c), 2500);
  },
  react(c) {
    const S = G.S;
    const sc = scoreDish(c.dish, c.want, c.served.st);
    const ratio = sc.total ? sc.match / sc.total : 1;
    const stars = 3 + Math.round(ratio * 2);
    const m = MENU[c.dish];
    const coins = m.price + (stars - 3) * 3 + randi(0, 3) + (c.vip ? 10 : 0);
    if (c.el) { c.el.classList.remove('eat'); c.el.innerHTML = this.custSVG(c, stars === 5 ? 'love' : 'happy'); }
    if (c.dishEl) { c.dishEl.remove(); c.dishEl = null; }
    const t = this.L.tables[c.seat];
    const line = stars === 5 ? fillLine(LINES.perfect, { p: G.F.name }) : fillLine(LINES.good, { p: G.F.name });
    const talk = h(`<div class="ent bubble talk">${esc(line)}</div>`);
    this.P(t.x, t.y - (c.vip ? 400 : 300), talk, 3001);
    $('.stage', this.el).appendChild(talk);
    AUD.say(line, 1.25);
    const r = c.el ? c.el.getBoundingClientRect() : null;
    const xy = r ? { x: r.left + r.width / 2, y: r.top + r.height * 0.3 } : null;
    if (xy) { FX.burst(xy.x, xy.y, 'heart', 12, { speed: 240, up: 160 }); if (stars === 5) FX.burst(xy.x, xy.y, 'star', 8, { speed: 300 }); }
    AUD.S.cheer();
    // catat progres
    const p = S.prog;
    p.served++;
    p.made[CATS.findIndex((k) => k.id === m.cat)]++;
    if (stars === 5) p.perfect++;
    if (c.vip) p.vip++;
    G.favDish(c.dish);
    R.served++; R.coins += coins; R.stars += stars;
    R.favN[c.dish] = (R.favN[c.dish] || 0) + 1;
    setTimeout(() => G.addStars(stars, xy), 250);
    setTimeout(() => G.addCoins(coins, xy), 650);
    G.addXP(8 + stars * 2 + (c.vip ? 6 : 0));
    this.updateBar();
    setTimeout(() => {
      talk.remove();
      this.leaveCust(c);
    }, 2300);
  },
  leaveCust(c) {
    const L = this.L;
    c.state = 'leave';
    if (c.paws) { c.paws.remove(); c.paws = null; }
    if (c.el) {
      const el = c.el;
      el.classList.remove('sit');
      el.classList.add('walk');
      el.style.transition = '';
      el.innerHTML = this.custSVG(Object.assign({}, c, { state: 'walk' }), 'happy');
      const bye = fillLine(LINES.bye);
      const t = L.tables[c.seat];
      const b = h(`<div class="ent bubble talk" style="font-size:.9rem">${esc(bye)}</div>`);
      this.P(t.x, t.y - 250, b, 3001);
      $('.stage', this.el).appendChild(b);
      setTimeout(() => b.remove(), 1200);
      requestAnimationFrame(() => this.P(L.entry.x, L.entry.y, el));
      setTimeout(() => { el.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' }); }, 1800);
      setTimeout(() => el.remove(), 2150);
    }
    setTimeout(() => {
      R.seats[c.seat] = null;
      if (R.served >= R.goal && R.seats.every((s) => !s)) this.dayDone();
    }, 1200);
  },

  /* ---------- akhir hari ---------- */
  dayDone() {
    if (!R.active) return;
    R.active = false;
    const S = G.S;
    let fav = -1, fn = 0;
    for (const [k, v] of Object.entries(R.favN)) if (v > fn) { fn = v; fav = +k; }
    const bonus = 15;
    AUD.S.levelup();
    FX.rain(120);
    UI.modal({
      close: false, dismiss: false,
      html: `<div class="ribbon">Hari ke-${R.day} selesai!</div>` +
        `<div class="hero" style="height:220px;margin-top:10px">${CH.svg(S.look, { view: 'tight', pose: 'cheer', expr: 'joy', apron: G.F.color })}</div>` +
        `<h3 class="ttl" style="font-size:1.7rem">${R.served} pengunjung senang!</h3>` +
        `<div class="row" style="margin-top:8px"><span class="chip">${COIN_SVG}<span class="num">+${R.coins}</span></span><span class="chip">${STAR_SVG}<span class="num">+${R.stars}</span></span><span class="chip">${icon('gift')}<span class="num" style="color:var(--pinkd)">+${bonus}</span></span></div>` +
        (fav >= 0 ? `<p class="sub" style="margin-top:10px">Menu favorit hari ini: <b>${esc(MENU[fav].n)}</b></p>` : '') +
        `<div class="row"><button class="btn big mint" data-again>${icon('resto')}Buka lagi</button><button class="btn white" data-homeb>${icon('home')}Ke Beranda</button></div>`,
      onOpen: (card) => {
        $('[data-again]', card).onclick = (e) => { const c = UI.center(e.currentTarget); UI.closeModal(); G.addCoins(bonus, c); this.newDay(); this.renderAll(); };
        $('[data-homeb]', card).onclick = (e) => { const c = UI.center(e.currentTarget); UI.closeModal(); G.addCoins(bonus); R.active = false; UI.go('home', {}, c); };
      },
    });
    AUD.say(`Hore! ${R.served} pengunjung senang hari ini!`);
  },
  closeShop(btn) {
    const busy = R.seats.some((c) => c && (c.state === 'eat' || c.state === 'serving'));
    if (busy) { UI.toast('Tunggu pengunjungnya selesai makan dulu, ya!', icon('heart', 'tic')); return; }
    if (R.served > 0 && R.active) {
      R.active = false;
      R.seats = [null, null, null];
      UI.toast(`Restoran tutup. ${R.served} pengunjung senang hari ini!`, icon('heart', 'tic'), 2600);
    } else { R.active = false; R.seats = [null, null, null]; }
    UI.go('home', {}, UI.center(btn));
  },
});

function optIcon(listKey, i) {
  const o = O[listKey][i];
  if (!o) return '';

    const k = SHAPE_LISTS[listKey][i];
    if (listKey === 'cakeShape' && i === 1) return `<svg viewBox="0 0 64 64"><rect x="10" y="34" width="44" height="20" rx="6" fill="#ffb3cf" stroke="#d65a96" stroke-width="3"/><rect x="18" y="16" width="28" height="20" rx="6" fill="#ffd6e8" stroke="#d65a96" stroke-width="3"/></svg>`;
    const d = k === 'dome' ? 'M10 50C10 20 54 20 54 50Z' : shapePath(k, 32, 34, 22);
    return `<svg viewBox="0 0 64 64"><path d="${d}" fill="#ffd27a" stroke="#c8902a" stroke-width="3" stroke-linejoin="round"/></svg>`;
  }
  if (o.v) {
    return `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26" fill="#fff3d6" stroke="#e8c88a" stroke-width="3"/><text x="32" y="43" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="30" fill="#c8782a">${o.v}</text></svg>`;
  }
  if (listKey === 'art') {
    const arts = [`<path d="M32 40C22 34 24 26 32 30C40 26 42 34 32 40Z" fill="#7a4a32"/>`, `<g fill="#7a4a32"><ellipse cx="32" cy="35" rx="11" ry="7"/><circle cx="23" cy="28" r="4"/><circle cx="41" cy="28" r="4"/></g>`, `<path d="${starPath(32, 33, 11, 5)}" fill="#7a4a32"/>`, `<g fill="#7a4a32">${[0, 1, 2, 3, 4].map((k) => { const a = (k * 72 - 90) * Math.PI / 180; return `<circle cx="${r1(32 + Math.cos(a) * 7)}" cy="${r1(33 + Math.sin(a) * 7)}" r="4.6"/>`; }).join('')}</g>`, `<g fill="#7a4a32"><ellipse cx="32" cy="36" rx="12" ry="8"/><path d="M21 33L23 23L28 30ZM43 33L41 23L36 30Z"/></g>`];
    return `<svg viewBox="0 0 64 64"><ellipse cx="32" cy="33" rx="26" ry="20" fill="#ff8cb0"/><ellipse cx="32" cy="33" rx="21" ry="15" fill="#f6e2c8"/>${arts[i]}</svg>`;
  }
  if (o.milk) return `<svg viewBox="0 0 64 64">${IC.milk}</svg>`;
  const T = OPT_ICONS[listKey];
  if (T && o.c !== undefined || T && listKey === 'icSauce' || T && listKey === 'vla') return `<svg viewBox="0 0 64 64">${T(o, o.g ? `url(#${o.g})` : o.c, dark(o.c || '#cccccc', 0.32))}</svg>`;
  if (o.sp && !(listKey === 'iced' || listKey === 'fruit' && false)) return `<svg viewBox="-13 -13 26 26"><use href="#sp-${o.sp}" x="-11" y="-11" width="22" height="22"/></svg>`;

  if (listKey === 'bumbu') return `<svg viewBox="0 0 64 64"><path d="M8 44Q8 20 32 20Q56 20 56 44Z" fill="${o.c}" stroke="${dark(o.c, 0.3)}" stroke-width="3"/><path d="M4 46H60" stroke="#ddd" stroke-width="5" stroke-linecap="round"/></svg>`;

  }
  return `<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="#f1e3ef"/><path d="M22 22L42 42M42 22L22 42" stroke="#c9b3d6" stroke-width="5" stroke-linecap="round"/></svg>`;

const K = { c: null, d: 0, m: null, st: {}, step: 0 };

UI.reg('kitchen', {
  color: '#ffd36a',
  build() {
    this.el = h(`<section class="screen" id="scr-kitchen">
      <div class="kit">
        <div class="ordercard"></div>
        <div class="k-stage"><div class="counter"></div><div class="dishbox"></div></div>
        <div class="k-panel">
          <div class="k-step"><span class="num"></span><span class="tx"></span></div>
          <div class="k-prog"></div>
          <div class="opts"></div>
          <div class="k-act" hidden></div>
          <div class="k-foot"><button class="btn small white" data-undo>${icon('undo')}Ulangi</button><button class="btn mint" data-next hidden>Lanjut${icon('next')}</button></div>
        </div>
      </div>
      ${UI.hud({ back: true, player: false, title: 'Dapur', stars: false })}</section>`);
    $('#app').appendChild(this.el);
    $('[data-next]', this.el).onclick = () => this.next();
    $('[data-undo]', this.el).onclick = () => this.undo();
  },
  back(btn) {
    if (K.c) K.c.kitchen = { st: K.st, step: K.step };
    if (K.c && K.c.state === 'cook') K.c.state = 'wait';
    this.stopAct();
    UI.go('resto', {}, UI.center(btn));
  },
  enter(p = {}) {
    AUD.setMood('resto');
    const c = UI.def('resto').findCust(p.cust);
    if (!c) { setTimeout(() => UI.go('resto'), 50); return; }
    K.c = c; K.d = c.dish; K.m = MENU[c.dish];
    if (c.kitchen) { K.st = c.kitchen.st; K.step = c.kitchen.step; }
    else { K.st = {}; K.step = 0; }
    this.renderOrder();
    this.renderStep();
  },
  leave() { this.stopAct(); clearTimeout(this.tHint); },

  renderOrder() {
    const c = K.c, m = K.m;
    const face = c.vip ? CH.svg(Save.slot(c.vip).look, { view: 'head', noAnim: 1, noShadow: 1 }) : `<svg viewBox="40 30 160 160">${ANIM.svg(c.data, { expr: 'happy', seat: 1 })}</svg>`;
    const who = c.vip ? FRIENDS[FRIEND_IDX[c.vip]].name : c.data.name;
    const chips = m.order.map((k) => {
      const step = m.steps.find((s) => s.k === k);
      const v = c.want[k];
      const idx = Array.isArray(v) ? v[0] : v;
      return `<div class="want-chip" data-w="${k}" title="${esc(O[step.o][idx].n)}">${optIcon(step.o, idx)}</div>`;
    }).join('');
    $('.ordercard', this.el).innerHTML = `<div class="face">${face}</div><div class="od">${dishSVG(K.d, orderState(K.d, c.want))}</div><div class="ot"><b>${esc(orderName(K.d, c.want))}</b><span>Pesanan ${esc(who)}</span></div><div class="wants">${chips}</div>`;
    this.markWants();
  },
  markWants() {
    const c = K.c, m = K.m;
    for (const k of m.order) {
      const el = $(`.want-chip[data-w="${k}"]`, this.el);
      if (!el) continue;
      const v = c.want[k];
      const ok = Array.isArray(v) ? (K.st[k] || []).includes(v[0]) : K.st[k] === v;
      if (ok && !el.classList.contains('ok')) { el.classList.add('ok'); FX.at(el, 'sparkle', 8, { speed: 120 }); }
      el.classList.toggle('ok', ok);
    }
  },
  renderDish(pop) {
    const box = $('.dishbox', this.el);
    box.innerHTML = dishSVG(K.d, K.st);
    if (pop) { box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); }
  },
  renderStep() {
    clearTimeout(this.tHint);
    this.stopAct();
    const m = K.m, steps = m.steps;
    const done = K.step >= steps.length;
    $('.k-prog', this.el).innerHTML = steps.map((s, i) => `<i class="${i < K.step ? 'done' : i === K.step ? 'cur' : ''}"></i>`).join('') + `<i class="${done ? 'cur' : ''}"></i>`;
    $('[data-undo]', this.el).hidden = K.step === 0;
    const optsEl = $('.opts', this.el), actEl = $('.k-act', this.el), nextB = $('[data-next]', this.el);
    // Jeda singkat setelah mini-game: ketukan cepat anak tidak langsung memilih/menyajikan
    clearTimeout(this.tGuard);
    optsEl.classList.remove('guard'); actEl.classList.remove('guard');
    const guard = (el, ms) => { el.classList.add('guard'); this.tGuard = setTimeout(() => el.classList.remove('guard'), ms); };
    const afterAct = K.step > 0 && steps[K.step - 1] && steps[K.step - 1].act;
    const kit = $('.kit', this.el);
    if (kit) kit.classList.toggle('acting', !done && !!steps[K.step].act);
    this.renderDish();
    if (done) {
      $('.k-step .num', this.el).textContent = '★';
      $('.k-step .tx', this.el).textContent = 'Siap disajikan!';
      optsEl.hidden = true; actEl.hidden = false; nextB.hidden = true;
      actEl.innerHTML = `<div class="hint">${esc(m.n)} buatanmu cantik sekali!</div><button class="btn big sun pulse" data-serve>${icon('resto')}Sajikan!</button>`;
      $('[data-serve]', actEl).onclick = (e) => this.serve(e.currentTarget);
      guard(actEl, 750);
      const db = $('.dishbox', this.el);
      FX.at(db, 'sparkle', 22, { speed: 260 });
      AUD.S.star();
      return;
    }
    const s = steps[K.step];
    $('.k-step .num', this.el).textContent = K.step + 1;
    $('.k-step .tx', this.el).textContent = s.t;
    if (s.act) {
      optsEl.hidden = true; actEl.hidden = false; nextB.hidden = true;
      this.startAct(s);
      return;
    }
    optsEl.hidden = false; actEl.hidden = true; actEl.innerHTML = '';
    const opts = O[s.o];
    const want = K.c.want[s.k];
    const wantIdx = want == null ? -1 : Array.isArray(want) ? want[0] : want;
    const cur = K.st[s.k];
    optsEl.innerHTML = opts.map((o, i) => {
      const sel = s.multi ? (cur || []).includes(i) : cur === i;
      const cnt = s.stack ? (cur || []).filter((x) => x === i).length : 0;
      return `<button class="opt ${sel ? 'sel' : ''}" data-o="${i}" style="animation-delay:${Math.min(i * 0.03, 0.4).toFixed(2)}s" aria-label="${esc(o.n)}"><div class="th">${optIcon(s.o, i)}</div><span class="on">${esc(o.n)}${cnt > 1 ? ' ×' + cnt : ''}</span></button>`;
    }).join('');
    nextB.hidden = !s.multi;
    if (s.multi) nextB.innerHTML = ((cur || []).length ? 'Lanjut' : 'Lewati') + icon('next');
    $$('.opt', optsEl).forEach((b) => b.onclick = () => this.pickOpt(s, +b.dataset.o, b));
    if (afterAct) guard(optsEl, 600);
    if (wantIdx >= 0) this.tHint = setTimeout(() => { const hb = $(`.opt[data-o="${wantIdx}"]`, optsEl); if (hb && !hb.classList.contains('sel')) hb.classList.add('hint'); }, 3200);
  },
  pickOpt(s, i, btn) {
    if (s.multi) {
      let arr = (K.st[s.k] || []).slice();
      if (s.stack) {
        if (arr.length >= s.multi) arr = [];
        arr.push(i);
      } else if (arr.includes(i)) arr = arr.filter((x) => x !== i);
      else { if (arr.length >= s.multi) arr.shift(); arr.push(i); }
      K.st[s.k] = arr;
      this.renderDish(true);
      this.markWants();
      AUD.S.pop();
      FX.at(btn, 'sparkle', 8, { speed: 140 });
      const optsEl = $('.opts', this.el);
      $$('.opt', optsEl).forEach((b) => {
        const k = +b.dataset.o;
        b.classList.toggle('sel', arr.includes(k));
        const cnt = s.stack ? arr.filter((x) => x === k).length : 0;
        $('.on', b).textContent = O[s.o][k].n + (cnt > 1 ? ' ×' + cnt : '');
      });
      $('[data-next]', this.el).innerHTML = (arr.length ? 'Lanjut' : 'Lewati') + icon('next');
      return;
    }
    K.st[s.k] = i;
    $$('.opt', $('.opts', this.el)).forEach((b) => b.classList.toggle('sel', +b.dataset.o === i));
    this.renderDish(true);
    this.markWants();
    AUD.S.select();
    FX.at($('.dishbox', this.el), 'sparkle', 12, { speed: 200 });
    clearTimeout(this.tAdv);
    this.tAdv = setTimeout(() => this.next(), 520);
  },
  next() {
    clearTimeout(this.tAdv);
    K.step = Math.min(K.step + 1, K.m.steps.length);
    this.renderStep();
  },
  undo() {
    clearTimeout(this.tAdv);
    if (K.step === 0) return;
    K.step--;
    const s = K.m.steps[K.step];
    if (s.act) delete K.st['_' + s.act];
    else delete K.st[s.k];
    this.markWants();
    this.renderStep();
  },
  serve(btn) {
    const c = K.c;
    c.kitchen = null;
    const st = JSON.parse(JSON.stringify(K.st));
    st._done = 1;
    AUD.S.cheer();
    FX.at(btn, 'confetti', 30, { speed: 380 });
    UI.go('resto', { serve: { cust: c.id, st } }, UI.center(btn));
  },

  /* ---------------- mini-game ---------------- */
  stopAct() {
    if (this.act && this.act.stop) this.act.stop();
    this.act = null;
  },
  startAct(s) {
    const box = $('.k-act', this.el);
    this.act = KACT.mount(box, s, K, () => {
      K.st['_' + s.act] = 1;
      AUD.S.ding();
      FX.at($('.dishbox', this.el), 'sparkle', 18, { speed: 220 });
      this.renderDish(true);
      setTimeout(() => { if (UI.current() === 'kitchen' && K.m.steps[K.step] === s) this.next(); }, 650);
    });
  },
});

          `<rect x="88" y="130" width="112" height="120" rx="16" fill="#f4fbff" stroke="#bfe0f4" stroke-width="3"/><path d="M110 236C108 196 124 176 144 176C164 176 180 196 178 236Z" fill="${j}" class="jl" opacity=".55"/>` +

  function mount(box, step, K, onDone) {
    const def = DEFS[step.act];
    const need = typeof def.taps === 'function' ? def.taps(step) : def.taps;
    box.innerHTML = `<div class="hint">${esc(def.hint(step))}</div><div class="scene" role="button" tabindex="0" aria-label="${esc(def.hint(step))}"><svg viewBox="0 0 300 300">${def.scene(step, K.st)}</svg></div>` +
      `<div class="bar"><i></i>${def.mark ? `<span class="mark" style="left:${def.mark * 100}%"></span>` : ''}</div>` +
      (def.button ? `<button class="btn big sky hold" data-hold>${esc(def.button)}</button>` : '') +
      (def.mode === 'flip' ? `<button class="btn big sun" data-flip disabled>Balik!</button>` : '');
    const scene = $('.scene', box), svg = $('svg', scene), bar = $('.bar i', box);
    let p = 0, done = false, holding = false, taps = 0, raf = 0, last = performance.now(), stopSnd = null, lastPt = null, rubSnd = 0;
    const set = (v) => {
      p = clamp(v, 0, 1);
      bar.style.width = `calc(${(p * 100).toFixed(1)}% - 8px)`;
      if (def.update) def.update(svg, p, performance.now(), holding, step);
    };
    const finish = (msg) => {
      if (done) return;
      done = true;
      holding = false;
      if (stopSnd) { stopSnd(); stopSnd = null; }
      if (def.update) def.update(svg, p, performance.now(), false, step);
      if (msg) UI.toast(msg, icon('check', 'tic'), 1300);
      onDone();
    };
    const tick = (t) => {
      raf = requestAnimationFrame(tick);
      const dt = Math.min(0.05, (t - last) / 1000);
      last = t;
      if (done) return;
      if (def.mode === 'hold' && holding) {
        set(p + def.rate * dt);
        if (def.snow && Math.random() < 0.4) { const r = scene.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height * 0.62, 'sparkle', 1, { speed: 60, g: 200, color: '#ffffff', size: 0.6 }); }
        if (p >= 1) finish('Pas sekali!');
      } else if (def.mode === 'auto' || def.mode === 'flip') {
        set(p + dt / ((def.dur || 2400) / 1000));
        if (def.mode === 'auto' && p >= 1) finish();
        if (def.mode === 'flip') { const fb = $('[data-flip]', box); if (fb && p >= 0.5 && fb.disabled) { fb.disabled = false; fb.classList.add('pulse'); AUD.S.bell(); } }
      } else if (def.update) def.update(svg, p, t, holding, step);
    };
    raf = requestAnimationFrame(tick);
    const local = (e) => {
      const m = svg.getScreenCTM();
      if (!m) return [150, 150];
      const q = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
      return [q.x, q.y];
    };
    const down = (e) => {
      if (done) return;
      AUD.unlock();
      if (def.mode === 'hold') {
        holding = true;
        if (!stopSnd && def.sound) stopSnd = AUD.loop(def.sound);
        if (e.currentTarget.setPointerCapture) try { e.currentTarget.setPointerCapture(e.pointerId); } catch (er) {}
      } else if (def.mode === 'tap') {
        taps++;
        if (def.tap) def.tap(svg, taps, step);
        if (def.sound === 'sizzle') AUD.S.flip(); else if (def.sound === 'fan') AUD.S.fan(); else if (def.sound === 'shake') AUD.S.whisk(); else if (step.fx !== 'ice') AUD.S.pop();
        if (def.smoke || step.act === 'fry') FX.burst(e.clientX, e.clientY - 20, 'smoke', 2, { speed: 80 });
        if (step.fx === 'cheese') { const r = scene.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height * 0.3, 'crumb', 10, { speed: 140, color: '#ffd84a', g: 600 }); }
        set(taps / need);
        if (taps >= need) setTimeout(() => finish(), 300);
      } else if (def.mode === 'rub') {
        lastPt = [e.clientX, e.clientY];
        set(p + 0.05);
        AUD.S.whisk();
        if (def.move) { const q = local(e); def.move(svg, q[0], q[1]); }
        if (scene.setPointerCapture) try { scene.setPointerCapture(e.pointerId); } catch (er) {}
        if (p >= 1) finish('Halus sekali!');
      } else if (def.mode === 'auto') {
        if (def.tap) def.tap(svg);
        AUD.S.pop();
        set(p + (def.boost || 0.1));
        FX.burst(e.clientX, e.clientY, 'sparkle', 4, { speed: 100 });
        if (p >= 1) finish();
      }
    };
    const move = (e) => {
      if (done || def.mode !== 'rub' || !lastPt) return;
      const d = Math.hypot(e.clientX - lastPt[0], e.clientY - lastPt[1]);
      lastPt = [e.clientX, e.clientY];
      const q = local(e);
      if (def.move) def.move(svg, q[0], q[1]);
      set(p + (d / def.need) * (600 / Math.max(300, scene.getBoundingClientRect().width)));
      rubSnd += d;
      if (rubSnd > 60) { rubSnd = 0; AUD.S.whisk(); }
      if (p >= 1) finish('Halus sekali!');
    };
    const up = () => {
      lastPt = null;
      if (def.mode === 'hold' && holding) {
        holding = false;
        if (stopSnd) { stopSnd(); stopSnd = null; }
        if (def.update) def.update(svg, p, performance.now(), false, step);
        if (p >= 0.85) finish(p < 0.97 ? 'Pas sekali!' : '');
      }
    };
    scene.addEventListener('pointerdown', down);
    scene.addEventListener('pointermove', move);
    addEventListener('pointerup', up);
    addEventListener('pointercancel', up);
    const hb = $('[data-hold]', box);
    if (hb) { hb.addEventListener('pointerdown', down); }
    const fb = $('[data-flip]', box);
    if (fb) fb.onclick = () => {
      if (done) return;
      const c = svg.querySelector('.cake');
      AUD.S.flip();
      if (c) c.animate([{ transform: 'translateY(0) scaleY(1)' }, { transform: 'translateY(-110px) scaleY(-1)' }, { transform: 'translateY(0) scaleY(1)' }], { duration: 560, easing: 'cubic-bezier(.3,0,.5,1)' });
      const cf = svg.querySelector('.cf'); if (cf) setTimeout(() => cf.setAttribute('fill', K.m.id === 'pancake' ? '#e8a858' : (O.patty[K.st.patty ?? 0] || O.patty[0]).c), 280);
      set(1);
      setTimeout(() => finish(pick(['Hebat!', 'Mantap!', 'Pas sekali!'])), 600);
    };
    if (def.mode === 'flip' || def.sound === 'sizzle' && def.mode !== 'tap') stopSnd = AUD.loop('sizzle');
    set(0);
    return {
      stop() {
        cancelAnimationFrame(raf);
        if (stopSnd) { stopSnd(); stopSnd = null; }
        removeEventListener('pointerup', up);
        removeEventListener('pointercancel', up);
      },
    };
  }
  return { mount };
})();

function agoText(t) {
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 2) return 'baru saja';
  if (m < 60) return m + ' menit lalu';
  const hh = Math.round(m / 60);
  if (hh < 24) return hh + ' jam lalu';
  const d = Math.round(hh / 24);
  return d + ' hari lalu';
}

function frameSVG(k, name) {
  switch (k) {
    case 1: return `<path fill-rule="evenodd" d="M0 0H600V800H0ZM28 28V690H572V28Z" fill="#ffffff"/><text x="300" y="752" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="34" fill="#7a5a88">${esc(name)}</text>`;
    case 2: { let s = ''; for (let i = 0; i < 14; i++) { s += flowerSVG(20 + i * 43, 22, 18, ['#ff7ab8', '#ffd84a', '#c9a8ff', '#ffffff'][i % 4]) + flowerSVG(20 + i * 43, 778, 18, ['#ffd84a', '#ff7ab8', '#ffffff', '#c9a8ff'][i % 4]); } for (let i = 1; i < 18; i++) { s += flowerSVG(22, 22 + i * 44, 16, ['#ffffff', '#ff7ab8', '#ffd84a'][i % 3]) + flowerSVG(578, 22 + i * 44, 16, ['#ff7ab8', '#ffd84a', '#ffffff'][i % 3]); } return s; }
    case 3: { let s = '<rect x="8" y="8" width="584" height="784" rx="20" fill="none" stroke="url(#g-gold)" stroke-width="16"/>'; for (let i = 0; i < 9; i++) s += `<path d="${starPath(40 + i * 65, 40, 18, 8)}" fill="#ffe36b" stroke="#e8a21a" stroke-width="2"/><path d="${starPath(40 + i * 65, 760, 18, 8)}" fill="#ffe36b" stroke="#e8a21a" stroke-width="2"/>`; return s; }
    case 4: { let s = '<rect x="8" y="8" width="584" height="784" rx="30" fill="none" stroke="#ff8cc0" stroke-width="14"/>'; for (let i = 0; i < 8; i++) s += `<path d="${heartPath(50 + i * 72, 36, 16)}" fill="#ff5f8f"/><path d="${heartPath(50 + i * 72, 766, 16)}" fill="#ff5f8f"/>`; return s; }
    default: return '';
  }
}
/* gambar satu foto lengkap (dipakai di layar & album) */
function photoSVG(ph, opts = {}) {
  const P = PH_POSES[ph.pose] || PH_POSES[0];
  const look = ph.look || G.S.look;
  const ch = CH.inner(look, { pose: P.pose, expr: P.expr, noShadow: 0 }).svg;
  const props = (ph.props || []).map((p, i) => `<g class="prop" data-i="${i}" transform="translate(${r1(p.x)} ${r1(p.y)}) rotate(${r1(p.r || 0)}) scale(${p.s || 1})" style="cursor:grab">${(PH_PROPS[p.k] || PH_PROPS[0]).s()}<circle r="40" fill="transparent"/></g>`).join('');
  const pet = ph.pet && ph.pet.t >= 0 ? `<svg x="400" y="600" width="170" height="190" viewBox="0 -24 160 184">${PET.svg(ph.pet, { expr: 'joy' })}</svg>` : '';
  const name = ph.name || (G.F ? G.F.name : '');
  return `<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" ${opts.cls ? `class="${opts.cls}"` : ''}>${SCN.photoBg(ph.bg | 0)}` +

    `${pet}<g class="props">${props}</g>${frameSVG(ph.frame | 0, name)}</svg>`;
}

UI.reg('photo', {
  color: '#c0a2ff',
  build() {
    this.el = h(`<section class="screen" id="scr-photo" style="background:radial-gradient(120% 90% at 30% 20%,#fbf6ff 0%,#efe4ff 50%,#ffe3f1 100%)">
      <div class="two"><div class="left"><div class="photo-frame"><div class="ph"></div><div class="flash"></div></div></div>
      <div class="right"><div class="subtabs"></div><div class="opts"></div>
        <div class="st-foot"><button class="btn small white" data-album>${icon('album')}Album</button><button class="btn small coral" data-clear>${icon('trash')}Hapus stiker</button><button class="btn big sun" data-shoot>${icon('camera')}Cekrek!</button></div></div></div>
      ${UI.hud({ back: true })}</section>`);
    $('#app').appendChild(this.el);
    $('[data-shoot]', this.el).onclick = () => this.shoot();
    $('[data-album]', this.el).onclick = () => this.album();
    $('[data-clear]', this.el).onclick = () => { this.ph.props = []; this.draw(); AUD.S.pop(); };
  },
  enter() {
    AUD.setMood('home');
    this.ph = this.ph || { bg: 0, pose: 2, frame: 1, props: [] };
    this.tab = this.tab || 0;
    this.draw();
    this.renderTabs();
  },
  draw() {
    const S = G.S;
    const ph = Object.assign({}, this.ph, { look: S.look, pet: S.pet });
    $('.ph', this.el).innerHTML = photoSVG(ph, { still: 1 });
    this.bindProps();
  },
  bindProps() {
    const svg = $('.ph > svg', this.el);
    if (!svg) return;
    $$('.prop', svg).forEach((g) => {
      g.onpointerdown = (e) => {
        e.preventDefault();
        const i = +g.dataset.i;
        const m = svg.getScreenCTM();
        if (!m) return;
        const inv = m.inverse();
        const pr = this.ph.props[i];
        const start = new DOMPoint(e.clientX, e.clientY).matrixTransform(inv);
        const ox = pr.x - start.x, oy = pr.y - start.y;
        const mv = (ev) => {
          const q = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(inv);
          pr.x = clamp(q.x + ox, 20, 580); pr.y = clamp(q.y + oy, 20, 780);
          g.setAttribute('transform', `translate(${r1(pr.x)} ${r1(pr.y)}) rotate(${r1(pr.r || 0)}) scale(${pr.s || 1})`);
        };
        const upf = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', upf); };
        addEventListener('pointermove', mv);
        addEventListener('pointerup', upf);
      };
    });
  },
  renderTabs() {
    const tabs = ['Latar', 'Gaya', 'Bingkai', 'Stiker'];
    const st = $('.subtabs', this.el);
    st.innerHTML = tabs.map((t, i) => `<button class="stab ${i === this.tab ? 'on' : ''}" data-t="${i}">${t}</button>`).join('');
    $$('[data-t]', st).forEach((b) => b.onclick = () => { this.tab = +b.dataset.t; this.renderTabs(); });
    const box = $('.opts', this.el);
    const S = G.S;
    let items = [];
    if (this.tab === 0) items = SCN.PHOTO_BG.map((n, i) => ({ n, sel: this.ph.bg === i, th: `<svg viewBox="0 0 600 800">${SCN.photoBg(i)}</svg>`, on: () => { this.ph.bg = i; } }));
    if (this.tab === 1) items = PH_POSES.map((p, i) => ({ n: p.n, sel: this.ph.pose === i, th: CH.svg(S.look, { view: 'tight', pose: p.pose, expr: p.expr, noAnim: 1 }), on: () => { this.ph.pose = i; } }));
    if (this.tab === 2) items = PH_FRAMES.map((f, i) => ({ n: f.n, sel: this.ph.frame === i, th: `<svg viewBox="0 0 600 800"><rect width="600" height="800" fill="#e9f6ff"/>${frameSVG(i, G.F.name)}</svg>`, on: () => { this.ph.frame = i; } }));
    if (this.tab === 3) items = PH_PROPS.map((p, i) => ({ n: p.n, sel: false, th: `<svg viewBox="-50 -50 100 100">${p.s()}</svg>`, on: () => { if (this.ph.props.length >= 10) this.ph.props.shift(); this.ph.props.push({ k: i, x: randi(80, 520), y: randi(80, 360), r: randi(-20, 20), s: (0.8 + Math.random() * 0.6).toFixed(2) }); } }));
    box.innerHTML = items.map((it, i) => `<button class="opt ${it.sel ? 'sel' : ''}" data-i="${i}"><div class="th">${it.th}</div><span class="on">${esc(it.n)}</span></button>`).join('');
    $$('.opt', box).forEach((b) => b.onclick = () => {
      items[+b.dataset.i].on();
      if (this.tab !== 3) $$('.opt', box).forEach((x) => x.classList.toggle('sel', x === b));
      this.draw();
      AUD.S.select();
      FX.at($('.photo-frame', this.el), 'sparkle', 10, { speed: 180 });
    });
  },
  async shoot() {
    if (this.busy) return;
    this.busy = true;
    const fr = $('.photo-frame', this.el);
    for (const n of [3, 2, 1]) {
      const c = h(`<div class="count">${n}</div>`);
      fr.appendChild(c);
      AUD.S.tap();
      await sleep(620);
      c.remove();
    }
    AUD.S.shutter();
    const fl = $('.flash', this.el);
    fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');
    const S = G.S;
    const ph = JSON.parse(JSON.stringify(Object.assign({}, this.ph, { look: S.look, pet: S.pet, name: G.F.name, t: Date.now() })));
    S.album.unshift(ph);
    if (S.album.length > 12) S.album.length = 12;
    S.prog.photos++;
    Save.touch(G.id);
    G.check();
    const ab = $('[data-album]', this.el);
    const r = fr.getBoundingClientRect(), t = ab.getBoundingClientRect();
    const ghost = h(`<div style="position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;z-index:78;border:8px solid #fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 40px rgba(0,0,0,.25);pointer-events:none">${photoSVG(ph, { still: 1 })}</div>`);
    document.body.appendChild(ghost);
    await sleep(500);
    await ghost.animate([{ transform: 'none' }, { transform: `translate(${t.left + t.width / 2 - r.left - r.width / 2}px, ${t.top + t.height / 2 - r.top - r.height / 2}px) scale(.08) rotate(-12deg)` }], { duration: 650, easing: 'cubic-bezier(.5,0,.3,1)', fill: 'forwards' }).finished.catch(() => {});
    ghost.remove();
    FX.at(ab, 'sparkle', 16);
    UI.toast('Foto tersimpan di album!', icon('album', 'tic'));
    this.busy = false;
  },
  album() {
    const S = G.S;
    if (!S.album.length) { UI.toast('Albummu masih kosong. Ayo foto dulu!', icon('camera', 'tic')); return; }
    UI.modal({
      cls: 'wide',
      html: `<h3 class="ttl" style="font-size:1.8rem">Album Foto ${esc(G.F.name)}</h3><p class="sub" style="margin:4px 0 14px">${S.album.length} foto</p>` +
        `<div class="album">${S.album.map((ph, i) => `<div class="ph" data-i="${i}" style="--r:${((i * 37) % 9) - 4}deg">${photoSVG(ph, { still: 1 })}</div>`).join('')}</div>`,
      onOpen: (card) => { $$('.ph', card).forEach((p) => p.onclick = () => { UI.closeModal(); this.viewPhoto(+p.dataset.i); }); },
    });
  },
  viewPhoto(i) {
    const S = G.S, ph = S.album[i];
    if (!ph) return;
    const canDl = !G.inArtifact();
    UI.modal({
      html: `<div style="width:min(320px,70vw);margin:0 auto;border:8px solid #fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 24px rgba(61,33,72,.2)">${photoSVG(ph)}</div>` +
        `<div class="row">${canDl ? `<button class="btn sky" data-dl>${icon('download')}Simpan ke perangkat</button>` : ''}<button class="btn coral small" data-del>${icon('trash')}Hapus</button><button class="btn mint" data-mclose>Tutup</button></div><div data-confirm></div>`,
      onOpen: (card) => {

          $('[data-yes]', card).onclick = () => { S.album.splice(i, 1); Save.touch(G.id); UI.closeModal(); UI.toast('Foto dihapus.', icon('trash', 'tic')); };
          $('[data-no]', card).onclick = () => { $('[data-confirm]', card).innerHTML = ''; };
        };

});

function downloadPhoto(ph) {
  try {
    const defs = ($('#gdefs') ? $('#gdefs').innerHTML : '') + ($('#gfood') ? $('#gfood').innerHTML : '');
    let svg = photoSVG(ph, { still: 1 });
    svg = svg.replace('<svg viewBox="0 0 600 800" xmlns="http://www.w3.org/2000/svg" >', `<svg viewBox="0 0 600 800" width="900" height="1200" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">${defs}`);
    svg = svg.replace(/<svg viewBox="0 0 600 800" xmlns="http:\/\/www.w3.org\/2000\/svg"\s*>/, `<svg viewBox="0 0 600 800" width="900" height="1200" xmlns="http://www.w3.org/2000/svg">${defs}`);
    const img = new Image();
    img.onload = () => {
      const cv = document.createElement('canvas');
      cv.width = 900; cv.height = 1200;
      cv.getContext('2d').drawImage(img, 0, 0, 900, 1200);
      cv.toBlob((b) => {
        if (!b) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = `foto-${(ph.name || 'lava').toLowerCase().replace(/\s+/g, '-')}.png`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 4000);
        UI.toast('Foto disimpan!', icon('download', 'tic'));
      }, 'image/png');
    };
    img.onerror = () => UI.toast('Foto belum bisa disimpan di perangkat ini.', icon('camera', 'tic'));
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  } catch (e) { UI.toast('Foto belum bisa disimpan di perangkat ini.', icon('camera', 'tic')); }
}

/* ---------------- HEWAN PELIHARAAN ---------------- */
UI.reg('pet', {
  color: '#5fe0c4',
  build() {
    this.el = h(`<section class="screen" id="scr-pet" style="background:radial-gradient(120% 90% at 30% 30%,#f2fff9 0%,#d6f7ec 50%,#fff3df 100%)">
      <div class="two"><div class="left"><div class="pet-stage"><div class="floor"></div><div class="pv"></div><div class="ntag ribbon" style="position:absolute;bottom:4%;left:50%;transform:translateX(-50%)"></div></div></div>
      <div class="right"><div class="subtabs"></div><div class="opts"></div>
        <div class="st-foot"><button class="btn small mint" data-pat>${icon('heart')}Elus</button><button class="btn small sun" data-feed>${icon('cupcake')}Camilan</button><button class="btn small sky" data-ball>Main bola</button></div></div></div>
      ${UI.hud({ back: true })}</section>`);
    $('#app').appendChild(this.el);
    $('[data-pat]', this.el).onclick = () => this.pat();
    $('[data-feed]', this.el).onclick = (e) => this.feed(e.currentTarget);
    $('[data-ball]', this.el).onclick = () => this.ball();
  },
  enter() { AUD.setMood('home'); this.tab = G.S.pet.t >= 0 ? (this.tab || 0) : 0; this.render(); },
  render(expr) {
    const S = G.S, has = S.pet.t >= 0;
    $('.pv', this.el).innerHTML = has ? PET.full(S.pet, { expr }) : `<div style="text-align:center"><svg viewBox="0 0 64 64" style="width:120px;margin:0 auto">${IC.paw.replace(/#fff/g, '#5fe0c4')}</svg><p class="ttl" style="font-size:1.4rem;margin-top:8px">Pilih hewan untuk diadopsi!</p></div>`;
    const tag = $('.ntag', this.el);
    tag.hidden = !has;
    if (has) tag.textContent = PET_NAMES[S.pet.nm | 0];
    const pv = $('.pv svg', this.el);
    if (pv) pv.onclick = () => this.pat();
    $$('.st-foot .btn', this.el).forEach((b) => (b.hidden = !has));
    const tabs = has ? ['Jenis', 'Warna', 'Aksesoris', 'Nama'] : ['Adopsi'];
    const st = $('.subtabs', this.el);
    st.innerHTML = tabs.map((t, i) => `<button class="stab ${i === this.tab ? 'on' : ''}" data-t="${i}">${t}</button>`).join('');
    $$('[data-t]', st).forEach((b) => b.onclick = () => { this.tab = +b.dataset.t; this.render(); });
    const box = $('.opts', this.el);
    let items = [];
    const p = S.pet;
    if (this.tab === 0) items = PETS.map((T, i) => ({ n: T.n, key: 'pet:' + i, sel: p.t === i, th: PET.full({ t: i, c: i === p.t ? p.c : 0, a: 0 }), on: () => { const first = p.t < 0; p.t = i; p.c = Math.min(p.c, PETS[i].cols.length - 1); if (first) { p.nm = randi(0, PET_NAMES.length - 1); UI.toast(`Selamat datang, <b>${PET_NAMES[p.nm]}</b>!`, PET.full(p)); AUD.S.cheer(); FX.rain(40); } } }));
    if (this.tab === 1) items = PETS[p.t].cols.map((c, i) => ({ n: 'Warna ' + (i + 1), sel: p.c === i, th: PET.full({ t: p.t, c: i, a: p.a }), on: () => { p.c = i; } }));
    if (this.tab === 2) items = PET_ACC.map((a, i) => ({ n: a.n, sel: p.a === i, th: PET.full({ t: p.t, c: p.c, a: i }), on: () => { p.a = i; } }));
    if (this.tab === 3) items = PET_NAMES.map((nm, i) => ({ n: nm, sel: p.nm === i, th: `<svg viewBox="0 0 120 70"><rect x="6" y="14" width="108" height="44" rx="22" fill="#fff" stroke="#5fe0c4" stroke-width="4"/><text x="60" y="44" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="20" fill="#10997f">${esc(nm)}</text></svg>`, on: () => { p.nm = i; } }));
    box.innerHTML = items.map((it, i) => {
      const a = it.key ? G.avail(it.key) : { ok: true };
      const lock = a.ok ? '' : `<div class="lock">${a.lvl ? `<span class="price lv">Lv ${a.lvl}</span>` : `<span class="price">${COIN_SVG}${a.price}</span>`}</div>`;
      return `<button class="opt ${it.sel ? 'sel' : ''}" data-i="${i}"><div class="th">${it.th}</div><span class="on">${esc(it.n)}</span>${lock}</button>`;
    }).join('');
    $$('.opt', box).forEach((b) => b.onclick = () => {
      const it = items[+b.dataset.i];
      const go = () => { it.on(); Save.touch(G.id); G.check(); AUD.S.select(); this.render('joy'); FX.at($('.pv', this.el), 'heart', 10, { speed: 200, up: 100 }); setTimeout(() => { if (UI.current() === 'pet') this.render(); }, 1300); };
      if (it.key) G.tryUse(it.key, go); else go();
    });
  },
  pat() {
    const S = G.S;
    if (S.pet.t < 0) return;
    $('.pv', this.el).innerHTML = PET.full(S.pet, { expr: 'joy', cls: 'happy' });
    AUD.S.pet();
    FX.at($('.pv', this.el), 'heart', 12, { speed: 220, up: 140 });
    clearTimeout(this.tp);
    this.tp = setTimeout(() => { if (UI.current() === 'pet') this.render(); }, 1400);
  },
  feed(btn) {
    const S = G.S;
    const treat = pick(['cherry', 'strawberry', 'banana', 'meatball', 'marshmallow', 'sugarheart']);
    const r = btn.getBoundingClientRect();
    FX.flyTo(r.left + r.width / 2, r.top, $('.pv', this.el), `<svg viewBox="-12 -12 24 24" style="width:100%;height:100%"><use href="#sp-${treat}" x="-12" y="-12" width="24" height="24"/></svg>`, 1, () => {
      AUD.S.chomp(); setTimeout(() => AUD.S.chomp(), 200);
      this.pat();
      UI.toast(`${esc(PET_NAMES[S.pet.nm | 0])} suka camilannya!`, PET.full(S.pet, { expr: 'joy' }), 1600);
    });
  },
  ball() {
    const st = $('.pet-stage', this.el);
    const b = h(`<div style="position:absolute;left:0;bottom:16%;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 12%,#ff6f8f 13% 48%,#ffd84a 49% 64%,#5fb8ff 65%);box-shadow:0 6px 0 rgba(0,0,0,.12);z-index:3"></div>`);
    st.appendChild(b);
    const w = st.clientWidth;
    b.animate([{ transform: 'translate(-60px,0) rotate(0)' }, { transform: `translate(${w * 0.3}px,-120px) rotate(200deg)` }, { transform: `translate(${w * 0.55}px,0) rotate(400deg)` }, { transform: `translate(${w * 0.75}px,-70px) rotate(560deg)` }, { transform: `translate(${w + 60}px,0) rotate(760deg)` }], { duration: 1600, easing: 'ease-in-out' }).onfinish = () => b.remove();
    AUD.S.boing();
    setTimeout(() => this.pat(), 500);
  },
});

/* ---------------- DEKOR TOKO ---------------- */
const DECOR_TABS = [
  { n: 'Nama Toko', k: 'nm' }, { n: 'Dinding', k: 'wall' }, { n: 'Motif Dinding', k: 'wallP' }, { n: 'Lantai', k: 'floor' },
  { n: 'Kanopi', k: 'awn' }, { n: 'Model Kanopi', k: 'awnS' }, { n: 'Meja', k: 'table' }, { n: 'Lampu', k: 'light' }, { n: 'Hiasan', k: 'deco' }, { n: 'Warna Toko', k: 'sign' },
];
UI.reg('decor', {
  color: '#ffd36a',
  build() {
    this.el = h(`<section class="screen" id="scr-decor" style="background:radial-gradient(120% 90% at 30% 20%,#fffaf0 0%,#fff0d0 50%,#ffe3f1 100%)">
      <div class="two"><div class="left" style="flex-direction:column;gap:10px"><div class="subtabs" style="justify-content:center"><button class="stab on" data-v="in">Dalam</button><button class="stab" data-v="out">Depan</button></div><div class="decor-prev"></div></div>
      <div class="right"><div class="subtabs tabsd"></div><div class="opts"></div></div></div>
      ${UI.hud({ back: true })}</section>`);
    $('#app').appendChild(this.el);
    $$('[data-v]', this.el).forEach((b) => b.onclick = () => { this.view = b.dataset.v; $$('[data-v]', this.el).forEach((x) => x.classList.toggle('on', x === b)); this.preview(); });
  },
  enter() { AUD.setMood('home'); this.view = this.view || 'in'; this.tab = this.tab || 0; this.preview(); this.renderTabs(); },
  preview() {
    const S = G.S;
    const box = $('.decor-prev', this.el);
    if (this.view === 'out') box.innerHTML = `<div style="position:absolute;inset:0;background:linear-gradient(180deg,#a9e2ff,#d8f0ff 60%,#b9e88a 60%)"></div><div style="position:absolute;left:5%;right:5%;bottom:8%">${SCN.facade(S).replace('<svg ', '<svg style="width:100%;height:auto" ')}</div>`;
    else box.innerHTML = SCN.dining(S, LAYOUTS.port).replace('<svg ', '<svg style="width:100%;height:100%" ') + `<div style="position:absolute;left:${(560 / 800) * 100}%;top:${((900 - 40) / 1280) * 100}%;width:${(260 / 800) * 100}%;transform:translateX(-50%)">${SCN.table(S)}</div>`;
  },
  renderTabs() {
    const st = $('.tabsd', this.el);
    st.innerHTML = DECOR_TABS.map((t, i) => `<button class="stab ${i === this.tab ? 'on' : ''}" data-t="${i}">${t.n}</button>`).join('');
    $$('[data-t]', st).forEach((b) => b.onclick = () => {
      this.tab = +b.dataset.t;
      this.renderTabs();
      const k = DECOR_TABS[this.tab].k;
      const want = ['awn', 'awnS', 'nm'].includes(k) ? 'out' : this.view;
      if (want !== this.view) { this.view = want; $$('[data-v]', this.el).forEach((x) => x.classList.toggle('on', x.dataset.v === want)); this.preview(); }
    });
    const S = G.S, sh = S.shop, k = DECOR_TABS[this.tab].k;
    const box = $('.opts', this.el);
    let items = [];
    const sw = (c) => `<svg viewBox="0 0 64 64"><circle cx="32" cy="34" r="24" fill="${dark(c, 0.15)}"/><circle cx="32" cy="31" r="24" fill="${c}" stroke="#fff" stroke-width="3"/></svg>`;
    switch (k) {
      case 'nm': {
        const f = G.F;
        items = SHOPNAMES.map((t, i) => ({ n: t.replace('{n}', f.name), i, th: `<svg viewBox="0 0 200 80"><rect x="6" y="14" width="188" height="52" rx="18" fill="#fffaf6" stroke="${PAL[sh.sign].c}" stroke-width="5"/><text x="100" y="47" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="${t.length > 14 ? 15 : 18}" fill="${dark(PAL[sh.sign].c, 0.3)}">${esc(t.replace('{n}', f.name))}</text></svg>` }));
        break;
      }
      case 'wall': items = WALLC.map((c, i) => ({ n: 'Warna ' + (i + 1), i, th: sw(c) })); break;
      case 'wallP': items = WALLP.map((p, i) => ({ n: p.n, i, th: `<svg viewBox="0 0 100 100"><defs>${''}</defs><rect x="6" y="6" width="88" height="88" rx="18" fill="${WALLC[sh.wall]}"/>${i ? `<rect x="6" y="6" width="88" height="88" rx="18" fill="${patFill('#dddddd', [0, 2, 1, 4, 5, 6, 3][i])}"/>` : ''}</svg>` })); break;
      case 'floor': items = FLOORS.map((f, i) => ({ n: f.n, i, key: 'fl:' + i, th: decorThumb('fl', i) })); break;
      case 'awn': items = PAL.map((c, i) => ({ n: c.n, i, th: sw(c.c) })); break;
      case 'awnS': items = AWNS.map((a, i) => ({ n: a.n, i, th: `<svg viewBox="0 0 120 80"><path d="M6 10H114V50${scallop(114, 6, 50, 5, 5)}Z" fill="${PAL[sh.awn].c}"/>${i === 0 ? [0, 1, 2, 3, 4].map((j) => `<rect x="${17 + j * 22}" y="10" width="11" height="40" fill="#fff"/>`).join('') : i === 2 ? [0, 1, 2, 3, 4].map((j) => `<circle cx="${18 + j * 22}" cy="${j % 2 ? 36 : 24}" r="5" fill="#fff"/>`).join('') : ''}</svg>` })); break;
      case 'table': items = TABLES.map((t, i) => ({ n: t.n, i, key: 'tb:' + i, th: SCN.table({ shop: Object.assign({}, sh, { table: i }) }) })); break;
      case 'light': items = LIGHTS.map((l, i) => ({ n: l.n, i, key: 'li:' + i, th: decorThumb('li', i) })); break;
      case 'deco': items = DECOS.map((d, i) => ({ n: d.n, i, key: 'de:' + i, th: decorThumb('de', i) })); break;
      case 'sign': items = PAL.map((c, i) => ({ n: c.n, i, th: sw(c.c) })); break;
    }
    const cur = k === 'nm' ? ((sh.nm | 0) >= SHOPNAMES.length ? -1 : sh.nm | 0) : sh[k] | 0;
    box.innerHTML = (k === 'nm' ? `<div style="grid-column:1/-1;display:flex;gap:10px"><input class="input" id="shopname" maxlength="22" placeholder="Ketik nama tokomu sendiri…" value="${esc(sh.custom || '')}"><button class="btn mint" data-own>Pakai</button></div>` : '') +
      items.map((it, j) => {
        const a = it.key ? G.avail(it.key) : { ok: true };
        const lock = a.ok ? '' : `<div class="lock">${a.lvl ? `<span class="price lv">Lv ${a.lvl}</span>` : `<span class="price">${COIN_SVG}${a.price}</span>`}</div>`;
        return `<button class="opt ${cur === it.i ? 'sel' : ''}" data-j="${j}" style="${k === 'nm' ? 'aspect-ratio:2.2/1' : ''}"><div class="th">${it.th}</div><span class="on">${esc(it.n)}</span>${lock}</button>`;
      }).join('');
    if (k === 'nm') box.style.gridTemplateColumns = 'repeat(auto-fill,minmax(170px,1fr))'; else box.style.gridTemplateColumns = '';
    $$('.opt', box).forEach((b) => b.onclick = () => {
      const it = items[+b.dataset.j];
      const go = () => { sh[k] = it.i; this.changed(); this.renderTabs(); };
      if (it.key) G.tryUse(it.key, go); else go();
    });
    const own = $('[data-own]', box);
    if (own) own.onclick = () => {
      const v = Save.cleanName($('#shopname', box).value).trim();
      if (!v) { UI.toast('Tulis nama tokonya dulu, ya!', icon('decor', 'tic')); return; }
      sh.custom = v; sh.nm = SHOPNAMES.length;
      this.changed(); this.renderTabs();
      UI.toast(`Nama toko: <b>${esc(v)}</b>`, icon('decor', 'tic'));
    };
  },
  changed() {
    const S = G.S;
    S.prog.decorCh++;
    Save.touch(G.id);
    G.check();
    this.preview();
    AUD.S.select();
    FX.at($('.decor-prev', this.el), 'sparkle', 16, { speed: 220 });
  },
});

      <div class="page"><div class="head"><h2 class="ttl">Album Stiker</h2><span class="ribbon" data-cnt></span></div><p class="sub" style="margin:-6px 0 16px">Kumpulkan stiker dengan bermain. Tidak ada yang kalah — semua bisa dapat!</p><div class="stk-grid"></div></div>

/* ---- 99-main.js ---- */
/* ============================================================
   99-main.js — mulai permainan
   ============================================================ */
(function boot() {
  DEFS.install();
  FOODFX.install();
  Save.load();
  Save.onWrite((ok) => { if (ok) UI.savedFlash(); });
  FX.init();
  UI.bind();
  const st = Save.data.settings;
  AUD.set({ sfx: st.sfx, voice: st.voice, music: st.music });
  if (reduceMotion) document.body.classList.add('reduce');
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { AUD.pause(); Save.write(); } else AUD.resume();
  });
  addEventListener('pagehide', () => Save.write());
  UI.show('title');
  // kedipan mata sesekali (lebih hemat daripada animasi CSS terus-menerus)
  setInterval(() => {
    if (document.hidden || reduceMotion) return;
    const d = UI.def(UI.current());
    const scope = $('#modal.on') || (d && d.el);
    if (!scope) return;
    $$('svg.chr:not(.still)', scope).forEach((el) => {
      if (Math.random() < 0.14) { el.classList.add('blk'); setTimeout(() => el.classList.remove('blk'), 130); }
    });
  }, 520);
  window.LAVA_SALON = { UI, G, Save, R, K, CH, MENU, PET, FRIENDS, makeOrder, orderState, dishSVG, defaultLook, version: '1.0' };

  // kartu toko dari link (#toko.xxxx)
  const tryHash = () => {
    const hs = location.hash || '';
    if (!/toko\./.test(hs)) return;
    const inc = Save.decode(hs);
    try { history.replaceState(null, '', location.href.split('#')[0]); } catch (e) {}
    if (!inc) { setTimeout(() => UI.toast('Link kartunya belum lengkap. Minta dikirim ulang, ya.', icon('key', 'tic'), 3600), 600); return; }
    setTimeout(() => G.importPreview(inc, (id, status) => {
      if (UI.current() === 'title') UI.def('title').render();
      if (G.id && (status === 'new' || status === 'updated')) UI.go('street', { focus: id });
    }), 700);
  };
  tryHash();
  addEventListener('hashchange', tryHash);
  if (!Save.canStore) setTimeout(() => UI.toast('Browser ini tidak bisa menyimpan otomatis. Pakai Kode Simpan di Pengaturan, ya.', icon('key', 'tic'), 4200), 1200);
})();

})();
</script>
