    if (Math.abs(inc.t - cur.t) < 60000 && inc.prog.served === cur.prog.served && JSON.stringify(inc.look) === JSON.stringify(cur.look)) return 'same';
    if (inc.t <= cur.t && cur.src === 'local') return 'older';
    // pertahankan hal lokal yang tidak ikut kode
    inc.album = cur.album || [];
    inc.daily = cur.daily || '';
    inc.prog.favN = cur.prog.favN || {};
    inc.src = 'kode';
    data.slots[inc.id] = inc;
    write();
    return 'updated';
  }

  return {
    load, write, soon, slot, ensure, touch, encode, decode, importSlot, newSlot, cleanName,
    get data() { return data; }, get canStore() { return canStore; },
    onWrite(fn) { listeners.push(fn); },
  };
})();

function shopName(s) {
  if (!s) return '';
  const f = FRIENDS[FRIEND_IDX[s.id]];
  if ((s.shop.nm | 0) >= SHOPNAMES.length && s.shop.custom) return s.shop.custom;
  return SHOPNAMES[(s.shop.nm | 0) % SHOPNAMES.length].replace('{n}', f ? f.name : '');
}

/* ---- 30-audio.js ---- */
/* ============================================================
   30-audio.js — efek suara & musik latar (Web Audio, tanpa file)
   + suara bicara (Text-to-Speech Bahasa Indonesia bila tersedia)
   ============================================================ */
const AUD = (() => {
  let ctx = null, master, sfxG, musG, noiseBuf = null;
  let sfxOn = true, musicOn = true, voiceOn = true;
  let musTimer = 0, musNext = 0, musStep = 0, mood = 'home';

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    try { ctx = new AC(); } catch (e) { ctx = null; return false; }
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    sfxG = ctx.createGain(); sfxG.gain.value = 0.55; sfxG.connect(master);
    musG = ctx.createGain(); musG.gain.value = 0; musG.connect(master);
    const len = ctx.sampleRate * 1.5;
    noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function unlock() {
    if (!init()) return;
    if (ctx.state === 'suspended') ctx.resume();
    if (musicOn && !musTimer) startMusic();
  }
  const now = () => (ctx ? ctx.currentTime : 0);

  function tone(f, dur, type = 'sine', vol = 0.3, t0 = 0, slide = 0, out = null, att = 0.006) {
    if (!ctx || (!sfxOn && !out)) return;
    const t = now() + t0;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + att);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out || sfxG);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(dur, vol, freq, t0 = 0, type = 'bandpass', q = 1, sweepTo = 0, out = null) {
    if (!ctx || (!sfxOn && !out)) return;
    const t = now() + t0;
    const src = ctx.createBufferSource(); src.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
    if (sweepTo) f.frequency.exponentialRampToValueAtTime(sweepTo, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(out || sfxG);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  }
  /* bunyi berulang selama ditahan (tuang, blender, desis) — kembalikan fungsi stop */
  function loop(kind) {
    if (!ctx || !sfxOn) return () => {};
    const src = ctx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = ctx.createBiquadFilter();
    const g = ctx.createGain(); g.gain.value = 0.0001;
    if (kind === 'pour') { f.type = 'lowpass'; f.frequency.value = 900; }
    else if (kind === 'blend') { f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.8; }
    else if (kind === 'sizzle') { f.type = 'highpass'; f.frequency.value = 3200; }
    else { f.type = 'bandpass'; f.frequency.value = 1500; }
    src.connect(f); f.connect(g); g.connect(sfxG);
    src.start();
    g.gain.exponentialRampToValueAtTime(kind === 'sizzle' ? 0.12 : 0.22, now() + 0.08);
    let lfo = null;
    if (kind === 'blend') {
      lfo = ctx.createOscillator(); const lg = ctx.createGain(); lfo.frequency.value = 18; lg.gain.value = 260;
      lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    }
    return () => {
      try {
        g.gain.cancelScheduledValues(now()); g.gain.setValueAtTime(g.gain.value, now());
        g.gain.exponentialRampToValueAtTime(0.0001, now() + 0.12);
        src.stop(now() + 0.15); if (lfo) lfo.stop(now() + 0.15);
      } catch (e) {}
    };
  }

  const S = {
    tap() { tone(700, 0.07, 'sine', 0.22); tone(1050, 0.06, 'sine', 0.12, 0.03); },
    pop() { tone(420, 0.1, 'sine', 0.3, 0, 520); },
    select() { tone(880, 0.1, 'triangle', 0.16); tone(1320, 0.14, 'triangle', 0.14, 0.05); S.sparkle(0.04); },
    sparkle(v = 0.06) { for (let i = 0; i < 5; i++) tone(1700 + Math.random() * 1500, 0.09, 'sine', v, i * 0.045); },
    coin() { tone(988, 0.08, 'square', 0.08); tone(1319, 0.28, 'square', 0.08, 0.07); },
    star() { [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, 0.2, 'triangle', 0.13, i * 0.07)); },
    whoosh() { noise(0.4, 0.18, 500, 0, 'bandpass', 0.8, 2600); },
    ding() { tone(1568, 0.9, 'sine', 0.22); tone(2349, 0.7, 'sine', 0.1, 0.01); },
    bell() { tone(1760, 0.5, 'sine', 0.16); tone(2637, 0.35, 'sine', 0.08, 0.08); },
    cheer() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.28, 'triangle', 0.14, i * 0.08)); S.sparkle(0.05); },
    levelup() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 'square', 0.07, i * 0.1)); [1047, 1319, 1568].forEach((f, i) => tone(f, 0.6, 'triangle', 0.12, 0.45 + i * 0.02)); },
    bubble() { tone(260 + Math.random() * 300, 0.09, 'sine', 0.2, 0, 380); },
    splash() { noise(0.18, 0.2, 1800, 0, 'bandpass', 1.2); tone(500, 0.1, 'sine', 0.1, 0, 300); },
    shutter() { noise(0.06, 0.35, 3500, 0, 'highpass'); noise(0.08, 0.25, 2000, 0.07, 'bandpass'); },
    soft() { tone(523, 0.14, 'triangle', 0.14); tone(659, 0.18, 'triangle', 0.12, 0.09); },
    giggle() { [880, 1040, 920, 1160, 1000].forEach((f, i) => tone(f, 0.07, 'sine', 0.14, i * 0.07, 80)); },
    boing() { tone(220, 0.35, 'sine', 0.25, 0, 300); },
    chomp() { noise(0.06, 0.25, 900, 0, 'bandpass', 2); },
    whisk() { noise(0.08, 0.12, 2600, 0, 'bandpass', 2); },
    flip() { tone(300, 0.15, 'sine', 0.2, 0, 400); noise(0.1, 0.12, 2500, 0.02, 'highpass'); },
    fan() { noise(0.18, 0.12, 700, 0, 'lowpass'); },
    pet() { tone(900, 0.12, 'sine', 0.14, 0, 300); tone(1200, 0.14, 'sine', 0.1, 0.1, -200); },
    unlock() { [784, 988, 1175, 1568].forEach((f, i) => tone(f, 0.16, 'triangle', 0.13, i * 0.06)); },
    gift() { noise(0.3, 0.2, 1200, 0, 'bandpass', 0.8, 3000); S.cheer(); },
    door() { tone(1318, 0.25, 'sine', 0.15); tone(1046, 0.4, 'sine', 0.12, 0.18); },
  };

  /* ---------- musik latar: progresi ceria I–vi–IV–V ---------- */
  const CH = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
  const mf = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const MEL = [[72, -1, 76, 74, 72, -1, 67, -1], [69, -1, 72, -1, 76, 74, 72, -1], [69, 72, 74, -1, 72, -1, 69, -1], [71, -1, 74, -1, 79, 77, 74, -1]];
  function startMusic() {
    if (!ctx || musTimer) return;
    musNext = now() + 0.1; musStep = 0;
    musG.gain.cancelScheduledValues(now());
    musG.gain.setValueAtTime(musG.gain.value, now());
    musG.gain.linearRampToValueAtTime(0.32, now() + 1.5);
    musTimer = setInterval(schedule, 40);
  }
  function stopMusic() {
    if (!ctx) return;
    clearInterval(musTimer); musTimer = 0;
    musG.gain.cancelScheduledValues(now());
    musG.gain.setValueAtTime(musG.gain.value, now());
    musG.gain.linearRampToValueAtTime(0, now() + 0.4);
  }
  function schedule() {
    const bpm = mood === 'resto' ? 112 : 96;
    const eighth = 60 / bpm / 2;
    while (musNext < now() + 0.15) {
      const bar = Math.floor(musStep / 8) % 4, st = musStep % 8;
      const ch = CH[bar];
      const t0 = musNext - now();
      // bas
      if (st === 0 || st === 4) tone(mf(ch[0] - 12), eighth * 1.8, 'sine', 0.22, t0, 0, musG, 0.01);
      // arpeggio lembut
      const arp = [0, 1, 2, 1, 0, 1, 2, 1][st];
      tone(mf(ch[arp] + 12), eighth * 0.9, 'triangle', 0.07, t0, 0, musG, 0.004);
      // melodi lonceng
      const m = MEL[bar][st];
      if (m > 0 && (mood === 'resto' || Math.floor(musStep / 32) % 2 === 0)) tone(mf(m), eighth * 1.6, 'sine', 0.09, t0, 0, musG, 0.004);
      if (mood === 'resto' && st % 2 === 1) noise(0.03, 0.03, 6000, t0, 'highpass', 1, 0, musG);
      musNext += eighth; musStep++;
    }
  }

  /* ---------- suara bicara ---------- */
  let idVoice = null;
  function pickVoice() {
    if (!('speechSynthesis' in window)) return null;
    const vs = speechSynthesis.getVoices();
    idVoice = vs.find((v) => /^id(-|_)?/i.test(v.lang)) || vs.find((v) => /indones/i.test(v.name)) || null;
    return idVoice;
  }
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function say(text, pitch = 1.25) {
    if (!voiceOn || !('speechSynthesis' in window)) return;
    if (!idVoice && !pickVoice()) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[~*]/g, ''));
      u.voice = idVoice; u.lang = idVoice.lang; u.rate = 1.04; u.pitch = pitch; u.volume = 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  }

  return {
    unlock, S, loop, say,
    hasVoice: () => !!(idVoice || pickVoice()),
    setMood(m) { mood = m; },
    set(opts) {
      if ('sfx' in opts) sfxOn = !!opts.sfx;
      if ('voice' in opts) { voiceOn = !!opts.voice; if (!voiceOn && 'speechSynthesis' in window) speechSynthesis.cancel(); }
      if ('music' in opts) { musicOn = !!opts.music; if (musicOn) { if (ctx) startMusic(); } else stopMusic(); }
    },
    pause() { stopMusic(); },
    resume() { if (musicOn && ctx) startMusic(); },
  };
})();

/* ---- 31-fx.js ---- */
/* ============================================================
   31-fx.js — partikel kanvas (konfeti, kilau, hati, gelembung…)
   + animasi "terbang ke penghitung" (koin & bintang)
   ============================================================ */
const FX = (() => {
  let cv, cx, W = 0, H = 0, dpr = 1, raf = 0;
  const parts = [];
  const COLS = ['#ff5fa2', '#ffc43d', '#4fb0ff', '#22c7a9', '#9a6bff', '#ff7a59', '#ffffff'];

  function init() {
    cv = $('#fx');
    cx = cv.getContext('2d');
    resize();
    addEventListener('resize', resize);
  }
  function resize() {
    dpr = Math.min(2, devicePixelRatio || 1);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
  }
  function add(p) {
    parts.push(p);
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
  }
  function burst(x, y, kind = 'sparkle', n = 16, o = {}) {
    if (reduceMotion) n = Math.ceil(n / 3);
    for (let i = 0; i < n; i++) {
      const a = o.dir != null ? o.dir + (Math.random() - 0.5) * (o.spread || 1.2) : Math.random() * Math.PI * 2;
      const sp = (o.speed || 260) * (0.4 + Math.random() * 0.8);
      add({
        k: kind, x: x + (Math.random() - 0.5) * (o.jitter || 10), y: y + (Math.random() - 0.5) * (o.jitter || 10),
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0),
        g: o.g != null ? o.g : kind === 'confetti' ? 520 : kind === 'bubble' || kind === 'smoke' || kind === 'note' ? -60 : 320,
        drag: o.drag || (kind === 'confetti' ? 1.6 : 2.4),
        life: 0, max: (o.life || 1) * (0.7 + Math.random() * 0.6),
        s: (o.size || 1) * (kind === 'confetti' ? 9 : kind === 'bubble' ? 10 + Math.random() * 12 : kind === 'smoke' ? 22 : 10) * (0.7 + Math.random() * 0.6),
        r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 10,
        c: o.color || COLS[Math.floor(Math.random() * COLS.length)],
      });
    }
  }
  function rain(n = 90) {
    for (let i = 0; i < n; i++) {
      add({ k: 'confetti', x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: (Math.random() - 0.5) * 120, vy: 80 + Math.random() * 160, g: 140, drag: 0.6,
        life: 0, max: 3 + Math.random() * 1.5, s: 8 + Math.random() * 6, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 12, c: COLS[i % COLS.length] });
    }
  }
  let last = 0;
  function tick(t) {
    const dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life >= p.max || p.y > H + 60) { parts.splice(i, 1); continue; }
      p.vx -= p.vx * p.drag * dt; p.vy -= p.vy * p.drag * dt * 0.5;
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
      const k = p.life / p.max;
      const a = k < 0.75 ? 1 : 1 - (k - 0.75) / 0.25;
      draw(p, a, k);
    }
    if (parts.length) raf = requestAnimationFrame(tick);
    else { raf = 0; cx.clearRect(0, 0, W, H); }
  }
  function star(x, y, R, r, n = 5) {
    cx.beginPath();
    for (let i = 0; i < n * 2; i++) {
      const a = -Math.PI / 2 + (i * Math.PI) / n, rr = i % 2 ? r : R;
      i ? cx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr) : cx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    cx.closePath();
  }
  function draw(p, a, k) {
    cx.globalAlpha = a;
    cx.save();
    cx.translate(p.x, p.y);
    switch (p.k) {
      case 'confetti':
        cx.rotate(p.r); cx.scale(1, Math.cos(p.r * 1.7));
        cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 3.2, p.s, p.s / 1.6);
        break;
      case 'sparkle': {
        const s = p.s * (1 - k * 0.5);
        cx.rotate(p.r * 0.2);
        cx.fillStyle = p.c === '#ffffff' ? '#fff6b0' : p.c;
        cx.beginPath(); cx.moveTo(0, -s); cx.quadraticCurveTo(0, 0, s, 0); cx.quadraticCurveTo(0, 0, 0, s); cx.quadraticCurveTo(0, 0, -s, 0); cx.quadraticCurveTo(0, 0, 0, -s); cx.fill();
        break;
      }
      case 'star':
        cx.rotate(p.r * 0.3); cx.fillStyle = '#ffc43d'; cx.strokeStyle = '#e09412'; cx.lineWidth = 2;
        star(0, 0, p.s, p.s * 0.45); cx.fill(); cx.stroke();
        break;
      case 'heart': {
        const s = p.s * 0.9;
        cx.rotate(Math.sin(p.r) * 0.3); cx.fillStyle = p.c === '#ffffff' ? '#ff5fa2' : p.c === '#ffc43d' ? '#ff7aa8' : '#ff5f8f';
        cx.beginPath(); cx.moveTo(0, s * 0.9); cx.bezierCurveTo(-s * 1.4, 0, -s * 0.75, -s * 0.95, 0, -s * 0.35); cx.bezierCurveTo(s * 0.75, -s * 0.95, s * 1.4, 0, 0, s * 0.9); cx.fill();
        break;
      }
      case 'bubble':
        cx.strokeStyle = 'rgba(255,255,255,.95)'; cx.lineWidth = 2; cx.fillStyle = 'rgba(200,236,255,.35)';
        cx.beginPath(); cx.arc(0, 0, p.s, 0, 6.29); cx.fill(); cx.stroke();
        cx.fillStyle = 'rgba(255,255,255,.9)'; cx.beginPath(); cx.arc(-p.s * 0.35, -p.s * 0.35, p.s * 0.22, 0, 6.29); cx.fill();
        break;
      case 'smoke':
        cx.fillStyle = 'rgba(255,255,255,.75)'; cx.beginPath(); cx.arc(0, 0, p.s * (0.6 + k), 0, 6.29); cx.fill();
        break;
      case 'drop':
        cx.fillStyle = '#7cc6ff'; cx.beginPath(); cx.moveTo(0, -p.s); cx.quadraticCurveTo(p.s * 0.8, 0, 0, p.s * 0.6); cx.quadraticCurveTo(-p.s * 0.8, 0, 0, -p.s); cx.fill();
        break;
      case 'note':
        cx.fillStyle = p.c === '#ffffff' ? '#9a6bff' : p.c; cx.rotate(Math.sin(p.r) * 0.3);
        cx.beginPath(); cx.ellipse(0, p.s * 0.6, p.s * 0.5, p.s * 0.38, -0.4, 0, 6.29); cx.fill();
        cx.fillRect(p.s * 0.35, -p.s * 0.9, 2.6, p.s * 1.5); cx.fillRect(p.s * 0.35, -p.s * 0.9, p.s * 0.6, 3);
        break;
      case 'crumb':
        cx.fillStyle = p.c; cx.beginPath(); cx.arc(0, 0, p.s * 0.35, 0, 6.29); cx.fill();
        break;
      case 'coin':
        cx.scale(Math.cos(p.r * 2), 1);
        cx.fillStyle = '#ffc43d'; cx.strokeStyle = '#e09412'; cx.lineWidth = 2;
        cx.beginPath(); cx.arc(0, 0, p.s, 0, 6.29); cx.fill(); cx.stroke();
        cx.fillStyle = '#fff3b0'; cx.beginPath(); cx.arc(-p.s * 0.3, -p.s * 0.3, p.s * 0.3, 0, 6.29); cx.fill();
        break;
    }
    cx.restore();
    cx.globalAlpha = 1;
  }
  function at(el, kind, n, o) {
    if (!el) return;
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, kind, n, o);
  }

  /* terbangkan ikon dari (x,y) ke elemen tujuan */
  function flyTo(x, y, target, iconSVG, n = 5, onArrive) {
    if (!target) { if (onArrive) onArrive(); return; }
    const tr = target.getBoundingClientRect();
    const tx = tr.left + tr.width * 0.25, ty = tr.top + tr.height / 2;
    let arrived = 0;
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'flyer';
      el.innerHTML = iconSVG;
      document.body.appendChild(el);
      const sx = x + (Math.random() - 0.5) * 50, sy = y + (Math.random() - 0.5) * 40;
      const mx = (sx + tx) / 2 + (Math.random() - 0.5) * 160, my = Math.min(sy, ty) - 80 - Math.random() * 80;
      const kf = [];
      for (let j = 0; j <= 12; j++) {
        const t = j / 12, u = 1 - t;
        const px = u * u * sx + 2 * u * t * mx + t * t * tx, py = u * u * sy + 2 * u * t * my + t * t * ty;
        kf.push({ transform: `translate(${px - 17}px, ${py - 17}px) scale(${1 + Math.sin(t * Math.PI) * 0.45})`, opacity: t > 0.92 ? 0.4 : 1 });
      }
      const an = el.animate(kf, { duration: 780 + i * 70, delay: i * 70, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'both' });
      an.onfinish = () => {
        el.remove();
        arrived++;
        if (arrived === 1 && onArrive) onArrive();
        if (target.classList) { target.classList.remove('bump'); void target.offsetWidth; target.classList.add('bump'); }
      };
    }
  }

  return { init, burst, rain, at, flyTo };
})();

const IC = {
  back: '<path d="M38 12L18 32L38 52" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>',

/* ---- 33-ui.js ---- */
/* ============================================================
   33-ui.js — pengelola layar, transisi lingkaran, HUD, toast, modal
   ============================================================ */
const UI = (() => {
  const screens = {};
  let cur = null, busy = false;
  const modalQ = [];
  let modalOpen = null;

  function reg(name, def) { screens[name] = def; }
  function current() { return cur; }
  function def(name) { return screens[name]; }

  async function go(name, params = {}, from = null) {
    if (busy || !screens[name]) return;
    busy = true;
    const d = screens[name];
    const wipe = $('#wipe');
    const x = from ? from.x : innerWidth / 2, y = from ? from.y : innerHeight / 2;
    const R = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y)) + 40;
    const sc = R / 20;
    wipe.getAnimations().forEach((a) => a.cancel());
    wipe.style.background = params.color || d.color || '#ff8cc0';
    wipe.style.left = x + 'px'; wipe.style.top = y + 'px';
    AUD.S.whoosh();
    // Gaya akhir ditulis ke inline style SEBELUM animasi (tanpa fill:'forwards'),
    // supaya tidak ada efek animasi lama yang tertinggal menutupi layar.
    wipe.style.opacity = '1';
    wipe.style.transform = `scale(${sc})`;
    try {
      await wipe.animate([{ transform: 'scale(0)' }, { transform: `scale(${sc})` }], { duration: reduceMotion ? 1 : 340, easing: 'cubic-bezier(.55,0,.8,.2)' }).finished;
    } catch (e) {}
    if (cur && screens[cur]) {
      try { screens[cur].leave && screens[cur].leave(); } catch (e) { console.error(e); }
      screens[cur].el.classList.remove('on', 'enter');
    }
    cur = name;
    if (!d.el) d.build();
    d.el.classList.add('on');
    try { d.enter && d.enter(params); } catch (e) { console.error(e); }
    refreshHud();
    d.el.classList.remove('enter'); void d.el.offsetWidth; d.el.classList.add('enter');
    wipe.style.opacity = '0';
    wipe.style.transform = `scale(${sc * 1.08})`;
    try {
      await wipe.animate([{ transform: `scale(${sc})`, opacity: 1 }, { transform: `scale(${sc * 1.08})`, opacity: 0 }], { duration: reduceMotion ? 1 : 420, easing: 'ease-out' }).finished;
    } catch (e) {}
    wipe.getAnimations().forEach((a) => a.cancel());
    wipe.style.transform = 'scale(0)';
    busy = false;
  }
  function show(name, params = {}) {
    const d = screens[name];
    if (cur && screens[cur]) { try { screens[cur].leave && screens[cur].leave(); } catch (e) {} screens[cur].el.classList.remove('on', 'enter'); }
    cur = name;
    if (!d.el) d.build();
    d.el.classList.add('on');
    try { d.enter && d.enter(params); } catch (e) { console.error(e); }
    refreshHud();
  }
  function center(el) {
    if (!el || !el.getBoundingClientRect) return null;
    const r = el.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }

  /* ---------- HUD ---------- */
  function hud(o = {}) {
    let s = '<div class="hud">';
    if (o.back) s += `<button class="btn round sky" data-act="back" aria-label="Kembali">${icon('back')}</button>`;
    if (o.home) s += `<button class="btn round" data-act="home" aria-label="Beranda">${icon('home')}</button>`;
    if (o.player !== false) s += `<div class="chip pchip"><div class="av"></div><div class="who"><span class="nm"></span><span class="lvtag"></span><div class="lvbar"><i></i></div></div></div>`;
    if (o.title) s += `<div class="chip" style="padding:0 16px">${o.title}</div>`;
    s += '<div class="grow"></div>';
    if (o.stars !== false) s += `<div class="chip starchip">${STAR_SVG}<span class="num">0</span></div>`;
    if (o.coins !== false) s += `<div class="chip coinchip">${COIN_SVG}<span class="num">0</span></div>`;
    if (o.menu !== false) s += `<button class="btn round grape" data-act="menu" aria-label="Pengaturan">${icon('gear')}</button>`;
    return s + '</div>';
  }
  const shown = { coins: null, stars: null };
  function refreshHud(animate = false) {
    const S = G.S;
    if (!S) return;
    const scr = cur && screens[cur] && screens[cur].el;
    if (!scr) return;
    const p = S.prog;
    const need = LEVEL_XP(p.lvl);
    $$('.pchip', scr).forEach((c) => {
      const av = $('.av', c);
      if (av.dataset.k !== G.lookKey()) { av.innerHTML = CH.svg(S.look, { view: 'head', noAnim: 1, noShadow: 1 }); av.dataset.k = G.lookKey(); }
      $('.nm', c).textContent = G.F.name;
      $('.lvtag', c).textContent = 'Level ' + p.lvl + (p.lvl >= MAX_LVL ? ' ★' : '');
      $('.lvbar i', c).style.width = (p.lvl >= MAX_LVL ? 100 : Math.round((p.xp / need) * 100)) + '%';
    });
    countTo('.coinchip .num', p.coins, 'coins', animate, scr);
    countTo('.starchip .num', p.stars, 'stars', animate, scr);
  }
  function countTo(sel, val, key, animate, scr) {
    const els = $$(sel, scr);
    const from = shown[key] == null ? val : shown[key];
    shown[key] = val;
    if (!animate || from === val) { els.forEach((e) => (e.textContent = val)); return; }
    const t0 = performance.now(), dur = 600;
    const step = (t) => {
      const k = Math.min(1, (t - t0) / dur);
      const v = Math.round(from + (val - from) * (1 - Math.pow(1 - k, 3)));
      els.forEach((e) => (e.textContent = v));
      if (k < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function chip(kind) {
    const scr = cur && screens[cur] && screens[cur].el;
    return scr ? $(kind === 'stars' ? '.starchip' : '.coinchip', scr) : null;
  }

  /* ---------- toast & tersimpan ---------- */
  function toast(html, ic = '', ms = 2300) {
    const box = $('#toasts');
    const el = h(`<div class="toast">${ic ? `<div class="tic">${ic}</div>` : ''}<div>${html}</div></div>`);
    box.appendChild(el);
    while (box.children.length > 3) box.firstChild.remove();
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 360); }, ms);
  }
  let savedT = 0;
  function savedFlash() {
    const el = $('#saved');
    el.classList.add('on');
    clearTimeout(savedT);
    savedT = setTimeout(() => el.classList.remove('on'), 1300);
  }

  /* ---------- modal (antrian) ---------- */
  function modal(o) {
    return new Promise((resolve) => {
      modalQ.push({ o, resolve });
      if (!modalOpen) nextModal();
    });
  }
  function nextModal() {
    const it = modalQ.shift();
    const root = $('#modal');
    if (!it) { modalOpen = null; root.classList.remove('on'); root.innerHTML = ''; return; }
    modalOpen = it;
    const o = it.o;
    root.innerHTML = `<div class="mcard ${o.cls || ''}" role="dialog" aria-modal="true">${o.close !== false ? `<button class="btn round coral mx" data-mclose aria-label="Tutup">${icon('close')}</button>` : ''}${o.html}</div>`;
    root.classList.add('on');
    const card = $('.mcard', root);
    if (o.onOpen) { try { o.onOpen(card); } catch (e) { console.error(e); } }
    if (o.sound !== false) AUD.S.pop();
  }
  function closeModal(val) {
    if (!modalOpen) return;
    const it = modalOpen;
    if (it.o.onClose) { try { it.o.onClose(val); } catch (e) { console.error(e); } }
    it.resolve(val);
    nextModal();
  }
  function modalCard() { return $('#modal .mcard'); }

  /* klik global */
  function bind() {
    document.addEventListener('click', (e) => {
      const b = e.target.closest('button, .slot, .shop, .act, .opt, .tab, .stab, .sw, .bubble, .tool');
      if (b && !b.hasAttribute('data-nosnd')) AUD.S.tap();
      if (e.target.closest('[data-mclose]')) { closeModal(); return; }
      if (e.target.id === 'modal' && modalOpen && modalOpen.o.dismiss !== false) { closeModal(); return; }
      const a = e.target.closest('[data-act]');
      if (!a) return;
      const act = a.dataset.act;
      const sc = screens[cur];
      if (act === 'back') { if (sc && sc.back) sc.back(a); else go('home', {}, center(a)); }
      else if (act === 'home') go('home', {}, center(a));
      else if (act === 'menu') G.settings();
    });
    // efek tekan untuk sentuhan
    document.addEventListener('pointerdown', (e) => {
      AUD.unlock();
      const b = e.target.closest('.btn');
      if (b) b.classList.add('press');
    }, { passive: true });
    const up = () => $$('.btn.press').forEach((b) => b.classList.remove('press'));
    document.addEventListener('pointerup', up, { passive: true });
    document.addEventListener('pointercancel', up, { passive: true });
  }

  return { reg, go, show, current, def, hud, refreshHud, chip, toast, savedFlash, modal, closeModal, modalCard, bind, center, get busy() { return busy; } };
})();

/* Teks kalimat dengan isian */
function fillLine(arr, vars = {}) {
  return pick(arr).replace(/\{(\w)\}/g, (m, k) => vars[k] || '');
}

/* ---- 34-game.js ---- */
/* ============================================================
   34-game.js — status pemain: koin, bintang, level, barang,
   stiker, pengaturan, kode simpan, berbagi
   ============================================================ */
const G = {
  id: null,
  get S() { return this.id ? Save.slot(this.id) : null; },
  get F() { return FRIENDS[FRIEND_IDX[this.id] || 0]; },
  play(id) {
    Save.ensure(id);
    this.id = id;
    Save.data.lastSlot = id;
    const S = this.S;
    S.played = Date.now();
    S.src = 'local';
    Save.touch(id);
    this.theme();
    this.check();
  },
  theme() {
    const f = this.F;
    const app = $('#app');
    app.style.setProperty('--fc', f.color);
    app.style.setProperty('--fc2', f.color2);
  },
  lookKey() { const S = this.S; return S ? JSON.stringify(S.look) : ''; },

  addCoins(n, xy) {
    const S = this.S;
    S.prog.coins = Math.max(0, S.prog.coins + n);
    if (n > 0) S.prog.earned += n;
    Save.touch(this.id);
    const done = () => UI.refreshHud(true);
    if (xy && n > 0) { FX.flyTo(xy.x, xy.y, UI.chip('coins'), COIN_SVG, Math.min(6, 2 + Math.floor(n / 8)), () => { AUD.S.coin(); done(); }); }
    else done();
    this.check();
  },
  addStars(n, xy) {
    const S = this.S;
    S.prog.stars += n;
    Save.touch(this.id);
    if (xy) FX.flyTo(xy.x, xy.y, UI.chip('stars'), STAR_SVG, n, () => { AUD.S.star(); UI.refreshHud(true); });
    else UI.refreshHud(true);
  },
  addXP(n) {
    const p = this.S.prog;
    if (p.lvl >= MAX_LVL) return [];
    p.xp += n;
    const ups = [];
    while (p.lvl < MAX_LVL && p.xp >= LEVEL_XP(p.lvl)) {
      p.xp -= LEVEL_XP(p.lvl);
      p.lvl++;
      ups.push(p.lvl);
    }
    Save.touch(this.id);
    UI.refreshHud(true);
    if (ups.length) setTimeout(() => this.levelUp(ups[ups.length - 1]), 900);
    this.check();
    return ups;
  },
  levelUp(lvl) {
    AUD.S.levelup();
    FX.rain(110);
    const items = [];
    MENU.forEach((m, i) => { if (m.lvl === lvl) items.push(`<div>${dishSVG(i, orderState(i, makeOrder(i)))}${esc(m.n)}</div>`); });
    SHOPITEMS.forEach(([k, price, ml]) => { if (ml === lvl) items.push(`<div>${itemThumb(k)}${esc(itemName(k))}</div>`); });
    UI.modal({
      cls: 'levelup',
      html: `<div class="ribbon">Hore! Naik level!</div><div class="lvbig" style="margin-top:12px">Level ${lvl}</div>` +
        `<p class="sub" style="margin-top:6px">${items.length ? 'Yang baru terbuka:' : 'Restoranmu makin terkenal!'}</p>` +
        (items.length ? `<div class="unlocks">${items.join('')}</div>` : '') +
        `<div class="row"><button class="btn big mint" data-mclose>Asyik!</button></div>`,
    });
    AUD.say('Hore! Naik ke level ' + lvl + '!');
  },

  /* ---------- barang terkunci ---------- */
  avail(key) {
    const i = SHOPIDX[key];
    if (i == null) return { ok: true };
    const [, price, ml] = SHOPITEMS[i];
    const S = this.S;
    if (ml && S.prog.lvl < ml) return { ok: false, lvl: ml };
    if (price && !S.own.includes(key)) return { ok: false, price };
    return { ok: true };
  },
  tryUse(key, onOK) {
    const a = this.avail(key);
    if (a.ok) { onOK(); return; }
    if (a.lvl) { AUD.S.soft(); UI.toast(`Terbuka di <b>Level ${a.lvl}</b>. Ayo masak di restoran!`, icon('lock', 'tic')); return; }
    const S = this.S;
    const enough = S.prog.coins >= a.price;
    UI.modal({
      html: `<div style="width:150px;height:150px;margin:0 auto">${itemThumb(key)}</div>` +
        `<h3 class="ttl" style="font-size:1.6rem">${esc(itemName(key))}</h3>` +
        `<p class="sub" style="margin-top:6px">${enough ? `Beli seharga <b>${a.price} koin</b>?` : `Butuh <b>${a.price} koin</b>. Koinmu sekarang ${S.prog.coins}. Masak di restoran untuk dapat koin!`}</p>` +
        `<div class="row">${enough ? `<button class="btn big sun" data-buy>${COIN_SVG}Beli ${a.price}</button>` : `<button class="btn big mint" data-gor>${icon('resto')}Ke Restoran</button>`}<button class="btn white" data-mclose>Nanti saja</button></div>`,
      onOpen: (card) => {
        const b = $('[data-buy]', card);
        if (b) b.onclick = () => {
          S.prog.coins -= a.price;
          S.own.push(key);
          Save.touch(this.id);
          UI.refreshHud(true);
          AUD.S.unlock();
          FX.at(b, 'sparkle', 24);
          UI.closeModal();
          UI.toast(`<b>${esc(itemName(key))}</b> jadi milikmu!`, icon('check', 'tic'));
          onOK();
        };
        const g = $('[data-gor]', card);
        if (g) g.onclick = () => { UI.closeModal(); UI.go('resto', {}, UI.center(g)); };
      },
    });
  },

  /* ---------- stiker ---------- */
  award(id) {
    const S = this.S;
    if (!S || S.stk.includes(id)) return;
    S.stk.push(id);
    Save.touch(this.id);
    const i = STK_IDX[id];
    setTimeout(() => {
      AUD.S.unlock();
      UI.toast(`Stiker baru: <b>${esc(STICKERS[i].n)}</b>!`, stickerSVG(i), 2800);
    }, 500);
  },
  check() {
    const S = this.S;
    if (!S) return;
    const p = S.prog;
    const A = (c, id) => { if (c) this.award(id); };
    A(p.days >= 1 || p.served >= 1, 'open');
    A(p.served >= 1, 'first'); A(p.served >= 10, 's10'); A(p.served >= 50, 's50'); A(p.served >= 150, 's150');
    A(p.made[0] >= 10, 'kue'); A(p.made[1] >= 10, 'minum'); A(p.made[2] >= 10, 'makan'); A(p.made[3] >= 10, 'es');
    A(p.perfect >= 10, 'perfect'); A(p.styleCh >= 15, 'style'); A(p.spa >= 1, 'spa'); A(p.nails >= 5, 'nails');
    A(p.photos >= 3, 'photo'); A(S.pet && S.pet.t >= 0, 'pet'); A(p.decorCh >= 5, 'decor'); A(p.gifts >= 3, 'gift');
    A(p.shares >= 1, 'share'); A(p.imports >= 1, 'friend'); A(p.lvl >= 5, 'lv5'); A(p.lvl >= 10, 'lv10'); A(p.earned >= 500, 'rich'); A(p.vip >= 1, 'vip');
    A(FRIENDS.every((f) => Save.slot(f.id)), 'street');
  },
  favDish(i) {
    const p = this.S.prog;
    p.favN[i] = (p.favN[i] || 0) + 1;
    let best = -1, bn = 0;
    for (const [k, v] of Object.entries(p.favN)) if (v > bn) { bn = v; best = +k; }
    p.fav = best;
  },

  /* ---------- hadiah harian ---------- */
  giftReady() { const S = this.S; return S && S.daily !== todayStr(); },
  openGift() {
    let taps = 0;
    UI.modal({
      close: false, dismiss: false,
      html: `<div class="ribbon">Hadiah hari ini!</div><p class="sub" style="margin:10px 0">Ketuk kadonya 3 kali!</p>` +
        `<div class="gift" data-gift>${giftSVG()}</div><div data-res></div>`,
      onOpen: (card) => {
        const gEl = $('[data-gift]', card);
        gEl.onclick = () => {
          if (taps >= 3) return;
          taps++;
          gEl.classList.remove('shake'); void gEl.offsetWidth; gEl.classList.add('shake');
          AUD.S.boing();
          FX.at(gEl, 'sparkle', 10);
          if (taps < 3) return;
          const S = this.S;
          S.daily = todayStr();
          S.prog.gifts++;
          const coins = randi(25, 45);
          let extra = '';
          const locked = SHOPITEMS.filter(([k, pr, ml]) => pr > 0 && pr <= 60 && !S.own.includes(k) && (!ml || S.prog.lvl >= ml));
          if (locked.length && Math.random() < 0.35) {
            const it = pick(locked);
            S.own.push(it[0]);
            extra = `<div style="width:120px;height:120px;margin:8px auto 0">${itemThumb(it[0])}</div><p class="sub">Bonus: <b>${esc(itemName(it[0]))}</b> gratis!</p>`;
          }
          Save.touch(this.id);
          setTimeout(() => {
            AUD.S.gift();
            FX.at(gEl, 'confetti', 50, { speed: 420 });
            gEl.innerHTML = giftSVG(true);
            $('[data-res]', card).innerHTML = `<p class="ttl" style="font-size:1.6rem;margin-top:8px">+${coins} koin!</p>${extra}<div class="row"><button class="btn big mint" data-take>Ambil</button></div>`;
            $('[data-take]', card).onclick = (e) => {
              const c = UI.center(e.currentTarget);

              this.addCoins(coins, c);

        };

  /* ---------- berbagi ---------- */
  inArtifact() { return !!(window.claude && typeof window.claude.use === 'function'); },
  shareBase() {
    if (this.inArtifact()) return null;

  shareLink(slot) {

    return { code, link: base ? base + '#' + code : null };
  },
  async copy(text, btn) {
    let ok = false;

      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) { ok = false; }
      ta.remove();
    }
    if (ok) { AUD.S.select(); UI.toast('Tersalin! Tinggal tempel di chat.', icon('copy', 'tic')); if (btn) FX.at(btn, 'sparkle', 12); }
    else UI.toast('Belum bisa menyalin otomatis. Tekan lama tulisan kodenya lalu pilih Salin.', icon('copy', 'tic'), 3600);

  return L && L[n] ? base + L[n].n : key;

function itemThumb(key) {

    // foto koki
    {
      const { x, y } = L.frame;
      s += `<g transform="translate(${x} ${y}) rotate(-3)"><rect x="-10" y="-10" width="120" height="140" rx="14" fill="#ffe36b" stroke="#e8a21a" stroke-width="4"/><rect width="100" height="120" rx="8" fill="${(FRIENDS[FRIEND_IDX[slot.id]] || FRIENDS[0]).color2}"/>` +
        `<svg x="0" y="4" width="100" height="116" viewBox="${CH.VIEWS.head}">${CH.inner(slot.look, { noShadow: 1, view: 'head' }).svg}</svg>` +
        `<path d="M40 -10L50 -26L60 -10" fill="none" stroke="#8a5a3a" stroke-width="3"/></g>`;
    }
    // rak di belakang konter
    {
      const { x, y, w } = L.shelf;
      for (let k = 0; k < 2; k++) {
        const yy = y + k * 120;
        s += `<rect x="${x}" y="${yy + 90}" width="${w}" height="16" rx="6" fill="#c9905a"/><rect x="${x}" y="${yy + 102}" width="${w}" height="6" fill="#a8703e"/>`;
        const jars = ['#ff9ccf', '#ffd84a', '#9fe8cb', '#c9a8f0', '#ffab5a', '#7fd0ff'];
        for (let i = 0; i < 5; i++) {
          const jx = x + 30 + i * (w - 60) / 4, c = jars[(i + k * 2) % jars.length];
          if ((i + k) % 3 === 2) s += `<g transform="translate(${jx - 36} ${yy + 20}) scale(.36)">${MENU[k ? 2 : 1].draw({ glaze: i % 8, top: [3], _fry: 1, shape: 0, flavor: i % 7, _oven: 1, cream: i % 9 })}</g>`;
          else s += `<rect x="${jx - 20}" y="${yy + 34}" width="40" height="56" rx="10" fill="#ffffff" fill-opacity=".75" stroke="#e0d0e8" stroke-width="3"/><rect x="${jx - 16}" y="${yy + 54}" width="32" height="32" rx="7" fill="${c}"/><rect x="${jx - 22}" y="${yy + 26}" width="44" height="12" rx="4" fill="${dark(c, 0.2)}"/>`;
        }
      }
    }
    // pintu
    {
      const { x, y, w, h } = L.door;
      s += `<rect x="${x - 14}" y="${y - 14}" width="${w + 28}" height="${h + 14}" rx="18" fill="#fff"/><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${dark(sc, 0.05)}"/>` +
        `<rect x="${x + 14}" y="${y + 16}" width="${w - 28}" height="${h * 0.48}" rx="40" fill="url(#${id}sky)"/><rect x="${x + 14}" y="${y + 16}" width="${w - 28}" height="${h * 0.48}" rx="40" fill="url(#${id}glass)"/>` +
        `<circle cx="${x + w - 18}" cy="${y + h * 0.62}" r="7" fill="#ffd84a" stroke="#c98a1e" stroke-width="2"/>` +
        `<g transform="translate(${x + w / 2} ${y + h * 0.36})"><path d="M-24 -40L0 -56L24 -40" fill="none" stroke="#8a5a3a" stroke-width="2.4"/><rect x="-36" y="-40" width="72" height="30" rx="8" fill="#fff" stroke="#e0d0e8" stroke-width="2"/><text x="0" y="-19" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="18" fill="${dark(sc, 0.2)}">BUKA</text></g>` +
        `<path d="M${x + w / 2} ${y - 14}v14" stroke="#c9a24e" stroke-width="3"/><path d="M${x + w / 2 - 10} ${y + 10}a10 10 0 0 1 20 0Z" fill="#ffd84a" stroke="#c98a1e" stroke-width="2"/>`;
    }
    // lantai
    s += `<rect y="${fy}" width="${W}" height="${H - fy}" fill="url(#${id}f)"/>`;
    s += `<rect y="${fy}" width="${W}" height="${H - fy}" fill="url(#g-vdark)" opacity=".5"/><rect y="${fy}" width="${W}" height="10" fill="#3a1a3a" opacity=".08"/>`;
    // karpet depan pintu
    { const { x, w } = L.door; s += `<ellipse cx="${x + w / 2}" cy="${fy + 40}" rx="${w * 0.8}" ry="24" fill="${sc}" opacity=".5"/>`; }
    // kursi di belakang meja
    for (const t of L.tables) {
      s += `<ellipse cx="${t.x}" cy="${t.y + 150}" rx="140" ry="20" fill="#3a1a3a" opacity=".1"/>`;
      s += `<g transform="translate(${t.x} ${t.y})"><rect x="-56" y="-150" width="112" height="140" rx="40" fill="${light(sc, 0.25)}" stroke="${dark(sc, 0.2)}" stroke-width="4"/><rect x="-42" y="-136" width="84" height="56" rx="24" fill="#fff" opacity=".45"/></g>`;
    }
    // konter
    {
      const { x, y, w, h } = L.counter;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="18" fill="${sc}"/>`;
      for (let i = 0; i < 6; i++) s += `<rect x="${x + 14 + i * (w - 28) / 6}" y="${y + 40}" width="${(w - 28) / 12}" height="${h - 56}" rx="6" fill="#fff" opacity=".28"/>`;
      s += `<rect x="${x - 10}" y="${y - 14}" width="${w + 20}" height="34" rx="12" fill="#fbf7fd" stroke="#e2d8ea" stroke-width="3"/><path d="M${x + 30} ${y - 4}q40 10 80 0t90 4" stroke="#e8e0f0" stroke-width="3" fill="none"/>`;
      // kubah kue & mesin kasir
      s += `<g transform="translate(${x + 90} ${y - 14})"><ellipse cx="0" cy="0" rx="56" ry="10" fill="#e2d8ea"/><path d="M-50 0Q-50 -84 0 -84Q50 -84 50 0Z" fill="#dff4ff" fill-opacity=".55" stroke="#bfe0f4" stroke-width="3"/><g transform="translate(-40 -86) scale(.42)">${MENU[1].draw({ shape: 0, flavor: 2, _oven: 1, cream: 0, top: [1] })}</g><circle cx="0" cy="-90" r="7" fill="#bfe0f4"/></g>`;
      s += `<g transform="translate(${x + w - 80} ${y - 14})"><rect x="-44" y="-56" width="88" height="56" rx="10" fill="#9a8ab0"/><rect x="-34" y="-48" width="68" height="20" rx="5" fill="#bff2e0"/><text x="0" y="-33" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="14" fill="#2a6a5a">Rp 0</text><g fill="#fff">${[0, 1, 2].map((i) => `<rect x="${-30 + i * 22}" y="-22" width="16" height="10" rx="3"/>`).join('')}</g></g>`;
    }
    // lampu
    const xs = [];
    for (let x = 200; x < W; x += W > 1000 ? 280 : 260) xs.push(x);
    s += lights(sh.light | 0, W, xs);
    // hiasan
    for (const d of L.decos) s += deco(sh.deco | 0, d.x, d.y, d.s);
    if (L.vig !== false && !L.noVig) s += `<rect width="${W}" height="${H}" fill="url(#${id}vig)"/>`;
    return s + '</svg>';
  }
  /* Latar penuh layar di belakang panggung restoran: dinding & lantai diteruskan
     ke tepi layar (tanpa pita warna polos) — koordinat sama dengan panggung. */
  function backdrop(slot, L, X0, Y0, X1, Y1) {
    const sh = slot.shop;
    const id = uid('bk');
    const wc = WALLC[sh.wall] || WALLC[0];
    const H = L.H, fy = L.floorY, w = X1 - X0;
    const top = Math.min(Y0, 0);
    let s = `<svg viewBox="${r1(X0)} ${r1(Y0)} ${r1(w)} ${r1(Y1 - Y0)}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><defs>${wallPattern(id + 'w', sh.wallP | 0, wc)}${floorPattern(id + 'f', sh.floor | 0)}` +
      `<linearGradient id="${id}g" gradientUnits="userSpaceOnUse" x1="0" y1="${fy}" x2="0" y2="${H}"><stop offset="0" stop-color="#3a1a3a" stop-opacity="0"/><stop offset="1" stop-color="#3a1a3a" stop-opacity=".28"/></linearGradient></defs>`;
    s += `<rect x="${r1(X0)}" y="${r1(Y0)}" width="${r1(w)}" height="${r1(fy - Y0)}" fill="${wc}"/>`;
    if (sh.wallP) s += `<rect x="${r1(X0)}" y="${r1(Y0)}" width="${r1(w)}" height="${r1(fy - Y0)}" fill="url(#${id}w)"/>`;
    s += `<rect x="${r1(X0)}" y="${r1(top)}" width="${r1(w)}" height="${r1(30 - top)}" fill="${dark(wc, 0.08)}"/><rect x="${r1(X0)}" y="30" width="${r1(w)}" height="8" fill="#fff" opacity=".7"/>`;
    s += `<rect x="${r1(X0)}" y="${fy - 120}" width="${r1(w)}" height="120" fill="${dark(wc, 0.06)}"/><rect x="${r1(X0)}" y="${fy - 126}" width="${r1(w)}" height="10" fill="#fff"/>`;
    for (let x = 30 + Math.floor((X0 - 30) / 150) * 150; x < X1; x += 150) s += `<rect x="${x}" y="${fy - 100}" width="120" height="80" rx="10" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="4"/>`;
    s += `<rect x="${r1(X0)}" y="${fy}" width="${r1(w)}" height="${r1(Y1 - fy)}" fill="url(#${id}f)"/>`;
    s += `<rect x="${r1(X0)}" y="${fy}" width="${r1(w)}" height="${r1(Y1 - fy)}" fill="url(#${id}g)" opacity=".5"/><rect x="${r1(X0)}" y="${fy}" width="${r1(w)}" height="10" fill="#3a1a3a" opacity=".08"/>`;
    return s + '</svg>';
  }

  /* meja (di depan pengunjung) */
  function table(slot) {
    const t = slot.shop.table | 0;
    const sc = PAL[slot.shop.sign] ? PAL[slot.shop.sign].c : '#ff6fae';
    let s = '<svg viewBox="0 0 260 170" xmlns="http://www.w3.org/2000/svg">';
    switch (t) {
      case 1:
        s += `<path d="M14 40Q12 120 22 160Q130 176 238 160Q248 120 246 40Z" fill="#ffffff" stroke="#e2d8ea" stroke-width="3"/>`;
        s += `<path d="M22 150${scallop(22, 238, 156, 9, 4)}" fill="none" stroke="${sc}" stroke-width="5"/><path d="M14 60Q130 84 246 60" fill="none" stroke="${sc}" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>`;
        s += `<ellipse cx="130" cy="40" rx="120" ry="26" fill="#ffffff" stroke="#e2d8ea" stroke-width="3"/>`;
        break;
      case 2:
        s += `<rect x="40" y="56" width="16" height="108" rx="6" fill="${dark(sc, 0.15)}"/><rect x="204" y="56" width="16" height="108" rx="6" fill="${dark(sc, 0.15)}"/>`;
        s += `<path d="M18 30H242L250 60H10Z" fill="${sc}" stroke="${dark(sc, 0.3)}" stroke-width="3" stroke-linejoin="round"/><rect x="10" y="58" width="240" height="14" rx="5" fill="${dark(sc, 0.12)}"/>`;
        break;
      case 3:
        s += `<path d="M118 60H142L150 156H110Z" fill="url(#g-gold)" stroke="#c98a1e" stroke-width="2"/><ellipse cx="130" cy="160" rx="54" ry="10" fill="#c98a1e"/>`;
        s += `<ellipse cx="130" cy="48" rx="122" ry="28" fill="#c9c3d6"/><ellipse cx="130" cy="40" rx="122" ry="28" fill="#f8f5fb" stroke="#d8d0e2" stroke-width="3"/><path d="M60 34Q100 26 140 40T220 36" stroke="#e2dcea" stroke-width="3" fill="none"/>`;
        break;
      default:
        s += `<path d="M120 60H140L146 156H114Z" fill="#a8703e" stroke="#7a4a2a" stroke-width="2"/><ellipse cx="130" cy="160" rx="50" ry="10" fill="#8a5a3a"/>`;
        s += `<ellipse cx="130" cy="50" rx="122" ry="28" fill="#a8703e"/><ellipse cx="130" cy="40" rx="122" ry="28" fill="#d8a06a" stroke="#a8703e" stroke-width="3"/><ellipse cx="130" cy="40" rx="96" ry="18" fill="none" stroke="#e8b880" stroke-width="3" opacity=".7"/>`;
    }
    s += `<g transform="translate(212 6)"><rect x="-8" y="0" width="16" height="22" rx="4" fill="#fff" stroke="#e2d8ea" stroke-width="2"/>${flowerSVG(0, -6, 9, '#ff7ab8')}</g>`;
    return s + '</svg>';
  }

  /* ---------- fasad toko (400x470) ---------- */
  function facade(slot, o = {}) {
    const f = FRIENDS[FRIEND_IDX[slot ? slot.id : o.id] || 0];
    const sh = slot ? slot.shop : Save.newSlot(o.id).shop;
    const id = uid('fc');
    const wc = WALLC[sh.wall] || WALLC[0];
    const ac = PAL[sh.awn] ? PAL[sh.awn].c : f.color;
    const sc = PAL[sh.sign] ? PAL[sh.sign].c : f.color;
    const closed = !slot;
    const name = slot ? shopName(slot) : 'Toko ' + f.name;
    let s = `<svg viewBox="0 0 400 470" xmlns="http://www.w3.org/2000/svg"><defs>${wallPattern(id + 'w', sh.wallP | 0, wc)}` +
      `<linearGradient id="${id}in" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffd38a"/></linearGradient>` +
      `<clipPath id="${id}aw"><rect x="6" y="150" width="388" height="80"/></clipPath></defs>`;
    s += `<ellipse cx="200" cy="466" rx="200" ry="10" fill="#3a1a3a" opacity=".12"/>`;
    // bangunan
    s += `<rect x="22" y="70" width="356" height="400" rx="16" fill="${wc}" stroke="${dark(wc, 0.2)}" stroke-width="4"/>`;
    if (sh.wallP) s += `<rect x="22" y="70" width="356" height="400" rx="16" fill="url(#${id}w)"/>`;
    s += `<rect x="10" y="48" width="380" height="34" rx="12" fill="${sc}" stroke="${dark(sc, 0.25)}" stroke-width="4"/><path d="M24 58H376" stroke="#fff" stroke-width="3" opacity=".5"/>`;
    // papan nama
    s += `<rect x="58" y="86" width="284" height="58" rx="20" fill="#fffaf6" stroke="${sc}" stroke-width="6"/>`;
    const fs = name.length > 16 ? (name.length > 19 ? 20 : 23) : 27;
    s += `<text x="200" y="${124 - (27 - fs) / 3}" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="${fs}" fill="${dark(sc, 0.35)}" ${name.length > 19 ? 'textLength="262" lengthAdjust="spacingAndGlyphs"' : ''}>${esc(name)}</text>`;
    // kanopi
    let aw = `<rect x="6" y="150" width="388" height="62" fill="${ac}"/>`;
    if ((sh.awnS | 0) === 0) for (let x = 6; x < 394; x += 48) aw += `<rect x="${x + 24}" y="150" width="24" height="62" fill="#fff"/>`;
    if ((sh.awnS | 0) === 2) for (let x = 26; x < 394; x += 46) aw += `<circle cx="${x}" cy="172" r="8" fill="#fff" opacity=".85"/><circle cx="${x + 23}" cy="194" r="8" fill="#fff" opacity=".85"/>`;
    s += `<path d="M6 150H394V212${scallop(394, 6, 212, 8, 6)}Z" fill="${ac}" stroke="${dark(ac, 0.25)}" stroke-width="4"/>`;
    s += `<g clip-path="url(#${id}aw)"><path d="M6 150H394V212${scallop(394, 6, 212, 8, 6)}Z" fill="none"/>${aw.replace(/<rect x="6" y="150" width="388" height="62" fill="[^"]*"\/>/, '')}</g>`;
    s += `<path d="M6 150H394V212${scallop(394, 6, 212, 8, 6)}Z" fill="url(#g-vdark)" opacity=".35"/><path d="M6 150H394" stroke="${dark(ac, 0.25)}" stroke-width="6"/>`;
    // jendela
    s += `<rect x="38" y="238" width="196" height="160" rx="16" fill="#fff"/><rect x="48" y="248" width="176" height="140" rx="10" fill="url(#${id}in)"/>`;
    if (!closed) {
      s += `<g opacity=".9"><path d="M136 248V270" stroke="#8a6a5a" stroke-width="2"/><path d="M116 290Q118 270 136 270Q154 270 156 290Z" fill="#fff"/><ellipse cx="136" cy="292" rx="40" ry="20" fill="#fff6b0" opacity=".6"/>` +
        `<ellipse cx="96" cy="360" rx="34" ry="9" fill="#d8a06a"/><rect x="92" y="360" width="8" height="28" fill="#a8703e"/><ellipse cx="176" cy="360" rx="34" ry="9" fill="#d8a06a"/><rect x="172" y="360" width="8" height="28" fill="#a8703e"/>` +
        `<g transform="translate(70 312) scale(.28)">${MENU[0].draw({ cup: 0, flavor: 2, _oven: 1, cream: 2, top: [0] })}</g><g transform="translate(150 312) scale(.28)">${MENU[6].draw({ cup: 3, pearl: 0, tea: 0, _pour: 1, straw: 0 })}</g></g>`;
    }
    s += `<path d="M136 248V388M48 318H224" stroke="#fff" stroke-width="6"/><path d="M58 262L96 262L70 300Z" fill="#fff" opacity=".5"/>`;
    s += `<rect x="30" y="396" width="212" height="22" rx="8" fill="${dark(ac, 0.1)}"/>`;
    for (let i = 0; i < 6; i++) s += flowerSVG(46 + i * 36, 394, 11, ['#ff7ab8', '#ffd84a', '#ffffff', '#c9a8ff', '#ff9a5a', '#7fd0ff'][i]);
    // pintu
    s += `<rect x="252" y="236" width="112" height="234" rx="12" fill="#fff"/><rect x="262" y="246" width="92" height="224" rx="8" fill="${dark(sc, 0.08)}"/>`;
    s += `<circle cx="308" cy="300" r="30" fill="url(#${id}in)" stroke="#fff" stroke-width="5"/><circle cx="340" cy="374" r="6" fill="#ffd84a" stroke="#c98a1e" stroke-width="2"/>`;
    if (!closed) s += `<g transform="translate(308 350)"><path d="M-18 -22L0 -34L18 -22" fill="none" stroke="#8a5a3a" stroke-width="2"/><rect x="-28" y="-22" width="56" height="24" rx="6" fill="#fff"/><text x="0" y="-4" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="14" fill="${dark(sc, 0.25)}">BUKA</text></g>`;
    // lampu tali di kanopi
    if (!closed && (sh.light | 0) === 1) { for (let i = 0; i < 9; i++) { const x = 20 + i * 45; s += `<circle cx="${x}" cy="224" r="10" fill="${['#ffe36b', '#ff8cc0', '#7fd0ff'][i % 3]}" opacity=".35"/><circle cx="${x}" cy="224" r="5" fill="${['#ffe36b', '#ff8cc0', '#7fd0ff'][i % 3]}"/>`; } }
    if (!closed && (sh.light | 0) === 2) s += `<g transform="translate(-60 190) scale(.5)">${lights(2, 0, [200, 640])}</g>`;
    if (!closed && (sh.light | 0) === 3) s += `<path d="${starPath(40, 236, 12, 5)}" fill="#ffe36b"/><path d="${starPath(370, 236, 12, 5)}" fill="#ffe36b"/>`;
    // hiasan dekat pintu
    if (!closed) s += deco(sh.deco | 0, 380, 412, 0.5);
    // rolling door bila tutup
    if (closed) {
      s += `<g><rect x="38" y="232" width="196" height="170" rx="10" fill="#d8d2e2"/><rect x="252" y="232" width="112" height="238" rx="10" fill="#d8d2e2"/>`;
      for (let y = 240; y < 400; y += 14) s += `<path d="M42 ${y}H230" stroke="#bcb4cc" stroke-width="3"/>`;
      for (let y = 240; y < 466; y += 14) s += `<path d="M256 ${y}H360" stroke="#bcb4cc" stroke-width="3"/>`;
      s += `<g transform="translate(136 312) rotate(-4)"><rect x="-80" y="-30" width="160" height="62" rx="12" fill="#fff" stroke="${f.color}" stroke-width="4"/><text x="0" y="-2" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="19" fill="${dark(f.color, 0.3)}">Segera Buka!</text><text x="0" y="20" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="700" font-size="13" fill="#7a5a88">tunggu kartu ${esc(f.name)}</text></g></g>`;
    }
    // lencana level
    if (slot) {
      s += `<g transform="translate(352 46)"><circle r="30" fill="#fff" stroke="${f.color}" stroke-width="5"/><text y="-4" text-anchor="middle" font-family="'Baloo 2', sans-serif" font-weight="800" font-size="12" fill="#7a5a88">LEVEL</text><text y="18" text-anchor="middle" font-family="Sniglet, 'Baloo 2', sans-serif" font-weight="800" font-size="22" fill="${dark(f.color, 0.3)}">${slot.prog.lvl}</text></g>`;
    }
    return s + '</svg>';
  }

  /* ---------- latar foto (600x800) ---------- */
  const PHOTO_BG = ['Taman Bunga', 'Pantai', 'Istana', 'Luar Angkasa', 'Monas Jakarta', 'Awan Pelangi', 'Bawah Laut', 'Pesta'];
  function photoBg(i) {
    const id = uid('pb');
    const G2 = (a, b, c) => `<linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${a}"/><stop offset=".6" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></linearGradient>`;
    let s = '';
    switch (i) {
      case 1:
        s = `<defs>${G2('#7fd0ff', '#c8f0ff', '#fff4d6')}</defs><rect width="600" height="800" fill="url(#${id}g)"/><circle cx="470" cy="150" r="60" fill="#ffe36b"/><circle cx="470" cy="150" r="90" fill="#ffe36b" opacity=".25"/>` +
          `<path d="M0 470Q150 450 300 470T600 465V560H0Z" fill="#3fb8e8"/><path d="M0 500Q150 480 300 500T600 495" stroke="#fff" stroke-width="5" fill="none" opacity=".7"/><path d="M0 540Q160 520 320 545T600 535V800H0Z" fill="#ffe0a8"/>` +
          `<path d="M90 560Q100 420 70 300" stroke="#a8703e" stroke-width="18" fill="none" stroke-linecap="round"/><g fill="#4fbf6f">${[0, 1, 2, 3, 4].map((k) => `<ellipse cx="${70 + Math.cos(k * 1.3) * 60}" cy="${300 + Math.sin(k * 1.3) * 26}" rx="70" ry="18" transform="rotate(${k * 36 - 60} ${70 + Math.cos(k * 1.3) * 60} ${300 + Math.sin(k * 1.3) * 26})"/>`).join('')}</g>` +
          `<g transform="translate(470 640)"><path d="M-30 0a30 30 0 0 1 60 0Z" fill="#ff8cc0"/><path d="M-30 0a30 30 0 0 1 60 0" fill="none" stroke="#fff" stroke-width="5" stroke-dasharray="10 10"/></g>`;
        break;
      case 2:
        s = `<defs>${G2('#ffd6ec', '#ffeef6', '#e8f8ff')}</defs><rect width="600" height="800" fill="url(#${id}g)"/>` +
          `<g fill="#ffb3d6" stroke="#e57aa4" stroke-width="5"><rect x="140" y="250" width="320" height="300"/><rect x="90" y="190" width="90" height="360"/><rect x="420" y="190" width="90" height="360"/><rect x="250" y="150" width="100" height="160"/></g>` +
          `<g fill="#b49bff" stroke="#8a6ad8" stroke-width="5"><path d="M80 194L135 100L190 194Z"/><path d="M410 194L465 100L520 194Z"/><path d="M240 154L300 50L360 154Z"/></g>` +

/* ============================================================
   50-title.js — layar pembuka & pilih sahabat (5 slot simpan)
   ============================================================ */
function cloudsHTML(n = 5) {
  let s = '';
  for (let i = 0; i < n; i++) {
    s += `<div class="cloud" style="top:${6 + ((i * 17) % 40)}%;--s:${(0.6 + ((i * 37) % 50) / 100).toFixed(2)};animation-duration:${38 + i * 9}s;animation-delay:-${i * 11}s"></div>`;
  }
  return `<div class="skyl">${s}</div>`;
}

UI.reg('title', {
  color: '#ff8cc0',
  build() {
    const word = 'Salon & Resto';
    const letters = word.split('').map((c, i) => (c === ' ' ? ' ' : `<b style="animation-delay:${(i * 0.09).toFixed(2)}s">${esc(c)}</b>`)).join('');
    this.el = h(`<section class="screen" id="scr-title">${cloudsHTML(6)}
      <div class="logo"><span class="l1">LaVa Games</span><span class="l2">${letters}</span><span class="l3">Pilih namamu untuk mulai main!</span></div>
      <div class="slots" role="list"></div>
      <div class="titlebar">
        <button class="btn sky" data-code>${icon('key')}Masukkan Kode</button>
        <button class="btn grape" data-help>${icon('users')}Main bareng sahabat</button>
        <button class="btn round mint" data-snd aria-label="Musik">${icon('music')}</button>
      </div></section>`);
    $('#app').appendChild(this.el);
    $('[data-code]', this.el).onclick = () => G.enterCodeModal(() => this.render());
    $('[data-help]', this.el).onclick = () => G.helpModal();
    $('[data-snd]', this.el).onclick = () => {
      const st = Save.data.settings;
      st.music = !st.music;
      AUD.unlock();
      AUD.set({ music: st.music });
      UI.toast(st.music ? 'Musik menyala' : 'Musik dimatikan', icon('music', 'tic'));
      Save.write();
    };
  },
  render() {
    const box = $('.slots', this.el);
    const last = Save.data.lastSlot;
    box.innerHTML = '';
    FRIENDS.forEach((f, i) => {
      const s = Save.slot(f.id);
      const look = s ? s.look : defaultLook(f.id);
      const card = h(`<button class="slot ${last === f.id ? 'last' : ''}" role="listitem" style="--fc:${f.color};--fc2:${f.color2};animation:popIn .6s var(--spring) ${(i * 0.08).toFixed(2)}s both" aria-label="Main sebagai ${esc(f.name)}">
        ${!s ? '<span class="ribbon new">Baru!</span>' : ''}
        ${s && s.src === 'kode' ? '<span class="kode">dari kartu</span>' : ''}
        <div class="sstage">${CH.svg(look, { view: 'tight', pose: last === f.id ? 'wave' : 'idle', expr: last === f.id ? 'happy' : 'idle' })}</div>
        <div class="nm">${esc(f.name)}</div>
        <div class="meta">${s ? `<span>${STAR_SVG}${s.prog.stars}</span><span>Lv ${s.prog.lvl}</span>` : '<span>Mulai main</span>'}</div>
      </button>`);
      card.onclick = () => {
        AUD.unlock();
        AUD.S.select();
        const first = !Save.slot(f.id);
        G.play(f.id);
        UI.go('home', { first }, UI.center(card));
      };
      box.appendChild(card);
    });
    const lastEl = last && $$('.slot', box)[FRIEND_IDX[last]];
    if (lastEl && box.scrollWidth > box.clientWidth) lastEl.scrollIntoView({ inline: 'center', block: 'nearest' });
  },
  enter() {
    AUD.setMood('home');
    this.render();
  },
});

const ACTS = [

];

UI.reg('home', {
  color: '#7fd0ff',
  build() {
    this.el = h(`<section class="screen" id="scr-home">${cloudsHTML(5)}
      <div class="home-scene"><div class="ground"></div><div class="facade"></div></div>
      <div class="home-hero" role="button" tabindex="0" aria-label="Karaktermu"></div>
      <div class="acts left"></div><div class="acts right"></div>
      ${UI.hud({ back: true })}</section>`);
    $('#app').appendChild(this.el);
    const hero = $('.home-hero', this.el);
    hero.onclick = () => this.poke();
  },
  back(btn) { UI.go('title', {}, UI.center(btn)); },
  enter(p = {}) {
    AUD.setMood('home');
    const S = G.S, F = G.F;
    $('.facade', this.el).innerHTML = SCN.facade(S);
    $('.home-hero', this.el).innerHTML = CH.svg(S.look, { view: 'tight', pose: p.first ? 'wave' : 'idle', expr: p.first ? 'happy' : 'idle' }) + (S.pet.t >= 0 ? PET.full(S.pet) : '');
    const mk = (a, i) => {
      let badge = '';
      if (a.id === 'gift') { if (!G.giftReady()) return ''; badge = '<span class="badge">1</span>'; }
      if (a.id === 'stickers' && S.stk.length) badge = `<span class="badge" style="background:#9a6bff;box-shadow:0 2px 0 #7442e0">${S.stk.length}</span>`;
      return `<button class="act ${a.big ? 'big' : ''} ${a.id === 'gift' ? 'wiggle' : ''}" data-go="${a.id}" style="--c:${a.c};--c2:${a.c2};--d:${a.d};animation-delay:${(i * 0.05).toFixed(2)}s">${icon(a.ic)}<span>${a.n}</span>${badge}</button>`;
    };
    $('.acts.left', this.el).innerHTML = ACTS.slice(0, 4).map(mk).join('');
    $('.acts.right', this.el).innerHTML = ACTS.slice(4).map((a, i) => mk(a, i + 4)).join('');
    $$('[data-go]', this.el).forEach((b) => b.onclick = () => {
      const id = b.dataset.go;
      if (id === 'gift') { G.openGift(); return; }
      UI.go(id, {}, UI.center(b));
    });
    clearTimeout(this.t1);
    if (p.keep) return;
    this.t1 = setTimeout(() => {
      const line = p.first ? `Halo! Aku ${F.name}. Yuk dandan dulu, lalu buka restoran!` : fillLine(LINES.home);
      this.say(line);
      if (p.first) AUD.say(line, 1.3);
    }, 700);
  },
  leave() { clearTimeout(this.t1); clearTimeout(this.t2); $$('.speech', this.el).forEach((e) => e.remove()); },
  say(text) {
    $$('.speech', this.el).forEach((e) => e.remove());
    const hero = $('.home-hero', this.el);
    const r = hero.getBoundingClientRect();
    const sp = h(`<div class="speech">${esc(text)}</div>`);
    sp.style.left = Math.max(10, Math.min(innerWidth - 250, r.left + r.width * 0.55)) + 'px';
    sp.style.top = Math.max(70, r.top - 10) + 'px';
    this.el.appendChild(sp);
    clearTimeout(this.t2);
    this.t2 = setTimeout(() => sp.remove(), 3600);
  },
  poke() {
    const S = G.S;
    const hero = $('.home-hero', this.el);
    const svg = $('svg.chr', hero);
    const r = Math.random();
    if (r < 0.4) {
      hero.innerHTML = CH.svg(S.look, { view: 'tight', pose: 'wave', expr: 'happy' }) + (S.pet.t >= 0 ? PET.full(S.pet, { expr: 'joy' }) : '');
      AUD.S.giggle();
    } else if (r < 0.75) {
      if (svg) { svg.classList.remove('hopnow'); void svg.getBoundingClientRect(); svg.classList.add('hopnow'); CH.setExpr(svg, S.look, 'joy'); }
      AUD.S.boing();
    } else {
      hero.innerHTML = CH.svg(S.look, { view: 'tight', pose: 'peace', expr: 'wink' }) + (S.pet.t >= 0 ? PET.full(S.pet, { expr: 'joy' }) : '');
      AUD.S.giggle();
    }
    FX.at(hero, 'heart', 8, { speed: 220, up: 120 });
    this.say(fillLine(LINES.home));
    clearTimeout(this.t3);
    this.t3 = setTimeout(() => {
      if (UI.current() !== 'home') return;
      hero.innerHTML = CH.svg(S.look, { view: 'tight' }) + (S.pet.t >= 0 ? PET.full(S.pet) : '');
    }, 2600);
  },
});

    else { look.dr = 0; look.tp = P('tp', TOPS.length); look.tc = randi(0, PAL.length - 1); look.tpp = Math.random() < 0.3 ? randi(1, 7) : 0; look.bt = P('bt', BOTTOMS.length); look.bc = randi(0, PAL.length - 1); look.bpp = Math.random() < 0.2 ? randi(1, 7) : 0; }
    look.sh = P('sh', SHOES.length); look.shc = randi(0, PAL.length - 1);

    const who = $('.who', this.el);

    AUD.S.boing();
